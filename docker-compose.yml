#############################################################################
#
#     🧩 Fragments | https://docs.docker.com/compose/compose-file/11-extension/
#
#############################################################################
x-build-secrets: &build-secrets
  - gcs_credentials

x-openthrottle-common: &openthrottle-common
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  NODE_ENV: ${NODE_ENV}
  NODE_VERSION: ${NODE_VERSION}
  NX_KEY: ${NX_KEY}
  NX_VERSION: ${NX_VERSION}
  PNPM_VERSION: ${PNPM_VERSION}

x-openthrottle-developer: &openthrottle-developer
  <<: *openthrottle-common
  API_URL: ${OPENTHROTTLE_DEVELOPER_API_URL}
  API_URL_INTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}
  API_URL_EXTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_EXTERNAL}
  API_URL_WEBSOCKET: ${OPENTHROTTLE_DEVELOPER_API_URL_WEBSOCKET}
  APP_ENV: ${OPENTHROTTLE_DEVELOPER_APP_ENV}
  APP_NAME: ${OPENTHROTTLE_DEVELOPER_APP_NAME}
  APP_URL: ${OPENTHROTTLE_DEVELOPER_APP_URL}
  APP_VERSION: ${OPENTHROTTLE_DEVELOPER_APP_VERSION}
  PORT: ${OPENTHROTTLE_DEVELOPER_PORT}

x-openthrottle-server: &openthrottle-server
  <<: *openthrottle-common
  APP_ENV: ${OPENTHROTTLE_SERVER_APP_ENV}
  APP_NAME: ${OPENTHROTTLE_SERVER_APP_NAME}
  APP_URL: ${OPENTHROTTLE_SERVER_APP_URL}
  APP_VERSION: ${OPENTHROTTLE_SERVER_APP_VERSION}
  CORS_CREDENTIALS: ${OPENTHROTTLE_SERVER_CORS_CREDENTIALS}
  CORS_ORIGINS: ${OPENTHROTTLE_SERVER_CORS_ORIGINS}
  PORT: ${OPENTHROTTLE_SERVER_PORT}

name: OT
services:
  #############################################################################
  #
  #     🤖 openthrottle-developer | React Router (MCP developer UI)
  #
  #     Built from monorepo root per docs/openthrottle/docker-image-build-strategy.md.
  #     Depends on openthrottle-server for GraphQL/Cortex; run compose from repo root:
  #     docker compose -f applications/openthrottle/docker-compose.yml up --build
  #
  openthrottle-developer:
    build:
      args:
        <<: *openthrottle-developer
      context: ./
      dockerfile: Dockerfile.ReactRouter.v2
      secrets: *build-secrets
      target: production-alpine
    container_name: openthrottle-developer
    # command: echo "Hello, world!"
    depends_on:
      openthrottle-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *openthrottle-developer
    ports:
      - "${OPENTHROTTLE_DEVELOPER_PORT}:${OPENTHROTTLE_DEVELOPER_PORT}"
    restart: always
    # user: "appuser"

  #############################################################################
  #
  #     🤖 Postgres | https://hub.docker.com/_/postgres
  #
  #     A relational database for plans ingestion with Vector Search
  #     (pgvector) enabled
  #
  openthrottle-postgres:
    build:
      args:
        POSTGRES_DB: ${OPENTHROTTLE_POSTGRES_DB}
        POSTGRES_PASSWORD: ${OPENTHROTTLE_POSTGRES_PASSWORD}
        POSTGRES_PORT: ${OPENTHROTTLE_POSTGRES_PORT}
        POSTGRES_USER: ${OPENTHROTTLE_POSTGRES_USER}
        POSTGRES_VERSION: ${OPENTHROTTLE_POSTGRES_VERSION}
      context: ./
      dockerfile: Dockerfile.Postgres
    container_name: openthrottle-postgres
    healthcheck:
      interval: 1s
      retries: 10
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${OPENTHROTTLE_POSTGRES_USER} -d ${OPENTHROTTLE_POSTGRES_DB}",
        ]
      timeout: 5s
    ports:
      - ${OPENTHROTTLE_POSTGRES_PORT}:5432
    restart: always
    shm_size: 128mb # set shared memory limit when using docker compose (required for pgvector)
    volumes:
      - cortex_postgres_data:/var/lib/postgresql/data

  #############################################################################
  #
  #     🤖 Redis | https://hub.docker.com/_/redis
  #
  #     Redis is the world’s fastest data platform for caching, vector search,
  #     and NoSQL databases.
  #
  openthrottle-redis:
    command: redis-server
    container_name: openthrottle-redis
    healthcheck:
      interval: 10s
      retries: 3
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
    image: redis:${OPENTHROTTLE_REDIS_VERSION}-alpine
    ports:
      - ${OPENTHROTTLE_REDIS_PORT}:6379
    restart: always

  #############################################################################
  #
  #     🤖 openthrottle-server | NestJS API (GraphQL, Cortex, MCP)
  #
  #     Built from monorepo root per docs/openthrottle/docker-image-build-strategy.md.
  #     Run compose from repo root so build context is correct:
  #     docker compose -f applications/openthrottle/docker-compose.yml up openthrottle-server --build
  #
  openthrottle-server:
    build:
      args:
        <<: *openthrottle-server
      context: ./
      dockerfile: Dockerfile.NestJS.v2
      secrets: *build-secrets
    container_name: openthrottle-server
    # depends_on:
    #   openthrottle-postgres:
    #     condition: service_healthy
    #   openthrottle-redis:
    #     condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *openthrottle-server
      POSTGRES_HOST: ${OPENTHROTTLE_POSTGRES_HOST}
      POSTGRES_DB: ${OPENTHROTTLE_POSTGRES_DB}
      POSTGRES_PASSWORD: ${OPENTHROTTLE_POSTGRES_PASSWORD}
      POSTGRES_PORT: ${OPENTHROTTLE_POSTGRES_PORT}
      POSTGRES_USER: ${OPENTHROTTLE_POSTGRES_USER}
      POSTGRES_VERSION: ${OPENTHROTTLE_POSTGRES_VERSION}
      REDIS_HOST: ${OPENTHROTTLE_REDIS_HOST}
      REDIS_PORT: ${OPENTHROTTLE_REDIS_PORT}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:${OPENTHROTTLE_SERVER_PORT}/health || exit 1",
        ]
      timeout: 10s
    ports:
      - "${OPENTHROTTLE_SERVER_PORT}:${OPENTHROTTLE_SERVER_PORT}"
    restart: always

#############################################################################
#
#     🔐 Secrets | Build secrets for Docker builds
#
#############################################################################
secrets:
  gcs_credentials:
    file: ${GCS_CREDENTIALS_PATH:-~/.config/gcloud/application_default_credentials.json}

#############################################################################
#
#     🎧 Volumes | Persistent "named" volumes
#
volumes:
  cortex_postgres_data:
