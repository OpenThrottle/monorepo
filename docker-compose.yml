#############################################################################
#
#     🚀 Verified run | from the repo root:
#
#         docker compose up --build
#
#     Brings up postgres + redis + migrations + server + developer.
#     Config is interpolated from the repo-root `.env` (see `.env.default`).
#
#     Canonical images: server → Dockerfile.NestJS, developer →
#     Dockerfile.ReactRouter, postgres → Dockerfile.Postgres (the Postgres
#     build COPYs ./databases/seed.sql, so generate it first if missing),
#     migrations → Dockerfile.Migrations (one-shot; server waits for it).
#
#     Networking (Docker Desktop): the server reaches postgres/redis via
#     host.docker.internal:${POSTGRES_PORT}/${REDIS_PORT} (the published host
#     ports), and the developer reaches the server via
#     ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}=http://host.docker.internal:${OPENTHROTTLE_SERVER_PORT}.
#
#     Verified healthy: server GET /health → 200
#     {api,database,redis,websocket:ok}; developer GET / → 200.
#
#     🔐 First-time provisioning (fully-Dockerized) | `up` never provisions a
#     database. After the stack is up, seed the login user + service-account
#     bearer credentials ONCE with the manually-invoked `bootstrap` service:
#
#         docker compose run --rm bootstrap
#
#     Idempotent. Exact copy-pasteable steps (local + shared DB) live in
#     databases/README.md § "Bootstrapping a fully-Dockerized install".
#
#     🔧 Dev mode (contributors) | hot reload from source, no distroless rebuilds:
#
#         docker compose --profile dev watch       # build dev images, start, sync on save
#         docker compose --profile dev up --build  # same, without file watching
#
#     server-dev/developer-dev run the Dockerfile `development` targets
#     (pnpm nx run <app>:dev) on the same published ports as the prod
#     services. Profiles keep the modes exclusive: server/developer are in
#     the `prod` profile (enabled by default via COMPOSE_PROFILES="prod" in
#     .env), server-dev/developer-dev in `dev`; postgres/redis/migrations are
#     shared (no profile). Dev services talk to postgres/redis via compose
#     service names; the server's Node inspector is published on 9229.
#
#############################################################################

#############################################################################
#
#     🧩 Fragments | https://docs.docker.com/compose/compose-file/11-extension/
#
#############################################################################
x-build-secrets: &build-secrets
  - gcs_credentials

x-common: &common
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  NODE_ENV: ${NODE_ENV}
  NODE_VERSION: ${NODE_VERSION}
  NX_KEY: ${NX_KEY}
  NX_VERSION: ${NX_VERSION}
  OT_CONTAINER_PREFIX: 'OpenThrottle-'
  PNPM_VERSION: ${PNPM_VERSION}

x-developer: &developer
  <<: *common
  API_URL_EXTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_EXTERNAL}
  API_URL_INTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}
  # API_URL_INTERNAL: http://server:${OPENTHROTTLE_SERVER_PORT}
  APP_ENV: ${APP_ENV}
  APP_NAME: ${OPENTHROTTLE_DEVELOPER_APP_NAME}
  APP_NAME_SHORT: ${OPENTHROTTLE_DEVELOPER_APP_NAME_SHORT}
  APP_URL: ${OPENTHROTTLE_DEVELOPER_APP_URL}
  APP_URL_ADMIN: ${OPENTHROTTLE_DEVELOPER_APP_URL_ADMIN}
  APP_URL_CMS: ${OPENTHROTTLE_DEVELOPER_APP_URL_CMS}
  APP_URL_DEVELOPER: ${OPENTHROTTLE_DEVELOPER_APP_URL_DEVELOPER}
  APP_URL_EMAIL: ${OPENTHROTTLE_DEVELOPER_APP_URL_EMAIL}
  APP_URL_SERVER: ${OPENTHROTTLE_DEVELOPER_APP_URL_SERVER}
  APP_URL_WEBSITE: ${OPENTHROTTLE_DEVELOPER_APP_URL_WEBSITE}
  APP_VERSION: ${APP_VERSION}
  PORT: ${OPENTHROTTLE_DEVELOPER_PORT}

x-server: &server
  <<: *common
  API_URL_EXTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_EXTERNAL}
  API_URL_INTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}
  # API_URL_INTERNAL: http://server:${OPENTHROTTLE_SERVER_PORT}
  APP_ENV: ${APP_ENV}
  APP_NAME: ${OPENTHROTTLE_SERVER_APP_NAME}
  APP_NAME_SHORT: ${OPENTHROTTLE_SERVER_APP_NAME_SHORT}
  APP_URL: ${OPENTHROTTLE_SERVER_APP_URL}
  APP_URL_INTERNAL: ${OPENTHROTTLE_SERVER_APP_URL}
  APP_URL_EXTERNAL: ${OPENTHROTTLE_SERVER_APP_URL}
  APP_VERSION: ${APP_VERSION}
  # The Bull Board dashboard is enabled whenever NODE_ENV != production and
  # hard-requires admin credentials at boot. Their canonical home is the
  # app's .env, which is (correctly) never baked into images — so pass them
  # through here with dev-only defaults for this dev-profile service.
  BULLMQ_BOARD_ADMIN_PASSWORD: ${BULLMQ_BOARD_ADMIN_PASSWORD:-openthrottle-dev}
  BULLMQ_BOARD_ADMIN_USERNAME: ${BULLMQ_BOARD_ADMIN_USERNAME:-admin}
  CORS_CREDENTIALS: ${OPENTHROTTLE_SERVER_CORS_CREDENTIALS}
  CORS_ORIGINS: ${OPENTHROTTLE_SERVER_CORS_ORIGINS}
  JWT_SECRET: ${OPENTHROTTLE_DEVELOPER_JWT_SECRET}
  PORT: ${OPENTHROTTLE_SERVER_PORT}

#############################################################################
#
#     🐳 Compose Links | https://docs.docker.com/compose/compose-file/14-include
#
# include:
#   - ./services/openclaw/docker-compose.yml

name: 'OpenThrottle'

services:
  #############################################################################
  #
  #     🤖 developer | React Router (MCP developer UI)
  #
  developer:
    build:
      args:
        <<: *developer
      context: ./
      dockerfile: Dockerfile.ReactRouter
      secrets: *build-secrets
      target: production
    container_name: ${OT_CONTAINER_PREFIX:-}developer
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *developer
      # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset):
      # the IDE engine runs in this SSR process and reads registered checkouts.
      OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
      OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
    image: openthrottle/developer:latest
    ports:
      - '${OPENTHROTTLE_DEVELOPER_PORT}:${OPENTHROTTLE_DEVELOPER_PORT}'
    profiles: [prod]
    restart: always
    volumes:
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'
    # No `user:` override: the distroless `nonroot` image (Dockerfile.ReactRouter production)
    # already runs as uid 65532; `user: appuser` would fail ("no matching entries in passwd").

  #############################################################################
  #
  #     🔧 developer-dev | React Router dev server (hot reload; profile: dev)
  #
  developer-dev:
    build:
      args:
        <<: *developer
      context: ./
      dockerfile: Dockerfile.ReactRouter
      secrets: *build-secrets
      target: development
    container_name: ${OT_CONTAINER_PREFIX:-}developer-dev
    depends_on:
      server-dev:
        # Healthy, not just started: serializes the two heavy cold-starts (the
        # concurrent Nx/tsc/Vite watchers can exceed the Docker VM's memory) and
        # guarantees the API is up before SSR/codegen reach for it.
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./applications
          target: /app/applications
        - action: sync
          path: ./packages
          target: /app/packages
        - action: sync
          path: ./tools
          target: /app/tools
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
    env_file:
      - .env
    environment:
      <<: *developer
      APP_ENV: development
      NODE_ENV: development

      # SSR fetches stay on the compose network; the browser keeps localhost.
      API_URL_INTERNAL: http://server-dev:${OPENTHROTTLE_SERVER_PORT}
      # Vite must bind 0.0.0.0 to be reachable through the published port.
      HOST: 0.0.0.0
      # Cap the Vite/dev-server heap — an unbounded Node heap plus the codegen and
      # tsc watchers can trip the Docker VM's OOM killer on cold start.
      NODE_OPTIONS: --max-old-space-size=4096
      # No GCS credentials at runtime — a present NX_KEY would otherwise make Nx
      # reach for the remote cache and abort (same guard as the Dockerfile build).
      NX_DISABLE_REMOTE_CACHE: 'true'
      # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset):
      # the IDE engine runs in this SSR process and reads registered checkouts.
      OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
      OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
      npm_config_store_dir: /pnpm/store
    image: openthrottle/developer:dev
    ports:
      - '${OPENTHROTTLE_DEVELOPER_PORT}:${OPENTHROTTLE_DEVELOPER_PORT}'
    profiles: [dev]
    restart: 'no'
    volumes:
      - pnpm_store:/pnpm/store
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'

  #############################################################################
  #
  #     🤖 Postgres | https://hub.docker.com/_/postgres
  #
  #     A relational database for plans ingestion with Vector Search
  #     (pgvector) enabled
  #
  postgres:
    build:
      args:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_PORT: ${POSTGRES_PORT}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_VERSION: ${POSTGRES_VERSION}
      context: ./
      dockerfile: applications/openthrottle/Dockerfile.Postgres
    container_name: ${OT_CONTAINER_PREFIX:-}postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_VERSION: ${POSTGRES_VERSION}
    healthcheck:
      interval: 1s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      timeout: 5s
    image: openthrottle/postgres:latest
    ports:
      - ${POSTGRES_PORT}:5432
    restart: always
    shm_size: 128mb # set shared memory limit when using docker compose (required for pgvector)
    volumes:
      # 🔀 Local DB volume toggle — exactly ONE mount below is active.
      # Default = the fresh/public demo DB. To restore your pre-public personal
      # data, comment the `postgres_data` line and uncomment the
      # `postgres_data_dev_personal` line, then restart postgres. Both volumes
      # are declared under the top-level `volumes:` block. See
      # databases/README.md § "Local Postgres volumes (personal ↔ public)".
      # ⚠️ Never `docker compose down -v` — it destroys BOTH volumes, wiping the
      # personal archive. Use `docker compose stop postgres` to swap safely.
      - postgres_data_dev_personal:/var/lib/postgresql # 🔒 pre-public personal archive (PG18 path)
      # - postgres_data:/var/lib/postgresql # 🌱 fresh/public demo DB (active; PG18 path)
      # - postgres_data:/var/lib/postgresql/data # use with Postgres 17

  #############################################################################
  #
  #     🗄️ migrations | one-shot: apply incremental migrations, then exit
  #
  #     Shared (no profile) so both prod and dev servers wait for schema
  #     upgrades before starting. On a clean volume the seeded postgres image
  #     already applies seed.sql; this runner covers UPGRADES (idempotent).
  #
  migrations:
    build:
      args:
        NODE_VERSION: ${NODE_VERSION}
      context: ./
      dockerfile: Dockerfile.Migrations
    container_name: ${OT_CONTAINER_PREFIX:-}migrations
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # Compose-network hostname + container port (not host.docker.internal /
      # published POSTGRES_PORT — those are for host-side clients).
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
    image: openthrottle/migrations:latest
    restart: 'no'

  #############################################################################
  #
  #     🔐 bootstrap | one-shot MANUAL: default user + service-account creds
  #
  #     NEVER runs on `docker compose up` — it lives in its own `bootstrap`
  #     profile and NO service depends_on it (up must never silently provision a
  #     possibly-shared DB). Provision a fresh (or shared) database ONCE with:
  #
  #         docker compose run --rm bootstrap
  #
  #     Runs the Dockerfile.NestJS `bootstrap` stage entrypoint
  #     (scripts/docker-bootstrap.sh): seed the default login user, then upsert
  #     the service-account credentials. Idempotent — safe to re-run. Target a
  #     shared DB by pointing POSTGRES_HOST/PORT at it. The bearer tokens and the
  #     optional OPENTHROTTLE_BOOTSTRAP_USER_EMAIL/_PASSWORD overrides flow in
  #     from `.env` via env_file.
  #
  bootstrap:
    build:
      args:
        <<: *server
      context: ./
      dockerfile: Dockerfile.NestJS
      secrets: *build-secrets
      target: bootstrap
    container_name: ${OT_CONTAINER_PREFIX:-}bootstrap
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose-network hostname + container port (not host.docker.internal /
      # published POSTGRES_PORT — those are for host-side clients). Same shape as
      # the migrations runner. Everything else (tokens, user overrides) arrives
      # via env_file above.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
    image: openthrottle/bootstrap:latest
    profiles: [bootstrap]
    restart: 'no'

  #############################################################################
  #
  #     🤖 Redis | https://hub.docker.com/_/redis
  #
  #     Redis is the world’s fastest data platform for caching, vector search,
  #     and NoSQL databases.
  #
  redis:
    command: redis-server
    container_name: ${OT_CONTAINER_PREFIX:-}redis
    healthcheck:
      interval: 10s
      retries: 3
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 5s
    image: redis:${REDIS_VERSION}-alpine
    ports:
      - ${REDIS_PORT}:6379
    restart: always

  #############################################################################
  #
  #     🤖 server | NestJS API (GraphQL, Postgres, Redis, MCP)
  #
  server:
    build:
      args:
        <<: *server
      context: ./
      dockerfile: Dockerfile.NestJS
      secrets: *build-secrets
    container_name: ${OT_CONTAINER_PREFIX:-}server
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *server
      # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset):
      # registered checkout paths are validated/searched/executed in this process.
      OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
      OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_VERSION: ${POSTGRES_VERSION}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    # Healthcheck is provided by the image: Dockerfile.NestJS (distroless) ships a HEALTHCHECK
    # that hits GET /health on PORT via /nodejs/bin/node. Do NOT override it here with
    # /usr/local/bin/node — that path does not exist on distroless and would mark the server
    # permanently unhealthy (which would also block developer's depends_on).
    image: openthrottle/server:latest
    ports:
      - '${OPENTHROTTLE_SERVER_PORT}:${OPENTHROTTLE_SERVER_PORT}'
    profiles: [prod]
    restart: always
    volumes:
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'
    # No `user:` override: the distroless `nonroot` image already runs as uid 65532, and the pruned
    # tree is COPYed with --chown=65532. `user: appuser` would fail ("no matching entries in passwd").

  #############################################################################
  #
  #     🔧 server-dev | NestJS dev server (hot reload + inspector; profile: dev)
  #
  server-dev:
    build:
      args:
        <<: *server
      context: ./
      dockerfile: Dockerfile.NestJS
      secrets: *build-secrets
      target: development
    # dev-debug = dev with the Node inspector on 0.0.0.0:9229 (see the app's package.json).
    command: ['sh', '-c', 'pnpm nx run openthrottle-server:dev-debug']
    container_name: ${OT_CONTAINER_PREFIX:-}server-dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./applications
          target: /app/applications
        - action: sync
          path: ./packages
          target: /app/packages
        - action: sync
          path: ./tools
          target: /app/tools
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
    env_file:
      - .env
    environment:
      <<: *server
      APP_ENV: development
      NODE_ENV: development
      # Service-to-service traffic stays on the compose network (container ports),
      # decoupled from the published host ports.
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_VERSION: ${POSTGRES_VERSION}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Mounted checkouts are owned by a host uid; trust them for git operations
      # (worktrees, status) without needing an entrypoint script.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
      # No GCS credentials at runtime — a present NX_KEY would otherwise make Nx
      # reach for the remote cache and abort (same guard as the Dockerfile build).
      NX_DISABLE_REMOTE_CACHE: 'true'
      # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset):
      # registered checkout paths are validated/searched/executed in this process.
      OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
      OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
      npm_config_store_dir: /pnpm/store
    # The development image has no in-image HEALTHCHECK (that lives in the
    # distroless production stage); probe /health with the image's own node.
    # Generous start_period: the cold start compiles the workspace in watch mode.
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 600s
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:'+String(process.env.PORT||'3000')+'/health',function(r){r.resume();r.on('end',function(){process.exit(r.statusCode===200?0:1)})}).on('error',function(){process.exit(1)})",
        ]
      timeout: 10s
    image: openthrottle/server:dev
    ports:
      - '${OPENTHROTTLE_SERVER_PORT}:${OPENTHROTTLE_SERVER_PORT}'
      - '9229:9229' # Node inspector (dev-debug)
    profiles: [dev]
    restart: 'no'
    volumes:
      - pnpm_store:/pnpm/store
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'
      # SSH-based git remotes (optional, Docker Desktop): uncomment to forward the
      # host SSH agent; HTTPS remotes already work via the GITHUB_TOKEN env.
      # - '/run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock'

  #############################################################################
  #
  #     🎙️ whisper | WhisperLive STT (opt-in; profile: voice)
  #
  #     Streaming speech-to-text for the developer-app voice-input spike
  #     (Collabora WhisperLive, faster-whisper backend). Opt-in profile so the
  #     default `docker compose up` and `pnpm run database:start` never pull
  #     this image. Start it with `pnpm run voice:start`.
  #
  #     Streaming contract (details: docs/openthrottle/voice-whisperlive-spike.md):
  #     websocket connect → JSON config handshake (uid, model, language, task)
  #     → raw 16kHz mono Float32 PCM binary frames upstream → JSON segment
  #     lists downstream, where the tail segment REVISES until marked
  #     completed. That revising behavior is why the GraphQL transcription
  #     layer uses snapshot-replace semantics instead of delta-append.
  #
  #     WHISPER_MODEL is consumed by openthrottle-server's per-connection
  #     handshake (WhisperLive selects the model per client, not per server);
  #     it is exported here only so the intended default is visible on the
  #     container. First boot downloads the model into whisper_model_cache.
  #
  whisper:
    # Built from source for the native arch: the upstream whisperlive-cpu image
    # is linux/amd64-only and emulated int8 inference on Apple silicon measured
    # >200x slower than realtime. See applications/openthrottle/Dockerfile.Whisper.
    build:
      context: ./
      dockerfile: applications/openthrottle/Dockerfile.Whisper
    container_name: ${OT_CONTAINER_PREFIX:-}whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 60s
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import socket; socket.create_connection(('127.0.0.1', 9090), 5).close()",
        ]
      timeout: 5s
    image: openthrottle/whisper:latest
    ports:
      - '${WHISPER_PORT:-6030}:9090'
    profiles: [voice]
    restart: 'no'
    volumes:
      - whisper_model_cache:/root/.cache

#############################################################################
#
#     🔐 Secrets | Build secrets for Docker builds
#
#############################################################################
secrets:
  gcs_credentials:
    file: ${GCS_CREDENTIALS_PATH:-~/.config/gcloud/application_default_credentials.json}

#############################################################################
#
#     🎧 Volumes | Persistent "named" volumes
#
volumes:
  # 🔀 Two interchangeable Postgres data volumes — the postgres service mounts
  # exactly one (see the toggle in its `volumes:` block above). Same credentials,
  # ports, image, and PG18 mount path either way; only the volume name changes.
  postgres_data: # 🌱 fresh/public demo DB (active by default)
  postgres_data_dev_personal: # 🔒 archived pre-public personal DB (flip the mount to restore)
  pnpm_store: # pnpm content-addressable store for in-container installs
  whisper_model_cache: # faster-whisper model downloads (first `voice` boot populates it)
