fragment CmsLayoutDetail on CmsLayoutObject {
  createdAt
  fragments {
    ...CmsLayoutFragmentNode
  }
  name
  slug
  status
  tags
  updatedAt
  uuid
}

fragment CmsLayoutFragmentNode on CmsFragmentNodeObject {
  childKeys
  depth
  key
  name
  parentKey
  propertiesJson
  typename
  uuid
}

query CmsLayoutDetail($uuid: String!) {
  cmsLayoutByUuid(uuid: $uuid) {
    ...CmsLayoutDetail
  }
}
