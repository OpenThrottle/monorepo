fragment CmsFragmentDetail on CmsFragmentObject {
  createdAt
  isSystem
  name
  propertiesJson
  schemaUuid
  typename
  updatedAt
  uuid
}

fragment CmsFragmentEditSchema on CmsSchemaObject {
  createdAt
  jsonSchemaJson
  status
  typename
  updatedAt
  uuid
  version
}

fragment CmsFragmentTreeNode on CmsFragmentNodeObject {
  childKeys
  key
  parentKey
  propertiesJson
  typename
  uuid
}

query CmsFragmentDetail($uuid: String!) {
  cmsFragment(uuid: $uuid) {
    children {
      ...CmsFragmentDetail
    }
    ...CmsFragmentDetail
    schema {
      ...CmsFragmentEditSchema
    }
    tree {
      ...CmsFragmentTreeNode
    }
  }
}

mutation UpdateCmsFragment($input: UpdateCmsFragmentInput!) {
  updateCmsFragment(input: $input) {
    name
    updatedAt
    uuid
  }
}

query CmsFragmentChildCandidates($skip: Int, $take: Int, $typename: String) {
  cmsFragments(skip: $skip, take: $take, typename: $typename) {
    hasNextPage
    items {
      name
      typename
      uuid
    }
  }
  cmsSchemas(status: "ACTIVE", take: 100) {
    items {
      typename
      uuid
    }
  }
}

mutation CreateCmsFragmentChild($input: CreateCmsFragmentInput!) {
  createCmsFragment(input: $input) {
    uuid
  }
}

mutation AddCmsFragmentChild($childUuid: String!, $parentUuid: String!) {
  addCmsFragmentChild(childUuid: $childUuid, parentUuid: $parentUuid) {
    childUuid
    parentUuid
    sortOrder
  }
}

mutation RemoveCmsFragmentChild($childUuid: String!, $parentUuid: String!) {
  removeCmsFragmentChild(childUuid: $childUuid, parentUuid: $parentUuid) {
    childUuid
    parentUuid
  }
}

mutation ReorderCmsFragmentChildren(
  $childUuids: [String!]!
  $parentUuid: String!
) {
  reorderCmsFragmentChildren(childUuids: $childUuids, parentUuid: $parentUuid) {
    childUuid
    sortOrder
  }
}
