fragment CmsComponentDetail on CmsLibraryComponentObject {
  code
  libraryUuid
  name
  propsSchemaJson
  status
  typename
  uuid
}

query CmsComponentDetail($uuid: String!) {
  cmsLibraryComponent(uuid: $uuid) {
    ...CmsComponentDetail
  }
}

mutation UpdateCmsLibraryComponent($input: UpdateCmsLibraryComponentInput!) {
  updateCmsLibraryComponent(input: $input) {
    name
    uuid
  }
}
