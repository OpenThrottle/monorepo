# Projects for the rule form's project select. A rule scopes to a plan's project
# (projects.id), independently of its repository.
query RuleEditProjects {
  projects {
    id
    name
  }
}

# Registered repositories for the rule form's repository select. Rules scope to
# a repository (repositories.id), so list workspaceRepositories rather than the
# checkout-keyed workspaceSettings.localRepositories.
query RuleEditRepositories {
  workspaceRepositories {
    id
    name
  }
}

# Prompts and personas the attach-prompt picker can offer. The server returns
# only the caller's prompts plus system prompts (userId null).
query RuleEditPrompts {
  personas: customPrompts(input: { promptType: PERSONAS }) {
    id
    title
    userId
  }
  prompts: customPrompts(input: { promptType: PROMPTS }) {
    id
    title
    userId
  }
}
