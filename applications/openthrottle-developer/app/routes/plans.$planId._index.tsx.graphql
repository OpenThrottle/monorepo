fragment PlanTaskRow on TaskObject {
  assignee
  category
  createdAt
  description
  id
  planId
  projectRelation {
    id
    name
  }
  requirementsJson
  sortOrder
  status
  summary
  title
  updatedAt
}

fragment ProjectDetails on ProjectObject {
  id
  name
}

fragment PlanTagChip on PlanTagObject {
  confidence
  dimension
  id
  source
  tag
}

fragment PlanDetails on PlanObject {
  tags {
    ...PlanTagChip
  }
  assignee
  author
  category
  createdAt
  description
  id
  jobRunHooksJson
  runConfigJson
  project
  projectId
  projectRelation {
    ...ProjectDetails
  }
  status
  summary
  title
  updatedAt
}

query getPlanById($id: ID!) {
  plan(id: $id) {
    ...PlanDetails
  }
}

query getTasksByPlanId($input: TasksByPlanIdInput!) {
  tasksByPlanId(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailEnqueuePlanRun($input: EnqueuePlanRunInput!) {
  enqueuePlanRun(input: $input) {
    executionBackend
    jobId
    planId
    queuePosition
    queueTotal
  }
}

mutation PlanDetailCancelPlanRun($input: CancelPlanRunInput!) {
  cancelPlanRun(input: $input) {
    activeJobIdsCouldNotCancel
    noMatchingJob
    planId
    planStatusAfter
    removedJobIds
    signaledActiveRunToStop
  }
}

mutation PlanDetailSetPlanStatus($input: SetPlanStatusInput!) {
  setPlanStatus(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation PlanDetailUpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailUpdatePlanJobRunHooks($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    jobRunHooksJson
    updatedAt
  }
}

mutation PlanDetailUpdatePlanRunConfig($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    runConfigJson
    updatedAt
  }
}

query PlanDetailIndexLoader($planId: ID!) {
  plan(id: $planId) {
    ...PlanDetails
  }
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
  }
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
  tasksByPlanId(input: { planId: $planId }) {
    ...PlanTaskRow
  }
  planOutputStreamChunks(input: { planId: $planId }) {
    id
    content
    createdAt
    iteration
    planId
  }
  metrics {
    recentPlanRunsMetrics(planId: $planId, limit: 25) {
      executionBackend
      finishedOn
      jobId
      taskRunMetrics {
        atEnd {
          rssMb
        }
      }
    }
  }
  planRunsByPlanId(input: { planId: $planId, limit: 10 }) {
    bullmqJobId
    createdAt
    executionBackend
    id
    runConfigSnapshotJson
    runKind
    status
  }
}

subscription PlanOutputChunkAdded($planId: ID!) {
  planOutputChunkAdded(planId: $planId) {
    id
    content
    createdAt
    iteration
    planId
  }
}

subscription PlanLifecycleNotifications($planId: ID!) {
  planNotifications(planId: $planId) {
    event
    ... on PlanStatusChangedNotification {
      planId
      status
    }
    ... on TaskStatusChangedNotification {
      planId
      status
      taskId
    }
  }
}

mutation PlanDetailAddPlanTag($input: AddPlanTagInput!) {
  addPlanTag(input: $input) {
    ...PlanTagChip
  }
}

mutation PlanDetailRemovePlanTag($input: RemovePlanTagInput!) {
  removePlanTag(input: $input)
}
