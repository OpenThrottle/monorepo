fragment HookTask on TaskObject {
  hookRole
  hookScope
  hookSource
  id
  skillSlug
  status
  title
}

fragment PlanTaskRow on TaskObject {
  assignee
  category
  createdAt
  description
  hookRole
  id
  planId
  projectRelation {
    id
    name
  }
  requirementsJson
  sortOrder
  status
  summary
  title
  updatedAt
}

fragment ProjectDetails on ProjectObject {
  id
  name
}

fragment PlanTagChip on PlanTagObject {
  confidence
  dimension
  id
  source
  tag
}

fragment PlanDetails on PlanObject {
  afterHooks {
    ...HookTask
  }
  assignee
  author
  beforeHooks {
    ...HookTask
  }
  category
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  projectRelation {
    ...ProjectDetails
  }
  runConfigJson
  status
  summary
  tags {
    ...PlanTagChip
  }
  title
  updatedAt
}

query getPlanById($id: ID!) {
  plan(id: $id) {
    ...PlanDetails
  }
}

query getTasksByPlanId($input: TasksByPlanIdInput!) {
  tasksByPlanId(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailEnqueuePlanRun($input: EnqueuePlanRunInput!) {
  enqueuePlanRun(input: $input) {
    executionBackend
    jobId
    planId
    queuePosition
    queueTotal
  }
}

mutation PlanDetailEvaluatePlanRules($planId: ID!) {
  evaluatePlanRules(planId: $planId) {
    enqueued
    planId
    triggerKind
  }
}

mutation PlanDetailCancelPlanRun($input: CancelPlanRunInput!) {
  cancelPlanRun(input: $input) {
    activeJobIdsCouldNotCancel
    cancelRequested
    noMatchingJob
    outcome
    planId
    planStatusAfter
    removedJobIds
    signaledActiveRunToStop
  }
}

mutation PlanDetailSetPlanStatus($input: SetPlanStatusInput!) {
  setPlanStatus(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation PlanDetailUpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailUpdatePlanJobRunHooks($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    jobRunHooksJson
    updatedAt
  }
}

mutation PlanDetailUpdatePlanRunConfig($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    runConfigJson
    updatedAt
  }
}

fragment PlanRunConfigRepositoryFields on RepositoryObject {
  checkouts {
    displayName
    filesystemPath
    id
    inspection {
      git {
        currentBranch
        defaultBranch
      }
    }
    kind
    managed
  }
  defaultBranch
  id
  name
  normalizedRemoteUrl
  projectId
}

# Separate from PlanDetailIndexLoader on purpose: editor deep links are a
# convenience, so the plan-detail loader runs this alongside the main query with
# its own catch. Folding the selection into PlanDetailIndexLoader would let a
# workspace-settings failure (e.g. a user without the permission) take the whole
# plan page down for the sake of three buttons.
query PlanDetailWorkspaceEditors {
  workspaceSettings {
    profile {
      enabledEditors
    }
  }
}

# 🚨 The ONLY document the plan-detail route awaits. Time-to-first-paint is this
# query's latency, so nothing that touches disk, git or the metrics walk may be
# added here — new fields default to one of the deferred documents below.
query PlanDetailCritical($planId: ID!) {
  plan(id: $planId) {
    ...PlanDetails
  }
  tasksByPlanId(input: { planId: $planId }) {
    ...PlanTaskRow
  }
}

# ⬇️ Deferred documents. The loader fires these without awaiting them and streams
# the promises to per-region Suspense/Await boundaries (RR8 Single Fetch). Each
# one also owns its own failure: a rejection degrades its region instead of
# taking the whole plan page down, which the single combined query could not do.

# `workspaceRepositories` refreshes each checkout's inspection snapshot on view
# past a 15-minute TTL, sequentially per checkout — measured at ~1.3s cold vs
# ~10ms warm (8 checkouts). This is the field the deferral exists for.
query PlanDetailWorkspaceRepositories {
  workspaceRepositories {
    ...PlanRunConfigRepositoryFields
  }
}

# `limit: 200` is a deliberate bounded tail rather than the resolver's default.
# When the Output tab grows paging, `offset` is already on the input alongside it.
query PlanDetailOutputChunks($planId: ID!) {
  planOutputStreamChunks(input: { planId: $planId, limit: 200 }) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

query PlanDetailRunHistory($planId: ID!) {
  metrics {
    recentPlanRunsMetrics(planId: $planId, limit: 25) {
      executionBackend
      finishedOn
      jobId
      taskRunMetrics {
        atEnd {
          rssMb
        }
      }
    }
  }
  planRunsByPlanId(input: { planId: $planId, limit: 10 }) {
    branch
    bullmqJobId
    checkout {
      displayName
      filesystemPath
      kind
    }
    createdAt
    executionBackend
    id
    isStale
    lastHeartbeatAt
    model
    pullRequest {
      number
      repo
      state
      url
    }
    runConfigSnapshotJson
    runKind
    status
  }
}

query PlanDetailLedger($planId: ID!) {
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
  }
  workArtifactsByPlan(input: { planId: $planId }) {
    artifacts {
      ...LinkedArtifact
    }
    totalCount
  }
}

query PlanDetailTagVocabulary {
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
}

fragment LinkedArtifact on WorkArtifactObject {
  externalKey
  id
  lifecycle
  producedAt
  source
  type
  verification
}

subscription PlanOutputChunkAdded($planId: ID!) {
  planOutputChunkAdded(planId: $planId) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

subscription PlanLifecycleNotifications($planId: ID!) {
  planNotifications(planId: $planId) {
    event
    ... on PlanStatusChangedNotification {
      planId
      status
    }
    ... on TaskStatusChangedNotification {
      planId
      status
      taskId
    }
  }
}

mutation PlanDetailAddPlanTag($input: AddPlanTagInput!) {
  addPlanTag(input: $input) {
    ...PlanTagChip
  }
}

mutation PlanDetailRemovePlanTag($input: RemovePlanTagInput!) {
  removePlanTag(input: $input)
}

mutation PlanDetailAddHook($input: AddHookInput!) {
  addHook(input: $input) {
    ...HookTask
  }
}

mutation PlanDetailDetachHook($input: DetachHookInput!) {
  detachHook(input: $input)
}
