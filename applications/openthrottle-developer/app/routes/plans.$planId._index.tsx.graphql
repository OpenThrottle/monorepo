fragment HookTask on TaskObject {
  hookRole
  hookScope
  hookSource
  id
  skillSlug
  status
  title
}

fragment PlanTaskRow on TaskObject {
  assignee
  category
  createdAt
  description
  hookRole
  id
  planId
  projectRelation {
    id
    name
  }
  requirementsJson
  sortOrder
  status
  summary
  title
  updatedAt
  wave
}

fragment ProjectDetails on ProjectObject {
  id
  name
}

fragment PlanTagChip on PlanTagObject {
  confidence
  dimension
  id
  source
  tag
}

fragment PlanDetails on PlanObject {
  afterHooks {
    ...HookTask
  }
  assignee
  author
  beforeHooks {
    ...HookTask
  }
  category
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  projectRelation {
    ...ProjectDetails
  }
  runConfigJson
  runnableTaskCount
  scheduledRunAt
  scheduledRunId
  status
  summary
  tags {
    ...PlanTagChip
  }
  title
  updatedAt
}

query getPlanById($id: ID!) {
  plan(id: $id) {
    ...PlanDetails
  }
}

query getTasksByPlanId($input: TasksByPlanIdInput!) {
  tasksByPlanId(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailEnqueuePlanRun($input: EnqueuePlanRunInput!) {
  enqueuePlanRun(input: $input) {
    executionBackend
    jobId
    planId
    queuePosition
    queueTotal
  }
}

# Fires the run at a later instant (a SCHEDULED plan_runs row + a delayed job).
# Same input as enqueue plus `scheduledFor`; the server rejects a past instant
# and anything beyond its 30-day horizon with a message that names the cap.
mutation PlanDetailSchedulePlanRun($input: SchedulePlanRunInput!) {
  schedulePlanRun(input: $input) {
    executionBackend
    jobId
    planId
    planRunId
    scheduledFor
  }
}

# Moves one SCHEDULED run's fire time in place (same run id, snapshot and job).
# The server applies the schedulePlanRun rule (future, within 30 days) and
# rejects a run that is no longer SCHEDULED or already starting.
mutation PlanDetailReschedulePlanRun($input: ReschedulePlanRunInput!) {
  reschedulePlanRun(input: $input) {
    jobId
    planId
    planRunId
    scheduledFor
  }
}

mutation PlanDetailEvaluatePlanRules($planId: ID!) {
  evaluatePlanRules(planId: $planId) {
    enqueued
    planId
    triggerKind
  }
}

mutation PlanDetailCancelPlanRun($input: CancelPlanRunInput!) {
  cancelPlanRun(input: $input) {
    activeJobIdsCouldNotCancel
    cancelRequested
    noMatchingJob
    outcome
    planId
    planStatusAfter
    removedJobIds
    signaledActiveRunToStop
  }
}

# Settles an IN_PROGRESS run that does not heartbeat (an interactive /ot-loop
# turn) to STALE. Kill cannot reach such a run once its agent is gone — nothing
# polls the cancel marker — so this is the operator's escape hatch. Null when
# the run no longer matched the guard (already settled, or a supervised run).
mutation PlanDetailForceSettlePlanRun($input: ForceSettlePlanRunInput!) {
  forceSettlePlanRun(input: $input) {
    heartbeatExpected
    id
    isStale
    status
  }
}

mutation PlanDetailSetPlanStatus($input: SetPlanStatusInput!) {
  setPlanStatus(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation PlanDetailUpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailUpdatePlanJobRunHooks($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    jobRunHooksJson
    updatedAt
  }
}

# The saved run config, read by the runPlan / schedulePlanRun actions so the
# dialog's model and effort can be merged into it before the run is enqueued.
query PlanDetailRunConfig($id: ID!) {
  plan(id: $id) {
    id
    runConfigJson
  }
}

mutation PlanDetailUpdatePlanRunConfig($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    runConfigJson
    updatedAt
  }
}

fragment PlanRunConfigRepositoryFields on RepositoryObject {
  checkouts {
    displayName
    filesystemPath
    id
    inspection {
      git {
        currentBranch
        defaultBranch
      }
    }
    kind
    managed
  }
  defaultBranch
  id
  name
  normalizedRemoteUrl
  projectId
}

# Separate from PlanDetailIndexLoader on purpose: editor deep links are a
# convenience, so the plan-detail loader runs this alongside the main query with
# its own catch. Folding the selection into PlanDetailIndexLoader would let a
# workspace-settings failure (e.g. a user without the permission) take the whole
# plan page down for the sake of three buttons.
query PlanDetailWorkspaceEditors {
  workspaceSettings {
    profile {
      enabledEditors
    }
  }
}

# 🚨 The ONLY document the plan-detail route awaits. Time-to-first-paint is this
# query's latency, so nothing that touches disk, git or the metrics walk may be
# added here — new fields default to one of the deferred documents below.
query PlanDetailCritical($planId: ID!) {
  plan(id: $planId) {
    ...PlanDetails
  }
  tasksByPlanId(input: { planId: $planId }) {
    ...PlanTaskRow
  }
}

# ⬇️ Deferred documents. The loader fires these without awaiting them and streams
# the promises to per-region Suspense/Await boundaries (RR8 Single Fetch). Each
# one also owns its own failure: a rejection degrades its region instead of
# taking the whole plan page down, which the single combined query could not do.

# `workspaceRepositories` refreshes each checkout's inspection snapshot on view
# past a 15-minute TTL, sequentially per checkout — measured at ~1.3s cold vs
# ~10ms warm (8 checkouts). This is the field the deferral exists for.
query PlanDetailWorkspaceRepositories {
  workspaceRepositories {
    ...PlanRunConfigRepositoryFields
  }
}

# `limit: 200` is a deliberate bounded tail rather than the resolver's default.
# When the Output tab grows paging, `offset` is already on the input alongside it.
query PlanDetailOutputChunks($planId: ID!) {
  planOutputStreamChunks(input: { planId: $planId, limit: 200 }) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

query PlanDetailRunHistory($planId: ID!) {
  metrics {
    recentPlanRunsMetrics(planId: $planId, limit: 25) {
      executionBackend
      finishedOn
      jobId
      taskRunMetrics {
        atEnd {
          rssMb
        }
      }
    }
  }
  # `limit: 25` matches `recentPlanRunsMetrics` above so completed-job metrics can
  # join onto history rows, and must equal PLAN_RUN_HISTORY_FETCH_LIMIT in
  # routing/plans/data/data.plan-run-history.ts (the history footer reads it).
  # `includeAllScheduled` makes the limit cap only non-SCHEDULED runs and adds
  # every SCHEDULED one, so a run scheduled long ago never drops out of Upcoming.
  planRunsByPlanId(
    input: { includeAllScheduled: true, limit: 25, planId: $planId }
  ) {
    branch
    bullmqJobId
    checkout {
      displayName
      filesystemPath
      kind
    }
    createdAt
    executionBackend
    heartbeatExpected
    id
    isStale
    lastHeartbeatAt
    model
    pullRequest {
      number
      repo
      state
      url
    }
    resumeOfRunId
    runConfigSnapshotJson
    runKind
    scheduledFor
    settledReason
    status
    usageLimitResetsAt
  }
}

query PlanDetailLedger($planId: ID!) {
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
  }
  workArtifactsByPlan(input: { planId: $planId }) {
    artifacts {
      ...LinkedArtifact
    }
    totalCount
  }
}

query PlanDetailTagVocabulary {
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
}

fragment LinkedArtifact on WorkArtifactObject {
  createdAt
  externalKey
  id
  lifecycle
  message
  payloadJson
  producedAt
  sessionId
  source
  type
  verification
  verifiedAt
}

subscription PlanOutputChunkAdded($planId: ID!) {
  planOutputChunkAdded(planId: $planId) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

subscription PlanLifecycleNotifications($planId: ID!) {
  planNotifications(planId: $planId) {
    event
    ... on PlanStatusChangedNotification {
      planId
      status
    }
    ... on TaskStatusChangedNotification {
      planId
      status
      taskId
    }
  }
}

# The plan inbox: STEER/QUEUE messages a human sends a live run. FEEDBACK is
# post-run reflection, so the live-run inbox never selects it.
fragment PlanInboxMessage on PlanMessageObject {
  author
  body
  createdAt
  deliveredAt
  deliveredToTaskId
  id
  kind
  planId
  status
  taskId
  updatedAt
}

query PlanDetailInbox($planId: ID!) {
  planMessages(input: { kinds: [QUEUE, STEER], planId: $planId }) {
    ...PlanInboxMessage
  }
}

mutation PlanDetailPostPlanMessage($input: PostPlanMessageInput!) {
  postPlanMessage(input: $input) {
    ...PlanInboxMessage
  }
}

mutation PlanDetailWithdrawPlanMessage($input: WithdrawPlanMessageInput!) {
  withdrawPlanMessage(input: $input) {
    ...PlanInboxMessage
  }
}

# Each message as it is posted, edited, withdrawn or delivered — this is how a
# PENDING row flips to DELIVERED on screen while the run claims it.
subscription PlanMessageChanged($planId: ID!) {
  planMessageChanged(planId: $planId) {
    ...PlanInboxMessage
  }
}

mutation PlanDetailAddPlanTag($input: AddPlanTagInput!) {
  addPlanTag(input: $input) {
    ...PlanTagChip
  }
}

mutation PlanDetailRemovePlanTag($input: RemovePlanTagInput!) {
  removePlanTag(input: $input)
}

mutation PlanDetailAddHook($input: AddHookInput!) {
  addHook(input: $input) {
    ...HookTask
  }
}

mutation PlanDetailDetachHook($input: DetachHookInput!) {
  detachHook(input: $input)
}
