fragment HookTask on TaskObject {
  hookRole
  hookScope
  hookSource
  id
  skillSlug
  status
  title
}

fragment PlanTaskRow on TaskObject {
  assignee
  category
  createdAt
  description
  hookRole
  id
  planId
  projectRelation {
    id
    name
  }
  requirementsJson
  sortOrder
  status
  summary
  title
  updatedAt
}

fragment ProjectDetails on ProjectObject {
  id
  name
}

fragment PlanTagChip on PlanTagObject {
  confidence
  dimension
  id
  source
  tag
}

fragment PlanDetails on PlanObject {
  afterHooks {
    ...HookTask
  }
  assignee
  author
  beforeHooks {
    ...HookTask
  }
  category
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  projectRelation {
    ...ProjectDetails
  }
  runConfigJson
  status
  summary
  tags {
    ...PlanTagChip
  }
  title
  updatedAt
}

query getPlanById($id: ID!) {
  plan(id: $id) {
    ...PlanDetails
  }
}

query getTasksByPlanId($input: TasksByPlanIdInput!) {
  tasksByPlanId(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailEnqueuePlanRun($input: EnqueuePlanRunInput!) {
  enqueuePlanRun(input: $input) {
    executionBackend
    jobId
    planId
    queuePosition
    queueTotal
  }
}

mutation PlanDetailEvaluatePlanRules($planId: ID!) {
  evaluatePlanRules(planId: $planId) {
    enqueued
    planId
    triggerKind
  }
}

mutation PlanDetailCancelPlanRun($input: CancelPlanRunInput!) {
  cancelPlanRun(input: $input) {
    activeJobIdsCouldNotCancel
    cancelRequested
    noMatchingJob
    outcome
    planId
    planStatusAfter
    removedJobIds
    signaledActiveRunToStop
  }
}

mutation PlanDetailSetPlanStatus($input: SetPlanStatusInput!) {
  setPlanStatus(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation PlanDetailUpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    ...PlanTaskRow
  }
}

mutation PlanDetailUpdatePlanJobRunHooks($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    jobRunHooksJson
    updatedAt
  }
}

mutation PlanDetailUpdatePlanRunConfig($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    id
    runConfigJson
    updatedAt
  }
}

fragment PlanRunConfigRepositoryFields on RepositoryObject {
  checkouts {
    displayName
    filesystemPath
    id
    inspection {
      git {
        currentBranch
      }
    }
    kind
    managed
  }
  id
  name
  normalizedRemoteUrl
  projectId
}

query PlanDetailIndexLoader($planId: ID!) {
  metrics {
    recentPlanRunsMetrics(planId: $planId, limit: 25) {
      executionBackend
      finishedOn
      jobId
      taskRunMetrics {
        atEnd {
          rssMb
        }
      }
    }
  }
  plan(id: $planId) {
    ...PlanDetails
  }
  planOutputStreamChunks(input: { planId: $planId }) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
  planRunsByPlanId(input: { planId: $planId, limit: 10 }) {
    branch
    bullmqJobId
    checkout {
      displayName
      filesystemPath
      kind
    }
    createdAt
    executionBackend
    id
    isStale
    lastHeartbeatAt
    model
    pullRequest {
      number
      repo
      state
      url
    }
    runConfigSnapshotJson
    runKind
    status
  }
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
  }
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
  tasksByPlanId(input: { planId: $planId }) {
    ...PlanTaskRow
  }
  workArtifactsByPlan(input: { planId: $planId }) {
    artifacts {
      ...LinkedArtifact
    }
    totalCount
  }
  workspaceRepositories {
    ...PlanRunConfigRepositoryFields
  }
}

fragment LinkedArtifact on WorkArtifactObject {
  externalKey
  id
  lifecycle
  producedAt
  source
  type
  verification
}

subscription PlanOutputChunkAdded($planId: ID!) {
  planOutputChunkAdded(planId: $planId) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

subscription PlanLifecycleNotifications($planId: ID!) {
  planNotifications(planId: $planId) {
    event
    ... on PlanStatusChangedNotification {
      planId
      status
    }
    ... on TaskStatusChangedNotification {
      planId
      status
      taskId
    }
  }
}

mutation PlanDetailAddPlanTag($input: AddPlanTagInput!) {
  addPlanTag(input: $input) {
    ...PlanTagChip
  }
}

mutation PlanDetailRemovePlanTag($input: RemovePlanTagInput!) {
  removePlanTag(input: $input)
}

mutation PlanDetailAddHook($input: AddHookInput!) {
  addHook(input: $input) {
    ...HookTask
  }
}

mutation PlanDetailDetachHook($input: DetachHookInput!) {
  detachHook(input: $input)
}
