query SettingsSetupAgentClis {
  discoverAgentClis {
    agents {
      backend
      enabled
      label
      models
      version
    }
    scannedAt
    totalCount
  }
}

query AgentCliSetupConfig {
  agentCliSetupConfig {
    canManage
    installEnabled
  }
}

mutation SetAgentEnabled($backend: String!, $enabled: Boolean!) {
  setAgentEnabled(backend: $backend, enabled: $enabled) {
    backend
    enabled
  }
}

subscription AgentSetupChunkAdded($runId: ID!) {
  agentSetupChunkAdded(runId: $runId) {
    data
    done
    error
    exitCode
    id
    runId
    sortOrder
    stream
  }
}
