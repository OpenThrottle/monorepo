fragment RepositoryHookTelemetry on RepositoryInspectionHookTelemetryObject {
  authTokenConfigured
  endpointConfigured
  endpointSource
  producers
  reason
  status
  telemetryDir
}

fragment RepositoryCheckoutInspection on RepositoryInspectionObject {
  agentConfig {
    agentsMd
    claudeMd
    cursorRules
    mcpJson
    skillsDir
  }
  git {
    currentBranch
    defaultBranch
    dirty
    isRepo
    linkedWorktrees
    normalizedRemoteUrl
  }
  hookTelemetry {
    ...RepositoryHookTelemetry
  }
  scannedAt
  stack {
    languages
    nxWorkspace
    packageManager
    pnpmWorkspace
    turbo
  }
  warnings
}

fragment RepositoryCheckoutFields on RepositoryCheckoutObject {
  createdAt
  displayName
  filesystemPath
  foreignSkillInjectionEnabled
  id
  inspection {
    ...RepositoryCheckoutInspection
  }
  isForeign
  kind
  managed
  repositoryId
  scannedAt
  updatedAt
  userId
  worktreeSkillOverlayEnabled
}

fragment DiscoveredWorktreeFields on DiscoveredWorktreeObject {
  activity
  branch
  checkoutId
  name
  path
  planId
  planRunId
  repositoryId
  runMonitored
  safeToRemove
  unregistered
}

fragment WorkspaceRepositoryFields on RepositoryObject {
  checkouts {
    ...RepositoryCheckoutFields
  }
  createdAt
  defaultBranch
  id
  name
  normalizedRemoteUrl
  project {
    id
    name
  }
  projectId
  updatedAt
}

query getSettingsRepositories {
  workspacePickerCapabilities {
    canUseNativeDialog
    defaultBrowsePath
    roots
  }
  workspaceRepositories {
    ...WorkspaceRepositoryFields
  }
}
fragment DiscoveredWorktreeRemoval on WorktreeRemovalObject {
  agentSession
  createdAt
  id
  outcome
  parentCommand
  removedAt
  result
}

fragment DiscoveredWorktreeMissingCheckout on MissingWorktreeCheckoutObject {
  checkoutId
  lastRemoval {
    ...DiscoveredWorktreeRemoval
  }
  path
  reason
  repositoryId
}
fragment DiscoveredWorktreeProblem on WorktreeDiscoveryProblemObject {
  detail
  kind
  path
  repositoryId
}
fragment DiscoveredWorktreeScannedRoot on ScannedWorktreeRootObject {
  baseRoot
  exists
  path
  source
  worktreeCount
}

fragment DiscoveredWorktreesScan on DiscoveredWorktreesObject {
  droppedCount
  missingCheckouts {
    ...DiscoveredWorktreeMissingCheckout
  }
  problems {
    ...DiscoveredWorktreeProblem
  }
  scannedAt
  scannedRoots {
    ...DiscoveredWorktreeScannedRoot
  }
  worktrees {
    ...DiscoveredWorktreeFields
  }
}

query getSettingsRepositoriesDiscovery {
  discoveredFolders {
    alreadyRegistered
    name
    path
  }
  discoveredWorktrees {
    ...DiscoveredWorktreesScan
  }
}

query browseWorkspaceDirectory($path: String) {
  browseDirectory(path: $path) {
    entries {
      alreadyRegistered
      isGitRepo
      name
      path
    }
    isGitRepo
    parentPath
    path
  }
}

mutation pickFolderNative {
  pickFolderNative {
    path
  }
}

fragment AddWorkspaceFolderResult on AddWorkspaceFolderPayloadObject {
  checkout {
    ...RepositoryCheckoutFields
  }
  project {
    id
    name
  }
  projectCreated
  reconciliation
  repository {
    ...WorkspaceRepositoryFields
  }
}

mutation addWorkspaceFolder($input: AddWorkspaceFolderInput!) {
  addWorkspaceFolder(input: $input) {
    ...AddWorkspaceFolderResult
  }
}

mutation cloneRepository($input: CloneRepositoryInput!) {
  cloneRepository(input: $input) {
    checkout {
      ...RepositoryCheckoutFields
    }
    project {
      id
      name
    }
    projectCreated
    reconciliation
    repository {
      ...WorkspaceRepositoryFields
    }
  }
}

mutation refreshCheckout($input: RefreshCheckoutInput!) {
  refreshCheckout(input: $input) {
    checkout {
      ...RepositoryCheckoutFields
    }
    drift {
      branchMoved
      pathMissing
      remoteChanged
    }
    merged
    repository {
      ...WorkspaceRepositoryFields
    }
    supersededProjectId
  }
}

fragment PruneWorktreeCheckoutResult on PruneWorktreeCheckoutResultObject {
  checkoutId
  outcome
  path
}

mutation pruneWorktreeCheckouts($input: PruneWorktreeCheckoutsInput!) {
  pruneWorktreeCheckouts(input: $input) {
    results {
      ...PruneWorktreeCheckoutResult
    }
  }
}

fragment RemovePlanRunWorktreeResult on RemovePlanRunWorktreePayloadObject {
  branch
  checkoutId
  detail
  outcome
  path
}

mutation removePlanRunWorktree($checkoutId: ID!) {
  removePlanRunWorktree(checkoutId: $checkoutId) {
    ...RemovePlanRunWorktreeResult
  }
}

mutation deleteWorkspaceLocalRepository($id: ID!) {
  deleteWorkspaceLocalRepository(id: $id)
}

query rescanSettingsWorktrees {
  discoveredWorktrees(refresh: true) {
    scannedAt
  }
}
