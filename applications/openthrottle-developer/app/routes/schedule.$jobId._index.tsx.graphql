fragment ScheduledJobRunRow on ScheduledAgentJobRunObject {
  bullmqJobId
  cacheReadTokens
  cacheWriteTokens
  costUsd
  createdAt
  driverId
  errorMessage
  exitCode
  finishedAt
  id
  inputTokens
  model
  outputTokens
  reasoningTokens
  resumeOfRunId
  scheduledFor
  startedAt
  status
  totalTokens
  trigger
  usageLimitResetsAt
}

# The schedule-detail entity shape: everything the list card shows plus the
# fields only the detail route and its edit form need. `ScheduledJobCard` stays
# the list/update/enable shape. Components, hooks and fixtures take
# `ScheduledJobDetailFragment` rather than unwrapping
# `ScheduledAgentJobDetailQuery['scheduledAgentJob']` — see
# packages/graphql-codegen/README.md.
fragment ScheduledJobDetail on ScheduledAgentJobObject {
  createdAt
  cwd
  misfirePolicy
  misfireThresholdMs
  prompt
  ...ScheduledJobCard
  settingsJson
  timeoutMs
}

fragment ScheduleWebhookFilter on ScheduledAgentJobWebhookFilterObject {
  op
  path
  value
  values
}

# The webhook trigger as the UI shows it after setup. It never carries the URL
# token or the secret; only `tokenPrefix` identifies the token.
fragment ScheduleWebhookTrigger on ScheduledAgentJobWebhookTriggerObject {
  coalesceWindowMs
  createdAt
  deliveryIdHeader
  enabled
  filters {
    ...ScheduleWebhookFilter
  }
  id
  maxInFlight
  rateLimitPerMinute
  rotatedAt
  scheduledAgentJobId
  signatureEncoding
  signatureHeader
  signaturePreset
  timestampHeader
  timestampToleranceSeconds
  tokenPrefix
  updatedAt
}

query scheduledAgentJobDetail($id: ID!) {
  scheduledAgentJob(id: $id) {
    ...ScheduledJobDetail
  }
  scheduledAgentJobRuns(scheduledAgentJobId: $id, limit: 50) {
    ...ScheduledJobRunRow
  }
  scheduledAgentJobWebhookTrigger(scheduledAgentJobId: $id) {
    ...ScheduleWebhookTrigger
  }
}

mutation approveScheduledAgentJob($id: ID!) {
  approveScheduledAgentJob(id: $id) {
    ...ScheduledJobCard
  }
}

# Create and rotate return the URL path and the secret exactly once. The route
# action hands them to a one-time reveal; nothing stores them.
mutation createScheduledAgentJobWebhookTrigger(
  $input: CreateScheduledAgentJobWebhookTriggerInputType!
) {
  createScheduledAgentJobWebhookTrigger(input: $input) {
    secret
    trigger {
      ...ScheduleWebhookTrigger
    }
    webhookPath
  }
}

mutation rotateScheduledAgentJobWebhookTrigger($scheduledAgentJobId: ID!) {
  rotateScheduledAgentJobWebhookTrigger(
    scheduledAgentJobId: $scheduledAgentJobId
  ) {
    secret
    trigger {
      ...ScheduleWebhookTrigger
    }
    webhookPath
  }
}

mutation updateScheduledAgentJobWebhookTrigger(
  $input: UpdateScheduledAgentJobWebhookTriggerInputType!
) {
  updateScheduledAgentJobWebhookTrigger(input: $input) {
    ...ScheduleWebhookTrigger
  }
}

mutation deleteScheduledAgentJobWebhookTrigger($scheduledAgentJobId: ID!) {
  deleteScheduledAgentJobWebhookTrigger(
    scheduledAgentJobId: $scheduledAgentJobId
  )
}

mutation updateScheduledAgentJob($input: UpdateScheduledAgentJobInputType!) {
  updateScheduledAgentJob(input: $input) {
    ...ScheduledJobCard
  }
}

mutation setScheduledAgentJobEnabled(
  $input: SetScheduledAgentJobEnabledInputType!
) {
  setScheduledAgentJobEnabled(input: $input) {
    ...ScheduledJobCard
  }
}

mutation runScheduledAgentJobNow($id: ID!) {
  runScheduledAgentJobNow(id: $id) {
    ...ScheduledJobRunRow
  }
}

mutation deleteScheduledAgentJob($id: ID!) {
  deleteScheduledAgentJob(id: $id)
}
