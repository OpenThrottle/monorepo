fragment ScheduledJobRunRow on ScheduledAgentJobRunObject {
  bullmqJobId
  cacheReadTokens
  cacheWriteTokens
  costUsd
  createdAt
  driverId
  errorMessage
  exitCode
  finishedAt
  id
  inputTokens
  model
  outputTokens
  reasoningTokens
  startedAt
  status
  totalTokens
  trigger
}

# The schedule-detail entity shape: everything the list card shows plus the
# fields only the detail route and its edit form need. `ScheduledJobCard` stays
# the list/update/enable shape. Components, hooks and fixtures take
# `ScheduledJobDetailFragment` rather than unwrapping
# `ScheduledAgentJobDetailQuery['scheduledAgentJob']` — see
# packages/graphql-codegen/README.md.
fragment ScheduledJobDetail on ScheduledAgentJobObject {
  createdAt
  cwd
  prompt
  ...ScheduledJobCard
  settingsJson
  timeoutMs
}

query scheduledAgentJobDetail($id: ID!) {
  scheduledAgentJob(id: $id) {
    ...ScheduledJobDetail
  }
  scheduledAgentJobRuns(scheduledAgentJobId: $id, limit: 50) {
    ...ScheduledJobRunRow
  }
}

mutation updateScheduledAgentJob($input: UpdateScheduledAgentJobInputType!) {
  updateScheduledAgentJob(input: $input) {
    ...ScheduledJobCard
  }
}

mutation setScheduledAgentJobEnabled(
  $input: SetScheduledAgentJobEnabledInputType!
) {
  setScheduledAgentJobEnabled(input: $input) {
    ...ScheduledJobCard
  }
}

mutation runScheduledAgentJobNow($id: ID!) {
  runScheduledAgentJobNow(id: $id) {
    ...ScheduledJobRunRow
  }
}

mutation deleteScheduledAgentJob($id: ID!) {
  deleteScheduledAgentJob(id: $id)
}
