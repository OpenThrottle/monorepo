fragment TagActionRuleRow on TagActionRuleObject {
  actionPayloadJson
  actionType
  createdAt
  enabled
  environment
  id
  projectId
  status
  tagAll
  title
  updatedAt
  userId
}

query RulesIndexLoader {
  tagActionRules {
    ...TagActionRuleRow
  }
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
  skillAvailability {
    skills {
      effectiveDisableModelInvocation
      slug
    }
    totalCount
    warnings
  }
}

query RuleEditLoader($id: ID!) {
  tagActionRule(id: $id) {
    ...TagActionRuleRow
  }
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
  skillAvailability {
    skills {
      effectiveDisableModelInvocation
      slug
    }
    totalCount
    warnings
  }
}

mutation RulesUpsertTagActionRule($input: UpsertTagActionRuleInput!) {
  upsertTagActionRule(input: $input) {
    ...TagActionRuleRow
  }
}

mutation RulesDeleteTagActionRule($input: DeleteTagActionRuleInput!) {
  deleteTagActionRule(input: $input)
}
