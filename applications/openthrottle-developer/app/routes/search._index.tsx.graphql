fragment SearchSourceCountsFields on SearchSourceCounts {
  documentation
  plan
  task
}

fragment SearchCorpusCoverage on EmbeddingCoverageObject {
  embedded
  entity
  total
}

query getSearchResults($input: SearchInput!) {
  search(input: $input) {
    chunks {
      content
      id
      planId
      planTitle
      similarity
      source
      sourcePath
      sourceRepo
      sourceSha
      taskId
      taskTitle
    }
    mode
    reason
    sourceCounts {
      ...SearchSourceCountsFields
    }
    total
  }
}

query getSearchCorpus {
  serverHealth {
    embeddings {
      coverage {
        ...SearchCorpusCoverage
      }
      status
    }
  }
}

fragment SearchCodeRepository on WorkspaceLocalRepositoryObject {
  displayName
  gitDefaultBranch
  gitRemoteUrl
  id
  kind
}

fragment SearchCodeIndexStatus on CodeIndexStatusObject {
  failedReason
  indexedChunks
  repositoryId
  status
}

fragment SearchCodeMatch on CodeSearchMatch {
  content
  endLine
  path
  score
  startLine
}

query getSearchCodeRepositories {
  workspaceLocalRepositories {
    ...SearchCodeRepository
  }
}

query getSearchCodeIndexStatus($repositoryId: ID!) {
  codeIndexStatus(repositoryId: $repositoryId) {
    ...SearchCodeIndexStatus
  }
}

query getSearchCodeResults($input: CodeSemanticSearchInput!) {
  codeSemanticSearch(input: $input) {
    available
    matches {
      ...SearchCodeMatch
    }
    total
  }
}
