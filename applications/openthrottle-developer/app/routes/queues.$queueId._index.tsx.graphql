fragment QueueJobDetails on JobObject {
  data
  failedReason
  finishedOn
  id
  name
  processedOn
  progress
  returnvalue
  state
  timestamp
}

fragment QueueDetails on QueueDetailsObject {
  activeCount
  completedCount
  delayedCount
  failedCount
  jobs {
    hasNext
    jobs {
      ...QueueJobDetails
    }
    total
  }
  name
  waitingCount
}

query getQueue($input: QueueDetailsInput!) {
  queue(input: $input) {
    ...QueueDetails
  }
}

mutation QueueDetailPauseQueue($input: QueueControlInput!) {
  pauseQueue(input: $input) {
    error
    queueName
    success
  }
}

mutation QueueDetailResumeQueue($input: QueueControlInput!) {
  resumeQueue(input: $input) {
    error
    queueName
    success
  }
}

mutation QueueDetailCleanQueue($input: CleanQueueInput!) {
  cleanQueue(input: $input) {
    error
    queueName
    removedCount
    success
  }
}
