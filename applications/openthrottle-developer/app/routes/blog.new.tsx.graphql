mutation createBlogPostDraft($input: CreateBlogPostInput!) {
  createBlogPost(input: $input) {
    __typename
    ... on BlogCoverAltRequiredError {
      message
    }
    ... on BlogPostAdminObject {
      id
    }
    ... on BlogReferenceNotFoundError {
      entity
      key
      message
    }
    ... on BlogSlugConflictError {
      message
      slug
    }
  }
}
