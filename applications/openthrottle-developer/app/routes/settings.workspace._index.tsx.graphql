fragment WorkspaceLocalRepositoryFields on WorkspaceLocalRepositoryObject {
  createdAt
  displayName
  filesystemPath
  gitDefaultBranch
  gitRemoteUrl
  id
  project {
    id
    name
  }
  projectId
  updatedAt
  userId
}

fragment UserWorkspaceProfileFields on UserWorkspaceProfileObject {
  contactDisplayName
  contactEmail
  createdAt
  enabledEditors
  updatedAt
  userId
}

# NOTE: `localRepositories` is consumed by the IDE routes, which reuse this
# GetWorkspaceSettings document (see routing/ide/utils/repositories.ts), and by
# plans.create for its editor deep-links (which also reads `profile.enabledEditors`).
# The workspace settings loader itself only reads `profile`.
query getWorkspaceSettings {
  workspaceSettings {
    localRepositories {
      ...WorkspaceLocalRepositoryFields
    }
    profile {
      ...UserWorkspaceProfileFields
    }
  }
}

mutation updateWorkspaceProfile($input: UpdateWorkspaceProfileInput!) {
  updateWorkspaceProfile(input: $input) {
    ...UserWorkspaceProfileFields
  }
}

mutation applyWorkspaceEditorConfiguration(
  $input: ApplyWorkspaceEditorConfigurationInput
) {
  applyWorkspaceEditorConfiguration(input: $input) {
    applications {
      editor
      filesWritten
      filesystemPath
      repositoryId
      warnings
    }
  }
}

# Deliberately its OWN query rather than a field on getWorkspaceSettings: presence is
# an advisory hint, and the loader fetches it with a catch so a probe failure degrades
# to "no hints" instead of taking the settings page down with it.
query getEditorPresence {
  editorPresence {
    editors {
      editor
      presence
    }
    scannedAt
    trusted
  }
}
