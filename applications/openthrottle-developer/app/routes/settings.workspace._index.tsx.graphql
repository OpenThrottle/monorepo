fragment RepositoryCheckoutFields on RepositoryCheckoutObject {
  createdAt
  displayName
  filesystemPath
  id
  inspection {
    agentConfig {
      agentsMd
      claudeMd
      cursorRules
      mcpJson
      skillsDir
    }
    git {
      currentBranch
      defaultBranch
      dirty
      isRepo
      linkedWorktrees
      normalizedRemoteUrl
    }
    scannedAt
    stack {
      languages
      nxWorkspace
      packageManager
      pnpmWorkspace
      turbo
    }
    warnings
  }
  kind
  managed
  repositoryId
  scannedAt
  updatedAt
  userId
}

fragment WorkspaceRepositoryFields on RepositoryObject {
  checkouts {
    ...RepositoryCheckoutFields
  }
  createdAt
  defaultBranch
  id
  name
  normalizedRemoteUrl
  project {
    id
    name
  }
  projectId
  updatedAt
}

fragment WorkspaceLocalRepositoryFields on WorkspaceLocalRepositoryObject {
  createdAt
  displayName
  filesystemPath
  gitDefaultBranch
  gitRemoteUrl
  id
  project {
    id
    name
  }
  projectId
  updatedAt
  userId
}

fragment UserWorkspaceProfileFields on UserWorkspaceProfileObject {
  contactDisplayName
  contactEmail
  createdAt
  enabledEditors
  updatedAt
  userId
}

query getWorkspaceSettings {
  discoveredFolders {
    alreadyRegistered
    name
    path
  }
  workspaceRepositories {
    ...WorkspaceRepositoryFields
  }
  workspaceSettings {
    localRepositories {
      ...WorkspaceLocalRepositoryFields
    }
    profile {
      ...UserWorkspaceProfileFields
    }
  }
}

query browseWorkspaceDirectory($path: String!) {
  browseDirectory(path: $path) {
    name
    path
  }
}

mutation addWorkspaceFolder($input: AddWorkspaceFolderInput!) {
  addWorkspaceFolder(input: $input) {
    checkout {
      ...RepositoryCheckoutFields
    }
    project {
      id
      name
    }
    projectCreated
    reconciliation
    repository {
      ...WorkspaceRepositoryFields
    }
  }
}

mutation cloneRepository($input: CloneRepositoryInput!) {
  cloneRepository(input: $input) {
    checkout {
      ...RepositoryCheckoutFields
    }
    project {
      id
      name
    }
    projectCreated
    reconciliation
    repository {
      ...WorkspaceRepositoryFields
    }
  }
}

mutation refreshCheckout($input: RefreshCheckoutInput!) {
  refreshCheckout(input: $input) {
    checkout {
      ...RepositoryCheckoutFields
    }
    drift {
      branchMoved
      pathMissing
      remoteChanged
    }
    merged
    repository {
      ...WorkspaceRepositoryFields
    }
    supersededProjectId
  }
}

mutation updateWorkspaceProfile($input: UpdateWorkspaceProfileInput!) {
  updateWorkspaceProfile(input: $input) {
    ...UserWorkspaceProfileFields
  }
}

mutation deleteWorkspaceLocalRepository($id: ID!) {
  deleteWorkspaceLocalRepository(id: $id)
}

mutation applyWorkspaceEditorConfiguration(
  $input: ApplyWorkspaceEditorConfigurationInput
) {
  applyWorkspaceEditorConfiguration(input: $input) {
    applications {
      editor
      filesWritten
      filesystemPath
      repositoryId
      warnings
    }
  }
}
