fragment ProjectPageDetails on ProjectObject {
  createdAt
  description
  id
  name
  nxProjectName
  tags {
    confidence
    dimension
    id
    source
    tag
  }
  updatedAt
}

query getProjectById($id: ID!, $limit: Float, $offset: Float) {
  project(id: $id) {
    ...ProjectPageDetails
  }

  projectTasksResult: tasksByProjectId(
    input: { projectId: $id, limit: $limit, offset: $offset }
  ) {
    tasks {
      assignee
      category
      createdAt
      description
      id
      planId
      requirementsJson
      summary
      title
      updatedAt
    }
    totalCount
  }

  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
}

mutation ProjectDetailAddProjectTag($input: AddProjectTagInput!) {
  addProjectTag(input: $input) {
    ...ProjectTagChip
  }
}

mutation ProjectDetailRemoveProjectTag($input: RemoveProjectTagInput!) {
  removeProjectTag(input: $input)
}

fragment ProjectTagChip on ProjectTagObject {
  confidence
  dimension
  id
  source
  tag
}
