fragment ProjectPageDetails on ProjectObject {
  createdAt
  description
  id
  latestProjectRun {
    ...ProjectRunPanelDetails
  }
  name
  repositories {
    ...ProjectRepositoryRow
  }
  tags {
    confidence
    dimension
    id
    source
    tag
  }
  updatedAt
}

query getProjectById($id: ID!, $limit: Int!, $offset: Int!) {
  # Candidates for the "add existing plan" picker. The plans list is bounded; a
  # plan already in this project is filtered out in the loader.
  availablePlans: plans(limit: 500) {
    id
    projectId
    status
    title
  }

  project(id: $id) {
    ...ProjectPageDetails
  }

  projectPlansPage(input: { limit: $limit, offset: $offset, projectId: $id }) {
    items {
      ...ProjectPlanRow
    }
    totalCount
  }

  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
}

# Deferred: workspaceRepositories refreshes checkout snapshots and costs ~1.3s
# cold, so it streams into the repository picker instead of blocking the page.
query ProjectDetailWorkspaceRepositories {
  workspaceRepositories {
    ...ProjectRepositoryRow
  }
}

mutation ProjectDetailAddProjectTag($input: AddProjectTagInput!) {
  addProjectTag(input: $input) {
    ...ProjectTagChip
  }
}

mutation ProjectDetailRemoveProjectTag($input: RemoveProjectTagInput!) {
  removeProjectTag(input: $input)
}

fragment ProjectTagChip on ProjectTagObject {
  confidence
  dimension
  id
  source
  tag
}

fragment ProjectRepositoryRow on RepositoryObject {
  defaultBranch
  id
  name
  normalizedRemoteUrl
}

fragment ProjectPlanRow on PlanObject {
  id
  latestPullRequest {
    number
    state
    url
  }
  projectSortOrder
  status
  taskCount
  tasksCompletedCount
  title
}

mutation ProjectDetailLinkRepository($input: LinkProjectRepositoryInput!) {
  linkProjectRepository(input: $input) {
    projectId
    repositoryId
  }
}

mutation ProjectDetailUnlinkRepository($input: UnlinkProjectRepositoryInput!) {
  unlinkProjectRepository(input: $input)
}

mutation ProjectDetailAddPlan($input: AddPlanToProjectInput!) {
  addPlanToProject(input: $input) {
    id
  }
}

mutation ProjectDetailRemovePlan($input: RemovePlanFromProjectInput!) {
  removePlanFromProject(input: $input) {
    id
  }
}

mutation ProjectDetailMovePlan($input: MoveProjectPlanInput!) {
  moveProjectPlan(input: $input) {
    id
  }
}

fragment ProjectRunPanelPlan on PlanObject {
  id
  title
}

fragment ProjectRunPanelDetails on ProjectRunObject {
  cancelRequestedAt
  currentPlan {
    ...ProjectRunPanelPlan
  }
  id
  settledAt
  status
  stoppedByPlan {
    ...ProjectRunPanelPlan
  }
  stoppedReason
}

mutation ProjectDetailRunProject($input: RunProjectInput!) {
  runProject(input: $input) {
    id
  }
}

mutation ProjectDetailCancelProjectRun($input: CancelProjectRunInput!) {
  cancelProjectRun(input: $input) {
    id
  }
}
