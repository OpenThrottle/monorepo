query getProjectForEdit($id: ID!) {
  project(id: $id) {
    description
    id
    name
    updatedAt
  }
}

mutation updateProject($input: UpdateProjectInput!) {
  updateProject(input: $input) {
    description
    id
    name
    updatedAt
  }
}

mutation ProjectEditDeleteProject($input: DeleteProjectInput!) {
  deleteProject(input: $input)
}
