fragment ScheduledJobRunDetail on ScheduledAgentJobRunObject {
  bullmqJobId
  cacheReadTokens
  cacheWriteTokens
  cancelRequestedAt
  costUsd
  createdAt
  driverId
  errorMessage
  exitCode
  finishedAt
  id
  inputTokens
  model
  outputTokens
  reasoningTokens
  repository {
    displayName
    filesystemPath
    id
  }
  repositoryCheckoutId
  resolvedCwd
  scheduledAgentJobId
  settingsSnapshotJson
  startedAt
  status
  totalTokens
  trigger
}

query scheduledAgentJobRunDetail($runId: ID!, $jobId: ID!) {
  scheduledAgentJob(id: $jobId) {
    id
    name
  }
  scheduledAgentJobRun(runId: $runId) {
    ...ScheduledJobRunDetail
  }
}

mutation cancelScheduledAgentJobRun($runId: ID!) {
  cancelScheduledAgentJobRun(runId: $runId) {
    ...ScheduledJobRunDetail
  }
}
