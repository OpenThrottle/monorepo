fragment UsageDailyStatsRow on DailyStatsObject {
  date
  plansCompleted
  plansCreated
  plansUpdated
  tasksCompleted
  tasksCreated
  tasksUpdated
}

query getUsageDailyStats($start: String!, $end: String!) {
  dailyStatsRange(start: $start, end: $end) {
    items {
      ...UsageDailyStatsRow
    }
  }
}

fragment UsageTokenUsageRow on TokenUsageRowObject {
  agentAccountId
  cacheReadTokens
  cacheWriteTokens
  costUsd
  createdAt
  id
  inputTokens
  model
  outputTokens
  provider
  reasoningTokens
  source
  totalTokens
}

fragment UsageTokenUsageTotals on TokenUsageTotalsObject {
  cacheReadTokens
  cacheWriteTokens
  costUsd
  inputTokens
  outputTokens
  reasoningTokens
  totalTokens
  turnCount
}

fragment UsageTokenUsageAccount on TokenUsageAccountObject {
  credentialKind
  email
  id
  lastSeenAt
  orgName
  plan
  provider
}

fragment UsageTokenUsageByAccount on TokenUsageByAccountObject {
  account {
    ...UsageTokenUsageAccount
  }
  provider
  totals {
    ...UsageTokenUsageTotals
  }
}

query getUsageTokenUsage(
  $start: String!
  $end: String!
  $provider: String
  $accountId: String
) {
  tokenUsage(
    start: $start
    end: $end
    provider: $provider
    accountId: $accountId
  ) {
    byAccount {
      ...UsageTokenUsageByAccount
    }
    items {
      ...UsageTokenUsageRow
    }
    totals {
      ...UsageTokenUsageTotals
    }
  }
}

fragment UsageSkillUsageBySkill on SkillUsageBySkillObject {
  abandonedCount
  avgDurationMs
  count
  errorCount
  outcomeCount
  scope
  sessionEndedCount
  skillName
  successCount
}

fragment UsageSkillUsageByScope on SkillUsageByScopeObject {
  count
  scope
}

fragment UsageSkillUsageByDay on SkillUsageByDayObject {
  date
  injectedCount
  oursCount
  personalCount
  thirdPartyCount
  totalCount
}

fragment UsageSkillUsageFilterOptions on SkillUsageFilterOptionsObject {
  cwds
  gitBranches
}

query getUsageSkillUsage(
  $start: String!
  $end: String!
  $scope: String
  $gitBranch: String
  $cwd: String
) {
  skillUsage(
    start: $start
    end: $end
    scope: $scope
    gitBranch: $gitBranch
    cwd: $cwd
  ) {
    byDay {
      ...UsageSkillUsageByDay
    }
    byScope {
      ...UsageSkillUsageByScope
    }
    bySkill {
      ...UsageSkillUsageBySkill
    }
    filterOptions {
      ...UsageSkillUsageFilterOptions
    }
    totalCount
  }
}

fragment UsageCaptureHealthRow on CaptureHealthRowObject {
  lastCapturedAt
  source
  stream
}

query getUsageCaptureHealth {
  captureHealth {
    ...UsageCaptureHealthRow
  }
}
