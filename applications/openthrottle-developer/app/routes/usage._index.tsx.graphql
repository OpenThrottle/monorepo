fragment UsageDailyStatsRow on DailyStatsObject {
  date
  plansCompleted
  plansCreated
  plansUpdated
  tasksCompleted
  tasksCreated
  tasksUpdated
}

query getUsageDailyStats($start: String!, $end: String!) {
  dailyStatsRange(start: $start, end: $end) {
    items {
      ...UsageDailyStatsRow
    }
  }
}

fragment UsageTokenUsageRow on TokenUsageRowObject {
  cacheReadTokens
  cacheWriteTokens
  costUsd
  createdAt
  id
  inputTokens
  model
  outputTokens
  provider
  reasoningTokens
  totalTokens
}

fragment UsageTokenUsageTotals on TokenUsageTotalsObject {
  cacheReadTokens
  cacheWriteTokens
  costUsd
  inputTokens
  outputTokens
  reasoningTokens
  totalTokens
  turnCount
}

query getUsageTokenUsage($start: String!, $end: String!, $provider: String) {
  tokenUsage(start: $start, end: $end, provider: $provider) {
    items {
      ...UsageTokenUsageRow
    }
    totals {
      ...UsageTokenUsageTotals
    }
  }
}

fragment UsageSkillUsageBySkill on SkillUsageBySkillObject {
  abandonedCount
  avgDurationMs
  count
  errorCount
  outcomeCount
  scope
  skillName
  successCount
}

fragment UsageSkillUsageByScope on SkillUsageByScopeObject {
  count
  scope
}

fragment UsageSkillUsageByDay on SkillUsageByDayObject {
  date
  oursCount
  thirdPartyCount
  totalCount
}

fragment UsageSkillUsageFilterOptions on SkillUsageFilterOptionsObject {
  cwds
  gitBranches
}

query getUsageSkillUsage(
  $start: String!
  $end: String!
  $scope: String
  $gitBranch: String
  $cwd: String
) {
  skillUsage(
    start: $start
    end: $end
    scope: $scope
    gitBranch: $gitBranch
    cwd: $cwd
  ) {
    byDay {
      ...UsageSkillUsageByDay
    }
    byScope {
      ...UsageSkillUsageByScope
    }
    bySkill {
      ...UsageSkillUsageBySkill
    }
    filterOptions {
      ...UsageSkillUsageFilterOptions
    }
    totalCount
  }
}
