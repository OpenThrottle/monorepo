fragment ScheduledJobCard on ScheduledAgentJobObject {
  cronPattern
  driverId
  enabled
  id
  lastRunAt
  model
  name
  nextRunAt
  repository {
    displayName
    filesystemPath
    id
  }
  repositoryCheckoutId
  timezone
  updatedAt
}

query scheduledAgentJobs {
  scheduledAgentJobs {
    ...ScheduledJobCard
  }
}
