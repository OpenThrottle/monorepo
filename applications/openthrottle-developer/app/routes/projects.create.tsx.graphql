query getProjectCreateOptions {
  workspaceRepositories {
    ...ProjectRepositoryRow
  }
}

mutation createProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    createdAt
    description
    id
    name
    updatedAt
  }
}

mutation ProjectCreateLinkRepository($input: LinkProjectRepositoryInput!) {
  linkProjectRepository(input: $input) {
    projectId
    repositoryId
  }
}
