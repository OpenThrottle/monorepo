# Dry-run of a tag→action rule against the caller's plans (read-only). Backs the
# live "matches N plans" summary in the rule form and the "why does/doesn't this
# match" section of the rule detail page.
fragment RulePreviewCondition on TagActionConditionObject {
  actual
  condition
  expected
  passed
}

fragment RulePreviewNonMatch on TagActionRulePreviewNonMatchObject {
  conditions {
    ...RulePreviewCondition
  }
  failedOnlyOnEnvironment
  id
  missingTags
  projectId
  repositoryId
  status
  title
}

fragment RulePreview on TagActionRulePreviewObject {
  cap
  environment
  evaluated
  matched {
    id
    projectId
    repositoryId
    status
    title
  }
  matchedCount
  nonMatching {
    ...RulePreviewNonMatch
  }
  specificity
  truncated
}

query RulePreview($environment: String, $input: UpsertTagActionRuleInput!) {
  previewTagActionRule(environment: $environment, input: $input) {
    ...RulePreview
  }
}
