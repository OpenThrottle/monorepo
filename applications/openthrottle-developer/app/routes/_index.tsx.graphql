query DiscoverAgentClis {
  discoverAgentClis {
    agents {
      authState {
        status
      }
      backend
      capabilities {
        approvals
        editApprovals
      }
      chatCapable
      enabled
      label
      modelOptions {
        enabled
        favorite
        model
      }
      supportsCustomBaseUrl
      version
    }
    totalCount
  }
}

query DiscoverLocalModels {
  discoverLocalModels {
    endpoints {
      baseUrl
      host
      models
      provider
    }
    totalCount
  }
}

query PersonaPrompts {
  customPrompts(input: { promptType: PERSONAS }) {
    description
    id
    title
  }
}

query WorkspaceLocalRepositories {
  workspaceLocalRepositories {
    displayName
    filesystemPath
    gitCurrentBranch
    gitDefaultBranch
    gitRemoteUrl
    id
    kind
    project {
      name
    }
  }
}

mutation StartConversationStream($input: StartConversationStreamInput!) {
  startConversationStream(input: $input) {
    assistantMessageId
    conversationId
    errorMessage
    userMessageId
  }
}

mutation CancelConversationStream($conversationId: ID!) {
  cancelConversationStream(conversationId: $conversationId)
}

mutation RespondToConversationPermission(
  $conversationId: ID!
  $optionId: String
  $requestId: String!
) {
  respondToConversationPermission(
    conversationId: $conversationId
    optionId: $optionId
    requestId: $requestId
  )
}

subscription ConversationStreamChunkAdded($conversationId: ID!) {
  conversationStreamChunkAdded(conversationId: $conversationId) {
    conversationId
    delta
    done
    error
    id
    kind
    messageId
    metadataJson
    sortOrder
  }
}

mutation StartTranscriptionStream {
  startTranscriptionStream {
    errorMessage
    sessionId
  }
}

mutation SendTranscriptionAudioChunk(
  $audioBase64: String!
  $sessionId: ID!
  $sortOrder: Int!
) {
  sendTranscriptionAudioChunk(
    audioBase64: $audioBase64
    sessionId: $sessionId
    sortOrder: $sortOrder
  )
}

mutation StopTranscriptionStream($sessionId: ID!) {
  stopTranscriptionStream(sessionId: $sessionId)
}

subscription TranscriptionStreamChunkAdded($sessionId: ID!) {
  transcriptionStreamChunkAdded(sessionId: $sessionId) {
    done
    error
    sessionId
    sortOrder
    transcript
  }
}

# The composer seeds from the saved default agent when the toolbar atom has no
# remembered pick (D3/D4); the editor half is read once by the root loader.
query HomeDefaultAgent {
  userPreferences {
    defaultAgent {
      backend
      effort
      model
    }
  }
}
