query DiscoverAgentClis {
  discoverAgentClis {
    agents {
      backend
      label
      version
    }
    totalCount
  }
}

query DiscoverLocalModels {
  discoverLocalModels {
    endpoints {
      baseUrl
      host
      models
      provider
    }
    totalCount
  }
}

query PersonaPrompts {
  customPrompts(input: { promptType: PERSONAS }) {
    description
    id
    title
  }
}

query WorkspaceLocalRepositories {
  workspaceLocalRepositories {
    displayName
    filesystemPath
    id
  }
}

mutation StartConversationStream($input: StartConversationStreamInput!) {
  startConversationStream(input: $input) {
    assistantMessageId
    conversationId
    errorMessage
    userMessageId
  }
}

mutation CancelConversationStream($conversationId: ID!) {
  cancelConversationStream(conversationId: $conversationId)
}

subscription ConversationStreamChunkAdded($conversationId: ID!) {
  conversationStreamChunkAdded(conversationId: $conversationId) {
    conversationId
    delta
    done
    error
    id
    kind
    messageId
    metadataJson
    sortOrder
  }
}
