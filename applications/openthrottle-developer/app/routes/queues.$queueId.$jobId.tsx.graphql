fragment JobDetailsCard on JobObject {
  data
  executionBackend
  failedReason
  finishedOn
  id
  name
  processedOn
  progress
  returnvalue
  state
  taskRunMetrics {
    atEnd {
      heapUsedMb
      rssMb
    }
    atStart {
      heapUsedMb
      rssMb
    }
  }
  timestamp
}

query getQueueJobDetails($jobId: ID!, $queueName: String!) {
  job(jobId: $jobId, queueName: $queueName) {
    ...JobDetailsCard
  }
}

mutation QueueJobDetailRetry($input: RetryJobInput!) {
  retryJob(input: $input) {
    error
    jobId
    success
  }
}

mutation QueueJobDetailCancelPlanRun($input: CancelPlanRunInput!) {
  cancelPlanRun(input: $input) {
    activeJobIdsCouldNotCancel
    cancelRequested
    noMatchingJob
    outcome
    planId
    planStatusAfter
    removedJobIds
    signaledActiveRunToStop
  }
}
