# totalCount and hasNext support "Showing N" and future Load more.
fragment DashboardActivityCard on ActivityByDateResultObject {
  commits {
    createdAt
    id
    message
    planId
    planTitle
    repo
    sha
    taskId
    taskTitle
  }
  hasNext
  outputChunks {
    content
    createdAt
    id
    iteration
    planId
    planTitle
  }
  tasksUpdated {
    id
    planId
    planTitle
    status
    title
    updatedAt
  }
  totalCount
}

fragment DashboardQueueStatsCard on QueueStatsObject {
  activeCount
  completedCount
  delayedCount
  failedCount
  name
  waitingCount
}

fragment DashboardDailyStatsCard on DailyStatsObject {
  date
  plansCompleted
  plansCreated
  plansUpdated
  tasksCompleted
  tasksCreated
  tasksUpdated
}

query getDashboard(
  $input: ActivityByDateInput!
  $start: String!
  $end: String!
) {
  activityByDate(input: $input) {
    ...DashboardActivityCard
  }

  dailyStatsRange(start: $start, end: $end) {
    items {
      ...DashboardDailyStatsCard
    }
  }

  queues {
    ...DashboardQueueStatsCard
  }

  # users {
  #   createdAt
  #   email
  #   id
  #   updatedAt
  # }
}

# First-run onboarding signals for the dashboard "Get Started" checklist.
# Kept in its own query/promise so it streams independently and never blocks
# the activity chart. All fields are cheap counts/booleans — never full lists.
query getDashboardOnboarding {
  discoverAgentClis {
    totalCount
  }

  githubTokenConfigured

  planCountsByStatus {
    count
    status
  }

  workspaceLocalRepositories {
    id
  }
}

# Apollo derives an operation's cache policy from its MOST RESTRICTIVE field, so
# every field here must carry a resolver-side setCacheHint AND a long one. This
# query costs ~4s of live GitHub API; anything short-lived selected alongside it
# drags the whole operation down to its own maxAge. githubTokenConfigured
# (hinted at only 30s, since it tracks server env) therefore lives on
# getDashboardOnboarding instead — the loader joins the two.
query getDashboardGithubStats($owner: String!, $repo: String!) {

  closedPrCountByAuthor: openPrCountByAuthor(
    input: { owner: $owner, repo: $repo, state: "closed" }
  ) {
    author
    openCount
  }

  openPrCountByAuthor: openPrCountByAuthor(
    input: { owner: $owner, repo: $repo, state: "open" }
  ) {
    author
    openCount
  }

  prTimeInStateSummary(
    input: { owner: $owner, repo: $repo, state: "open" }
  ) {
    avgDaysInState
    count
    state
  }
}

mutation triggerNotification {
  triggerWebsocketNotification
}
