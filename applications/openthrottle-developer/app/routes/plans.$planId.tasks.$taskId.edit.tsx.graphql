# plans.$planId.tasks.edit.$taskId
query getTaskForEditById($id: ID!) {
  task(id: $id) {
    assignee
    category
    createdAt
    description
    id
    planId
    projectRelation {
      id
      name
    }
    requirementsJson
    status
    summary
    title
    updatedAt
  }
}

mutation updateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    assignee
    category
    createdAt
    description
    id
    planId
    status
    summary
    title
    updatedAt
  }
}
