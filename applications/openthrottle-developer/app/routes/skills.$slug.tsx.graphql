fragment SkillDetailUsageBySkill on SkillUsageBySkillObject {
  abandonedCount
  avgDurationMs
  count
  errorCount
  lastUsedAt
  outcomeCount
  scope
  skillName
  successCount
}

fragment SkillDetailUsageByDay on SkillUsageByDayObject {
  date
  oursCount
  thirdPartyCount
  totalCount
}

query getSkillDetailUsage($start: String!, $end: String!, $skillName: String!) {
  skillUsage(start: $start, end: $end, skillName: $skillName) {
    byDay {
      ...SkillDetailUsageByDay
    }
    bySkill {
      ...SkillDetailUsageBySkill
    }
  }
}
