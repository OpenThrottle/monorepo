fragment BlogEditorAuthor on BlogAuthorObject {
  displayName
  slug
}

fragment BlogEditorTag on BlogTagObject {
  name
  slug
}

fragment UpdateBlogPostOutcome on UpdateBlogPostResult {
  __typename
  ... on BlogCoverAltRequiredError {
    message
  }
  ... on BlogPostAdminObject {
    id
    updatedAt
  }
  ... on BlogPostNotFoundError {
    message
  }
  ... on BlogPostPublishPermissionRequiredError {
    message
  }
  ... on BlogPostStaleWriteError {
    currentUpdatedAt
    message
  }
  ... on BlogReferenceNotFoundError {
    entity
    key
    message
  }
  ... on BlogSlugConflictError {
    message
    slug
  }
}

fragment SetBlogPostTagsOutcome on SetBlogPostTagsResult {
  __typename
  ... on BlogPostAdminObject {
    id
    updatedAt
  }
  ... on BlogPostNotFoundError {
    message
  }
  ... on BlogPostPublishPermissionRequiredError {
    message
  }
  ... on BlogReferenceNotFoundError {
    entity
    key
    message
  }
}

fragment PublishBlogPostOutcome on PublishBlogPostResult {
  __typename
  ... on BlogPostAdminObject {
    id
    publishedAt
    state
    updatedAt
  }
  ... on BlogPostNotFoundError {
    message
  }
}

fragment UnpublishBlogPostOutcome on UnpublishBlogPostResult {
  __typename
  ... on BlogPostAdminObject {
    id
    state
    updatedAt
  }
  ... on BlogPostNotFoundError {
    message
  }
}

fragment ArchiveBlogPostOutcome on ArchiveBlogPostResult {
  __typename
  ... on BlogPostAdminObject {
    id
    state
    updatedAt
  }
  ... on BlogPostNotFoundError {
    message
  }
}

fragment BlogPostEditorPost on BlogPostAdminObject {
  author {
    displayName
    slug
  }
  bodyMarkdown
  coverImageAlt
  coverImageUrl
  excerpt
  id
  lastEditedBy
  publishedAt
  seoDescription
  seoTitle
  slug
  state
  tags {
    name
    slug
  }
  title
  updatedAt
}

query getBlogPostEditor($id: ID!) {
  blogAdminAuthors {
    ...BlogEditorAuthor
  }
  blogAdminPost(id: $id) {
    __typename
    ... on BlogPostAdminObject {
      ...BlogPostEditorPost
    }
    ... on BlogPostNotFoundError {
      message
    }
  }
  blogAdminTags {
    ...BlogEditorTag
  }
}

mutation updateBlogPostEditor($input: UpdateBlogPostInput!) {
  updateBlogPost(input: $input) {
    ...UpdateBlogPostOutcome
  }
}

mutation setBlogPostEditorTags($input: SetBlogPostTagsInput!) {
  setBlogPostTags(input: $input) {
    ...SetBlogPostTagsOutcome
  }
}

mutation publishBlogPostEditor($input: PublishBlogPostInput!) {
  publishBlogPost(input: $input) {
    ...PublishBlogPostOutcome
  }
}

mutation unpublishBlogPostEditor($id: ID!) {
  unpublishBlogPost(id: $id) {
    ...UnpublishBlogPostOutcome
  }
}

mutation archiveBlogPostEditor($id: ID!) {
  archiveBlogPost(id: $id) {
    ...ArchiveBlogPostOutcome
  }
}
