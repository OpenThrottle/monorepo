fragment QueueCard on QueueStatsObject {
  activeCount
  completedCount
  delayedCount
  failedCount
  name
  waitingCount
}

query getQueues {
  queues {
    ...QueueCard
  }
}

mutation QueuesPauseQueue($input: QueueControlInput!) {
  pauseQueue(input: $input) {
    error
    queueName
    success
  }
}

mutation QueuesResumeQueue($input: QueueControlInput!) {
  resumeQueue(input: $input) {
    error
    queueName
    success
  }
}
