fragment ProjectCard on ProjectObject {
  createdAt
  description
  id
  isFavorite
  name
  nxProjectName
  plans {
    id
    status
  }
  tasks {
    title
  }
  updatedAt
}

query getProjects {
  projects {
    ...ProjectCard
  }
}

mutation ProjectSetFavorite($favorite: Boolean!, $projectId: ID!) {
  setProjectFavorite(favorite: $favorite, projectId: $projectId) {
    favorite
    projectId
  }
}
