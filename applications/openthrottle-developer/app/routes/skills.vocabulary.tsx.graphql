mutation AddSkillTag($input: AddSkillTagInput!) {
  addSkillTag(input: $input) {
    id
    tag
  }
}

mutation RenameSkillTag($input: RenameSkillTagInput!) {
  renameSkillTag(input: $input) {
    id
    tag
  }
}

mutation RemoveSkillTag($input: RemoveSkillTagInput!) {
  removeSkillTag(input: $input)
}
