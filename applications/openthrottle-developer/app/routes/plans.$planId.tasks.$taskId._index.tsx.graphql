# plans.$planId.tasks.$taskId

query getTaskById($id: ID!) {
  skillTagVocabulary {
    tags {
      dimension
      id
      tag
    }
    totalCount
  }
  task(id: $id) {
    afterHooks {
      ...HookTask
    }
    beforeHooks {
      ...HookTask
    }
    ...PlanTaskRow
    tags {
      ...TaskTagChip
    }
  }
}

fragment TaskTagChip on TaskTagObject {
  confidence
  dimension
  id
  source
  tag
}

mutation TaskDetailAddTaskTag($input: AddTaskTagInput!) {
  addTaskTag(input: $input) {
    ...TaskTagChip
  }
}

mutation TaskDetailRemoveTaskTag($input: RemoveTaskTagInput!) {
  removeTaskTag(input: $input)
}

mutation TaskDetailPromoteToPlan($input: PromoteTaskToPlanInput!) {
  promoteTaskToPlan(input: $input) {
    error
    jobId
    success
  }
}

query TaskLinkedArtifacts($taskId: ID!) {
  workArtifactsByTask(input: { taskId: $taskId }) {
    artifacts {
      ...LinkedArtifact
    }
    totalCount
  }
}

# Task-scoped output (v1): the server list query filters by planId only, so the
# task route fetches the plan's chunks here and the Task Output tab filters them
# client-side by taskId (live deltas reuse the PlanOutputChunkAdded subscription).
# A server-side taskId filter is a possible follow-up if plan streams grow large.
query TaskOutputStreamChunks($planId: ID!) {
  planOutputStreamChunks(input: { planId: $planId }) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

# Backs the task-detail toolbar's Mark Complete action (`setTaskStatus` in
# app/routing/plans/actions/taskId.ts). Relocated here when the task edit form
# route was removed; the operation name is load-bearing — it generates
# `UpdateTaskDocument`.
mutation updateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    assignee
    category
    createdAt
    description
    id
    planId
    status
    summary
    title
    updatedAt
  }
}
