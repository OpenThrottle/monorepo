query SettingsAgentsAgentClis {
  discoverAgentClis {
    agents {
      auth {
        warning
      }
      driver
      enabled
      label
      modelOptions {
        enabled
        favorite
        model
      }
      version
    }
    scannedAt
    totalCount
  }
}

query AgentCliSetupConfig {
  agentCliSetupConfig {
    canManage
    installEnabled
  }
}

mutation SetAgentEnabled($driver: String!, $enabled: Boolean!) {
  setAgentEnabled(driver: $driver, enabled: $enabled) {
    driver
    enabled
  }
}

mutation SetAgentModelEnabled(
  $driver: String!
  $model: String!
  $enabled: Boolean!
) {
  setAgentModelEnabled(driver: $driver, model: $model, enabled: $enabled) {
    driver
    enabled
    model
  }
}

mutation SetAgentModelsEnabled(
  $driver: String!
  $models: [String!]!
  $enabled: Boolean!
) {
  setAgentModelsEnabled(driver: $driver, models: $models, enabled: $enabled) {
    driver
    enabled
  }
}

mutation SetAgentModelFavorite(
  $driver: String!
  $model: String!
  $favorite: Boolean!
) {
  setAgentModelFavorite(driver: $driver, model: $model, favorite: $favorite) {
    driver
    favorite
    model
  }
}

fragment AgentSetupChunk on AgentSetupStreamChunkObject {
  data
  done
  error
  exitCode
  id
  runId
  sortOrder
  stream
}

subscription AgentSetupChunkAdded($runId: ID!) {
  agentSetupChunkAdded(runId: $runId) {
    ...AgentSetupChunk
  }
}
