query SettingsAgentsAgentClis {
  discoverAgentClis {
    agents {
      backend
      enabled
      label
      modelOptions {
        enabled
        favorite
        model
      }
      version
    }
    scannedAt
    totalCount
  }
}

query AgentCliSetupConfig {
  agentCliSetupConfig {
    canManage
    installEnabled
  }
}

mutation SetAgentEnabled($backend: String!, $enabled: Boolean!) {
  setAgentEnabled(backend: $backend, enabled: $enabled) {
    backend
    enabled
  }
}

mutation SetAgentModelEnabled(
  $backend: String!
  $model: String!
  $enabled: Boolean!
) {
  setAgentModelEnabled(backend: $backend, model: $model, enabled: $enabled) {
    backend
    enabled
    model
  }
}

mutation SetAgentModelsEnabled(
  $backend: String!
  $models: [String!]!
  $enabled: Boolean!
) {
  setAgentModelsEnabled(backend: $backend, models: $models, enabled: $enabled) {
    backend
    enabled
  }
}

mutation SetAgentModelFavorite(
  $backend: String!
  $model: String!
  $favorite: Boolean!
) {
  setAgentModelFavorite(backend: $backend, model: $model, favorite: $favorite) {
    backend
    favorite
    model
  }
}

subscription AgentSetupChunkAdded($runId: ID!) {
  agentSetupChunkAdded(runId: $runId) {
    data
    done
    error
    exitCode
    id
    runId
    sortOrder
    stream
  }
}
