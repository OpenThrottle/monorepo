fragment HealthCard on ServerHealthObject {
  api
  database
  redis
  websocket
}

fragment NotificationFields on NotificationEvent {
  event
  link
  message
  severity
  timestamp

  ... on DebugNotification {
    dataJson
  }

  ... on PlanEnqueuedNotification {
    planId
    queuePosition
    queueTotal
  }

  ... on PlanUpdatedNotification {
    planId
    taskId
  }

  ... on TaskCompletedNotification {
    planId
    taskId
  }

  ... on QueueJobCompletedNotification {
    jobType
    taskId
  }

  ... on PlanWaitingForWorktreeNotification {
    planId
    retryDelayMs
  }

  ... on PlanStatusChangedNotification {
    planId
    status
  }

  ... on SystemAlertNotification {
    code
  }

  ... on TaskStatusChangedNotification {
    planId
    status
    taskId
  }
}

fragment RootMetrics on ServerMetricsObject {
  cpuSystemMs
  cpuUserMs
  externalMb
  heapTotalMb
  heapUsedMb
  rssMb
}

query getMyUser {
  me {
    createdAt
    disabledAt
    email
    githubUsername
    id
    updatedAt
  }
}

query evaluateFeatureFlags($anonymousId: String, $applicationKey: String) {
  evaluateFeatureFlags(
    anonymousId: $anonymousId
    applicationKey: $applicationKey
  ) {
    enabled
    key
    kind
    reason
    valueJson
    variationIndex
  }
}

query getRootHealth {
  serverHealth {
    ...HealthCard
  }
}

query getRootMetrics {
  serverMetrics {
    ...RootMetrics
  }
}

query listAgentConversations($input: ListAgentConversationsInput) {
  listAgentConversations(input: $input) {
    conversations {
      id
      status
      title
      updatedAt
    }
    totalCount
  }
}

mutation deleteAgentConversation($input: DeleteAgentConversationInput!) {
  deleteAgentConversation(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation updateAgentConversationTitle($input: UpdateAgentConversationTitleInput!) {
  updateAgentConversationTitle(input: $input) {
    id
    status
    title
    updatedAt
  }
}

query getAgentConversationMessages($input: GetAgentConversationMessagesInput!) {
  getAgentConversationMessages(input: $input) {
    messages {
      content
      createdAt
      id
      role
      routingConfidence
      routingReason
      toolMetadataJson
    }
    totalCount
  }
}

mutation login($input: LoginInput!) {
  login(input: $input) {
    accessToken
  }
}

mutation logout {
  signout {
    success
  }
}

mutation register($input: RegisterInput!) {
  register(input: $input) {
    accessToken
    email
    id
  }
}

mutation sendAgentMessage($input: AgentsRunChatTurnInput!) {
  agentsRunChatTurn(input: $input) {
    assistantText
    conversationId
    errorMessage
    mcpTool
    readOnlyAgentsChat
    routingConfidence
    routingReason
    structuredPayloadJson
    toolMetadataJson
  }
}

subscription Notifications {
  notifications {
    ...NotificationFields
  }
}
