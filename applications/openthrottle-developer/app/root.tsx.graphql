fragment HealthCard on ServerHealthObject {
  api
  database
  redis
  websocket
}

fragment RootMetrics on ServerMetricsObject {
  cpuSystemMs
  cpuUserMs
  externalMb
  heapTotalMb
  heapUsedMb
  rssMb
}

query getMyUser {
  me {
    createdAt
    disabledAt
    email
    githubUsername
    id
    updatedAt
  }
}

query getRootHealth {
  serverHealth {
    ...HealthCard
  }
}

query getRootMetrics {
  serverMetrics {
    ...RootMetrics
  }
}

mutation login($input: LoginInput!) {
  login(input: $input) {
    accessToken
  }
}

mutation logout {
  signout {
    success
  }
}

mutation register($input: RegisterInput!) {
  register(input: $input) {
    accessToken
    email
    id
  }
}

mutation sendAgentMessage($input: AgentsRunChatTurnInput!) {
  agentsRunChatTurn(input: $input) {
    assistantText
    conversationId
    errorMessage
    mcpTool
    readOnlyAgentsChat
    routingConfidence
    routingReason
    structuredPayloadJson
    toolMetadataJson
  }
}
