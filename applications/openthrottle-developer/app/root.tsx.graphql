fragment BackgroundActivityFields on BackgroundActivityObject {
  done
  etaSeconds
  id
  label
  startedAt
  status
  total
}

fragment HealthCard on ServerHealthObject {
  api
  database
  redis
  websocket
}

fragment NotificationFields on NotificationEvent {
  event
  link
  message
  severity
  timestamp

  ... on DebugNotification {
    dataJson
  }

  ... on PlanEnqueuedNotification {
    planId
    queuePosition
    queueTotal
  }

  ... on PlanUpdatedNotification {
    planId
    taskId
  }

  ... on TaskCompletedNotification {
    planId
    taskId
  }

  ... on QueueJobCompletedNotification {
    jobType
    taskId
  }

  ... on PlanWaitingForWorktreeNotification {
    planId
    retryDelayMs
  }

  ... on PlanStatusChangedNotification {
    planId
    status
  }

  ... on ScheduledRunFailedNotification {
    reason
    runCount
    runId
    scheduledAgentJobId
    scheduleName
  }

  ... on SystemAlertNotification {
    code
  }

  ... on TaskStatusChangedNotification {
    planId
    status
    taskId
  }
}

fragment RootMetrics on ServerMetricsObject {
  cpuSystemMs
  cpuUserMs
  externalMb
  heapTotalMb
  heapUsedMb
  rssMb
}

query getMyPermissions {
  myPermissions
}

query getMyUser {
  me {
    createdAt
    disabledAt
    email
    githubUsername
    id
    updatedAt
  }
}

# Only the default editor: every generic open-in-editor link reads it through
# DefaultEditorContext. The agent half of the preferences is per-surface.
query getMyDefaultEditor {
  userPreferences {
    defaultEditor
  }
}

query evaluateFeatureFlags($anonymousId: String, $applicationKey: String) {
  evaluateFeatureFlags(
    anonymousId: $anonymousId
    applicationKey: $applicationKey
  ) {
    enabled
    key
    kind
    reason
    valueJson
    variationIndex
  }
}

query getRootHealth {
  backgroundActivities {
    ...BackgroundActivityFields
  }
  serverHealth {
    ...HealthCard
  }
}

query getRootMetrics {
  serverMetrics {
    ...RootMetrics
  }
}

query listAgentConversations($input: ListAgentConversationsInput) {
  listAgentConversations(input: $input) {
    items {
      groupId
      id
      pinned
      status
      title
      updatedAt
    }
    totalCount
  }
}

query listAgentConversationGroups {
  listAgentConversationGroups {
    id
    name
    sortOrder
  }
}

mutation setAgentConversationPinned($input: SetAgentConversationPinnedInput!) {
  setAgentConversationPinned(input: $input) {
    groupId
    id
    pinned
    status
    title
    updatedAt
  }
}

mutation moveAgentConversationToGroup(
  $input: MoveAgentConversationToGroupInput!
) {
  moveAgentConversationToGroup(input: $input) {
    groupId
    id
    pinned
    status
    title
    updatedAt
  }
}

mutation createAgentConversationGroup(
  $input: CreateAgentConversationGroupInput!
) {
  createAgentConversationGroup(input: $input) {
    id
    name
    sortOrder
  }
}

mutation renameAgentConversationGroup(
  $input: RenameAgentConversationGroupInput!
) {
  renameAgentConversationGroup(input: $input) {
    id
    name
    sortOrder
  }
}

mutation deleteAgentConversationGroup(
  $input: DeleteAgentConversationGroupInput!
) {
  deleteAgentConversationGroup(input: $input) {
    id
    name
    sortOrder
  }
}

mutation reorderAgentConversationGroup(
  $input: ReorderAgentConversationGroupInput!
) {
  reorderAgentConversationGroup(input: $input) {
    id
    name
    sortOrder
  }
}

mutation deleteAgentConversation($input: DeleteAgentConversationInput!) {
  deleteAgentConversation(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation restoreAgentConversation($input: RestoreAgentConversationInput!) {
  restoreAgentConversation(input: $input) {
    id
    status
    title
    updatedAt
  }
}

mutation updateAgentConversationTitle(
  $input: UpdateAgentConversationTitleInput!
) {
  updateAgentConversationTitle(input: $input) {
    id
    status
    title
    updatedAt
  }
}

query getAgentConversationMessages($input: GetAgentConversationMessagesInput!) {
  getAgentConversationMessages(input: $input) {
    items {
      content
      createdAt
      id
      role
      routingConfidence
      routingReason
      toolMetadataJson
    }
    totalCount
  }
}

mutation login($input: LoginInput!) {
  login(input: $input) {
    accessToken
  }
}

mutation logout {
  signout {
    success
  }
}

mutation register($input: RegisterInput!) {
  register(input: $input) {
    accessToken
    email
    id
  }
}

mutation sendAgentMessage($input: AgentsRunChatTurnInput!) {
  agentsRunChatTurn(input: $input) {
    assistantText
    conversationId
    errorMessage
    mcpTool
    readOnlyAgentsChat
    routingConfidence
    routingReason
    structuredPayloadJson
    toolMetadataJson
  }
}

subscription Notifications {
  notifications {
    ...NotificationFields
  }
}
