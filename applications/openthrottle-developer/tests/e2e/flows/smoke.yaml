# Web smoke: launch dev server URL and assert shell chrome (breadcrumb brand).
# Prerequisite: `pnpm nx serve openthrottle-developer` (default port 6020 per `.env.default`).
url: http://localhost:6020
---
- launchApp
- assertVisible: 'OpenThrottle'

- tapOn: Dashboard
- assertVisible: "Get a pulse of all your Plans, Tasks, PR's, Prompts, Skills, and more coming soon."
# - tapOn:
#     text: ".*Settings.*"    # Regex for partial match
