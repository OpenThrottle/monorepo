# Maestro workspace config for openthrottle-developer
#
# This file is consumed by `maestro test ... --config config.yaml` (or when
# `config.yaml` is auto-discovered from the workspace root).
# The Ralph plan keeps Maestro assets fully decoupled from `app/`; everything lives
# under `applications/openthrottle-developer/tests/e2e/` so flows resolve relative
# to this directory when Maestro is invoked from here.
#
# Resolution model:
#   cwd           : applications/openthrottle-developer/tests/e2e
#   flows glob    : flows/**/*.yaml
#   shared steps  : helpers/**/*.yaml (subflows referenced via `runFlow`)
#   artifacts     : output/ (gitignored — recordings, screenshots, reports)
#
# Tagging scheme (every flow declares tags; CI scopes with --include-tags):
#   smoke   — fast, unauthenticated PR gate (flows/smoke.yaml).
#   full    — the complete suite (every flow carries `full`); the deeper run.
#   auth | plans | projects — per-area scoping for targeted local runs.
# Run scoped subsets via the Nx target configurations (see package.json):
#   pnpm nx run openthrottle-developer:test-e2e --configuration=smoke
#   pnpm nx run openthrottle-developer:test-e2e --configuration=full
# or directly: maestro test --config config.yaml --include-tags <tag>
#
# includeTags is left empty so the default `test-e2e` runs everything; scoping is
# applied per-invocation (the configurations above) rather than globally here.
flows:
  - 'flows/*.yaml'
  - 'flows/**/*.yaml'

includeTags: []
excludeTags:
  - wip

# Maestro v1.x supports `local` settings to stabilise CI runs. Tune as flows grow.
local:
  deterministicOrder: true
