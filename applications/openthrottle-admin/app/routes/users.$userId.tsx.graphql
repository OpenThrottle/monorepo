fragment UserDetails on UserObject {
  createdAt
  disabledAt
  email
  githubUsername
  id
  updatedAt
}

query getUser($id: ID!) {
  user(id: $id) {
    ...UserDetails
  }
}

mutation updateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    ...UserDetails
  }
}

mutation disableUser($id: ID!) {
  disableUser(id: $id) {
    ...UserDetails
  }
}

mutation enableUser($id: ID!) {
  enableUser(id: $id) {
    ...UserDetails
  }
}
