query DiscoverAgentClis {
  discoverAgentClis {
    agents {
      backend
      chatCapable
      label
      models
      version
    }
    totalCount
  }
}

query DiscoverLocalModels {
  discoverLocalModels {
    endpoints {
      baseUrl
      host
      models
      provider
    }
    totalCount
  }
}

query PersonaPrompts {
  customPrompts(input: { promptType: PERSONAS }) {
    description
    id
    title
  }
}

query WorkspaceLocalRepositories {
  workspaceLocalRepositories {
    displayName
    filesystemPath
    id
  }
}
