fragment HealthCard on ServerHealthObject {
  api
  database
  redis
  websocket
}

query getRootHealth {
  databaseHealth
  serverHealth {
    ...HealthCard
  }
}

query getMe {
  me {
    createdAt
    disabledAt
    email
    githubUsername
    id
    updatedAt
  }
}

mutation login($input: LoginInput!) {
  login(input: $input) {
    accessToken
  }
}

mutation signout {
  signout {
    success
  }
}
