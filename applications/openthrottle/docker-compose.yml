#############################################################################
#
#     🚀 OpenThrottle — consumer install (published images, one command)
#
#       - Docker Hub: https://hub.docker.com/u/openthrottle
#       - GitHub: https://github.com/OpenThrottle
#
#     From a clean machine you need only THIS file + a `.env` (copy
#     `.env.default`). No repo checkout, no build, no GITHUB_TOKEN:
#
#         cp .env.default .env                 # then edit OPENTHROTTLE_WORKSPACES_DIR etc.
#         docker compose up -d                 # postgres, redis, migrations, server, developer
#         docker compose run --rm bootstrap    # FIRST BOOT ONLY — create the login user
#
#     The bootstrap step is REQUIRED on a clean volume: the published postgres
#     image ships the schema but NO login user, and migrations don't create one.
#     The one-shot `bootstrap` seeds the default user (developer@openthrottle.ai /
#     FullThrottle2026!, override via OPENTHROTTLE_BOOTSTRAP_USER_*) and provisions
#     the MCP service-account credential. Idempotent — safe to re-run.
#
#     First boot: the `migrations` service applies the schema + incremental
#     migrations and exits before the server starts; then run `bootstrap`.
#
#     Upgrade: bump APP_VERSION (or keep `latest`) then
#         docker compose pull && docker compose up -d
#     `migrations` re-runs (idempotent) so an existing volume reaches the new schema.
#
#     Host execution bridge: point OPENTHROTTLE_WORKSPACES_DIR at the directory
#     holding your local checkouts; it is mounted at /workspaces so registered
#     repositories resolve inside the containers.
#
#     Networking: services talk to each other over the compose network by name
#     (postgres:5432, redis:6379, http://server:<port>); only the browser-facing
#     URLs use localhost:<published port>.
#
#     MCP (optional, for AI agents): the `mcp` service exposes openthrottle-mcp
#     over streamable HTTP. It's opt-in (profile `mcp`) and needs a one-time
#     token provisioning:
#         docker compose run --rm bootstrap        # provision the ot_sa token
#         # paste the printed token into OPENTHROTTLE_MCP_AUTH_TOKEN in .env
#         docker compose --profile mcp up -d mcp   # then register {type:http,url}
#
#############################################################################
x-common: &common
  NODE_ENV: ${NODE_ENV:-production}

x-developer: &developer
  <<: *common
  # Browser → server (published localhost); SSR → server (compose network).
  API_URL_EXTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_EXTERNAL}
  # API_URL_INTERNAL: http://server:${OPENTHROTTLE_SERVER_PORT}
  API_URL_INTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}
  APP_ENV: ${APP_ENV}
  APP_NAME: ${OPENTHROTTLE_DEVELOPER_APP_NAME}
  APP_NAME_SHORT: ${OPENTHROTTLE_DEVELOPER_APP_NAME_SHORT}
  APP_URL: ${OPENTHROTTLE_DEVELOPER_APP_URL}
  APP_URL_ADMIN: ${OPENTHROTTLE_DEVELOPER_APP_URL_ADMIN}
  APP_URL_CMS: ${OPENTHROTTLE_DEVELOPER_APP_URL_CMS}
  APP_URL_DEVELOPER: ${OPENTHROTTLE_DEVELOPER_APP_URL_DEVELOPER}
  APP_URL_EMAIL: ${OPENTHROTTLE_DEVELOPER_APP_URL_EMAIL}
  APP_URL_SERVER: ${OPENTHROTTLE_DEVELOPER_APP_URL_SERVER}
  APP_URL_WEBSITE: ${OPENTHROTTLE_DEVELOPER_APP_URL_WEBSITE}
  APP_VERSION: ${APP_VERSION}
  # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset).
  OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
  OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
  PORT: ${OPENTHROTTLE_DEVELOPER_PORT}
  ROLLBAR_TOKEN: ${ROLLBAR_TOKEN}

x-server: &server
  <<: *common
  API_URL_EXTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_EXTERNAL}
  # API_URL_INTERNAL: http://server:${OPENTHROTTLE_SERVER_PORT}
  API_URL_INTERNAL: ${OPENTHROTTLE_DEVELOPER_API_URL_INTERNAL}
  APP_ENV: ${APP_ENV}
  APP_NAME: ${OPENTHROTTLE_SERVER_APP_NAME}
  APP_NAME_SHORT: ${OPENTHROTTLE_SERVER_APP_NAME_SHORT}
  APP_URL: ${OPENTHROTTLE_SERVER_APP_URL}
  APP_VERSION: ${APP_VERSION}
  BULLMQ_BOARD_ADMIN_PASSWORD: ${OPENTHROTTLE_SERVER_BULLMQ_BOARD_ADMIN_PASSWORD:-admin}
  BULLMQ_BOARD_ADMIN_USERNAME: ${OPENTHROTTLE_SERVER_BULLMQ_BOARD_ADMIN_USERNAME:-admin}
  CORS_CREDENTIALS: ${OPENTHROTTLE_SERVER_CORS_CREDENTIALS}
  CORS_ORIGINS: ${OPENTHROTTLE_SERVER_CORS_ORIGINS}
  JWT_SECRET: ${OPENTHROTTLE_DEVELOPER_JWT_SECRET}
  # Host execution bridge (identity when OPENTHROTTLE_WORKSPACES_DIR is unset).
  OPENTHROTTLE_CONTAINER_WORKSPACES_DIR: /workspaces
  OPENTHROTTLE_HOST_WORKSPACES_DIR: ${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}
  # Service-to-service over the compose network (container ports).
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  PORT: ${OPENTHROTTLE_SERVER_PORT}

name: 'OpenThrottle'

services:
  #############################################################################
  #
  #     👨‍💻 developer | OpenThrottle Developer Platform
  #
  developer:
    image: openthrottle/developer:${APP_VERSION:-latest}
    # container_name: developer
    depends_on:
      server:
        condition: service_healthy
    # env_file:
    #   - .env
    environment:
      <<: *developer
    ports:
      - '${OPENTHROTTLE_DEVELOPER_PORT}:${OPENTHROTTLE_DEVELOPER_PORT}'
    restart: always
    volumes:
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'

  #############################################################################
  #
  #     🗄️ migrations | one-shot: apply incremental migrations, then exit
  #
  migrations:
    image: openthrottle/migrations:${APP_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    # env_file:
    #   - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # Compose-network hostname + CONTAINER port (5432) — not the published host
      # port ${POSTGRES_PORT}, which only exists for host-side clients. Matches the
      # server/bootstrap services (was ${POSTGRES_PORT} → ECONNREFUSED in-network).
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
    restart: 'no'

  #############################################################################
  #
  #     🗄️ postgres | PostgreSQL database
  #
  postgres:
    build:
      args:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_PORT: ${POSTGRES_PORT}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_VERSION: ${POSTGRES_VERSION}
      context: ./
      dockerfile: Dockerfile.Postgres
    # container_name: postgres
    # env_file:
    #   - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_VERSION: ${POSTGRES_VERSION}
    healthcheck:
      interval: 1s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      timeout: 5s
    image: openthrottle/postgres:${APP_VERSION:-latest}
    ports:
      - ${POSTGRES_PORT}:5432
    restart: always
    shm_size: 128mb # set shared memory limit when using docker compose (required for pgvector)
    volumes:
      - ot_docker_postgres_data:/var/lib/postgresql

  #############################################################################
  #
  #     🗄️ redis | Redis database
  #
  redis:
    # container_name: redis
    healthcheck:
      interval: 10s
      retries: 3
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 5s
    image: redis:${REDIS_VERSION}-alpine
    ports:
      - ${REDIS_PORT}:6379
    restart: always

  #############################################################################
  #
  #     👨‍💻 server | OpenThrottle Server
  #
  server:
    image: openthrottle/server:${APP_VERSION:-latest}
    # container_name: server
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # env_file:
    #   - .env
    environment:
      <<: *server
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_VERSION: ${POSTGRES_VERSION}
    # Healthcheck is provided by the image (distroless in-image probe on /health).
    ports:
      - '${OPENTHROTTLE_SERVER_PORT}:${OPENTHROTTLE_SERVER_PORT}'
    restart: always
    volumes:
      - '${OPENTHROTTLE_WORKSPACES_DIR:-/tmp/workspaces}:/workspaces'

  #############################################################################
  #
  #     🔐 bootstrap | one-shot MANUAL: default login user + MCP credential
  #
  #     NEVER runs on `docker compose up` (own profile; nothing depends on it) —
  #     but REQUIRED once on a clean volume: there is no baked login user, and
  #     migrations don't create one. Seeds the default user
  #     (developer@openthrottle.ai / FullThrottle2026!, override via
  #     OPENTHROTTLE_BOOTSTRAP_USER_*) and, when OPENTHROTTLE_MCP_AUTH_TOKEN is set,
  #     upserts the matching `ot_sa` credential the mcp service needs. Idempotent:
  #
  #         docker compose run --rm bootstrap
  #
  bootstrap:
    # Reuses the published `server` image (no separate bootstrap image); ENTRYPOINT
    # is node (distroless), so override CMD to the compiled bootstrap entry.
    image: openthrottle/server:${APP_VERSION:-latest}
    command: ['-r', 'dotenv/config', 'build/src/bootstrap.js']
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *common
      OPENTHROTTLE_MCP_AUTH_TOKEN: ${OPENTHROTTLE_MCP_AUTH_TOKEN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
    profiles: [bootstrap]
    restart: 'no'

  #############################################################################
  #
  #     🧠 mcp | openthrottle-mcp over streamable HTTP (opt-in; profile: mcp)
  #
  #     Docker-native MCP transport — no host Node needed. Register in your MCP
  #     client as { "type": "http", "url": "http://localhost:${OPENTHROTTLE_MCP_PORT}/mcp" }.
  #     Opt-in so `up` core stack works before you provision:
  #
  #         docker compose run --rm bootstrap          # once: provision the token
  #         # paste the printed token into OPENTHROTTLE_MCP_AUTH_TOKEN in .env
  #         docker compose --profile mcp up -d mcp
  #
  #     Machine tools use OPENTHROTTLE_MCP_AUTH_TOKEN (ot_sa); clients may send
  #     Authorization: Bearer <human JWT> for agent_conversation_* tools. Fails
  #     loudly at startup if the token is missing/invalid.
  #
  mcp:
    image: openthrottle/mcp:${APP_VERSION:-latest}
    depends_on:
      migrations:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    environment:
      <<: *common
      # Reach the server over the compose network by default; override only to
      # target a server outside this compose project.
      API_URL: ${OPENTHROTTLE_MCP_UPSTREAM_URL:-http://server:${OPENTHROTTLE_SERVER_PORT}}
      API_URL_INTERNAL: ${OPENTHROTTLE_MCP_UPSTREAM_URL:-http://server:${OPENTHROTTLE_SERVER_PORT}}
      OPENTHROTTLE_MCP_AUTH_TOKEN: ${OPENTHROTTLE_MCP_AUTH_TOKEN}
      OT_MCP_HTTP_PORT: ${OPENTHROTTLE_MCP_PORT}
    ports:
      - '${OPENTHROTTLE_MCP_PORT}:${OPENTHROTTLE_MCP_PORT}'
    profiles: [mcp]
    restart: always

volumes:
  ot_docker_postgres_data:
