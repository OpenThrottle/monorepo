# Enforce catalog usage for any dependency that has a catalog entry
# (https://pnpm.io/settings#catalogmode) — if this blocks an intentional
# exception, add it to the "legacy" named catalog below instead.
catalogMode: strict

# 🔐 💂 👀 https://pnpm.io/settings#minimumreleaseage 👀 💂 🔐
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  - '@openthrottle/*'

# eslint-plugin-react@7.37.5 is the latest release and its peer range stops at ^9.7,
# but only 7 of its 103 rules actually break under ESLint 10 (the two that call a
# removed context method without a fallback, plus five spacing rules that call the
# removed SourceCode#isSpaceBetweenTokens). This repo enables none of them, and the
# six rules it does enable were measured to report identically under 9.39.5 and
# 10.10.0. Drop this when the plugin widens its peer range.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'

# 🔧 Dependency overrides | https://pnpm.io/settings#overrides
# Migrated out of package.json's `pnpm` field, which pnpm ≥11 no longer reads.
# `$name` reuses the version declared for that dependency in the root manifest.
overrides:
  # @bull-board/nestjs@7 and @rekog/mcp-nest@1.9 cap these Nest peers at ^11, and
  # their importers don't declare them, so pnpm auto-installs the peer. pnpm 11
  # reused the workspace's Nest 12; pnpm 12 installs a separate in-range Nest 11
  # copy instead — a second @nestjs/core at runtime. Pin the peers to the
  # workspace's Nest 12. (peerDependencyRules.allowedVersions and
  # packageExtensions only change the warning, not what gets installed.) Drop
  # each line once its package widens its peer range to Nest 12.
  '@bull-board/nestjs>@nestjs/bull-shared': '^12.0.0'
  '@bull-board/nestjs>@nestjs/core': 'catalog:'
  '@rekog/mcp-nest>@nestjs/jwt': 'catalog:'
  '@rekog/mcp-nest>@nestjs/passport': 'catalog:'
  '@radix-ui/react-slot': 'catalog:'
  '@tanstack/query-sync-storage-persister': 'catalog:'
  '@tanstack/react-query': 'catalog:'
  '@tanstack/react-query-persist-client': 'catalog:'
  # fast-uri < 3.1.9 carries host-confusion and parsing advisories
  # (GHSA-7p8r-x3mc-p8w7 and later). ajv ^8 (via @modelcontextprotocol/sdk,
  # @rekog/mcp-nest and build tooling) allows ^3.0.1 but the lockfile held
  # 3.1.4. Drop this once the lockfile resolves >= 3.1.9 without it.
  'fast-uri@<3.1.9': '^3.1.9'
  'graphql-request': 'catalog:'
  'react': 'catalog:'
  'react-dom': 'catalog:'
  'shadcn>zod': '3.25.76'
  # debug's optional supports-color peer resolved to 7.2.0 or 8.1.1 depending on which
  # copy an importer's graph happened to contain, splitting vitest (via jsdom > debug)
  # into two peer variants. With two copies of vitest, the runner and the test files can
  # load different ones (`rejects.toThrow` then sees ''). 8.1.1 satisfies every declared
  # range (chalk 4's ^7 is API-compatible; jest-worker requires ^8). Drop this when the
  # lockfile has one supports-color without it.
  'supports-color': '8.1.1'
  # nx pins yaml exactly (24.0.6 → 2.9.0) while the catalog is ^2.9.1. vite takes
  # yaml as an optional peer, so the two copies split vite — and vitest with it —
  # into two peer variants, the same double-vitest hazard as supports-color above.
  # Point nx at the catalog's yaml; drop this once nx's pin matches the catalog.
  'nx>yaml': 'catalog:'
  # js-yaml 5.5 moved to argparse 3 (PSF-2.0, not on the license allowlist).
  # Keep js-yaml 5 on 5.4.x (argparse 2, Python-2.0) and every @langchain/classic
  # on the catalog's 1.0.57, the last release that accepts it; @langchain/community
  # otherwise resolves its own newer copy. Drop both, and lift the catalog pin, once
  # PSF-2.0 is allowed or argparse 3 is waived in license-policy.json.
  '@langchain/classic': 'catalog:'
  'js-yaml@^5': '~5.4.2'
  'zod': 'catalog:'
  'zod-to-json-schema': 'catalog:'

packages:
  - 'applications/*'
  - 'infra/'
  - 'packages/*'
  - 'tools/*'
  - '!packages/*/dist/**/*'
  - '!services/**/*'
