#
#     https://pnpm.io/docker
#

# 🏗️ pnpm ≥11 requires an explicit build-script decision per dependency
# (https://pnpm.io/settings#allowbuilds). All are `false` to preserve the
# pnpm 10 behavior, under which these were "Ignored build scripts" and the
# workspace worked off prebuilt binaries. Flip one to `true` only if a build
# is proven necessary.
#
# electron is deliberately absent: electron 45 (the locked version) has no
# install scripts, so there is nothing for allowBuilds to allow. Its index.js
# downloads the binary (dist/ + path.txt) lazily on the first
# `require('electron')`. electron-vite never makes that require, so
# `openthrottle-app:dev` runs electron's `install-electron` bin first; the
# first dev run after a clean install therefore needs network access.
# electron-builder (`openthrottle-app:package`) fetches its own Electron zip.
allowBuilds:
  '@apollo/protobufjs': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: false
  core-js: false
  electron-winstaller: false
  esbuild: false
  keytar: false
  less: false
  msgpackr-extract: false
  msw: false
  nx: false
  onnxruntime-node: false
  protobufjs: false
  unrs-resolver: false
  zeromq: false

# 🗄️ Virtual store | https://pnpm.io/settings
# `virtualStoreType` is deliberately left at its default (`project`). The
# global virtual store was measured and rejected for now: it breaks the
# developer Vitest suite through pnpm's injected NODE_OPTIONS hook, and it
# needs a lockfile-wide `addMissingPeerTypes`. Read
# docs/monorepo/pnpm-global-virtual-store.md before turning it on.

# injectWorkspacePackages: true
# syncInjectedDepsAfterScripts:
# - build

# 📚 Catalog | https://pnpm.io/catalogs
#
# Single source of truth for every external dependency version in the
# workspace. All package.json files reference these via the `catalog:`
# protocol; enforced by `pnpm run check:catalog` (scripts/check-catalog-coverage.ts).
# `@bull-board/api` requires `bullmq` dynamically from inside its own
# `queueAdapters/bullMQ.js` but declares it neither as a dependency nor as a
# peer, so pnpm has nothing to link and the require only ever resolved by
# walking up to a hoisted root `node_modules`. Declaring the peer here lets the
# consuming project satisfy it honestly instead of relying on root hoisting.
packageExtensions:
  '@bull-board/api':
    peerDependencies:
      bullmq: '*'

