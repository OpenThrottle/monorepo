# (https://pnpm.io/settings#catalogmode) — if this blocks an intentional
# exception, add it to the "legacy" named catalog below instead.
catalogMode: strict

# 🔐 💂 👀 https://pnpm.io/settings#minimumreleaseage 👀 💂 🔐
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  - '@openthrottle/*'

# 🔧 Dependency overrides | https://pnpm.io/settings#overrides
# Migrated out of package.json's `pnpm` field, which pnpm 11 no longer reads.
# `$name` reuses the version declared for that dependency in the root manifest.
