#
#     https://pnpm.io/docker
#

# 🏗️ pnpm 11 requires an explicit build-script decision per dependency
# (https://pnpm.io/settings#allowbuilds). All are `false` to preserve the
# pnpm 10 behavior, under which these were "Ignored build scripts" and the
# workspace worked off prebuilt binaries. Flip one to `true` only if a build
# is proven necessary.
allowBuilds:
  '@apollo/protobufjs': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  '@vscode/vsce-sign': false
  bcrypt: false
  core-js: false
  esbuild: false
  keytar: false
  less: false
  msgpackr-extract: false
  msw: false
  nx: false
  unrs-resolver: false
  zeromq: false

# injectWorkspacePackages: true
# syncInjectedDepsAfterScripts:
# - build

