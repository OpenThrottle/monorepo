<!--
  Lower third — 1080x1920 (9:16) overlay, transparent outside the bar.
  In: 1.5s. Hold: 3s. Out: fade. Carries the video title and nothing else.
  Sits above BOTH the portrait bottom safe area (15% = 288px) and the burned-in
  caption band, which occupies roughly the 190px above that. The bar's bottom edge
  is therefore at y=1300, not 1520 — at 1520 it overlapped the first caption, which
  is exactly the kind of thing you only see once it is rendered.
  Replace TITLE_LINE_1 / TITLE_LINE_2 at render time (see README.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" fill="none">
  <g transform="translate(64 1110)">
    <rect width="952" height="190" rx="16" fill="#0A0D0F" fill-opacity="0.92" />
    <rect width="6" height="190" rx="3" fill="#FF0000" />
    <g transform="translate(48 34)">
      <svg x="0" y="6" width="52" height="52" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="25" stroke="#20262D" stroke-width="4" />
        <path d="M14.3 49.7A25 25 0 0 1 49.7 14.3" stroke="#FF0000" stroke-width="4" stroke-linecap="round" />
        <path d="M32 32 46 21" stroke="#F7F9FA" stroke-width="4" stroke-linecap="round" />
        <circle cx="32" cy="32" r="4" fill="#FF0000" />
      </svg>
      <text x="76" y="42" font-family="Inter, -apple-system, Helvetica Neue, sans-serif" font-size="54" font-weight="800" fill="#F7F9FA">TITLE_LINE_1</text>
      <text x="76" y="104" font-family="Inter, -apple-system, Helvetica Neue, sans-serif" font-size="54" font-weight="800" fill="#F7F9FA">TITLE_LINE_2</text>
    </g>
  </g>
</svg>
