mutation createNote($input: CreateNoteInput!) {
  createNote(input: $input) {
    ...Note
  }
}

mutation deleteNote($id: ID!) {
  deleteNote(id: $id)
}

mutation register($input: RegisterInput!) {
  register(input: $input) {
    accessToken
    email
    id
  }
}

mutation updateNote($input: UpdateNoteInput!) {
  updateNote(input: $input) {
    ...Note
  }
}

mutation createPlan($input: CreatePlanInput!) {
  createPlan(input: $input) {
    ...Plan
  }
}

mutation updatePlan($input: UpdatePlanInput!) {
  updatePlan(input: $input) {
    ...Plan
  }
}

mutation deletePlan($input: DeletePlanInput!) {
  deletePlan(input: $input)
}

mutation createTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    ...Task
  }
}

mutation createTasks($input: CreateTasksInput!) {
  createTasks(input: $input) {
    tasks {
      ...Task
    }
    totalCount
  }
}

mutation createPlans($input: CreatePlansInput!) {
  createPlans(input: $input) {
    plans {
      ...Plan
    }
    totalCount
  }
}

mutation updateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    ...Task
  }
}

mutation deleteTask($input: DeleteTaskInput!) {
  deleteTask(input: $input)
}

mutation promoteTaskToPlan($input: PromoteTaskToPlanInput!) {
  promoteTaskToPlan(input: $input) {
    error
    jobId
    success
  }
}

mutation reorderPlanTasks($input: ReorderPlanTasksInput!) {
  reorderPlanTasks(input: $input) {
    ...Task
  }
}

mutation appendPlanOutput($input: AppendPlanOutputInput!) {
  appendPlanOutput(input: $input) {
    content
    createdAt
    id
    iteration
    planId
    taskId
  }
}

# The OT Loop job claims the plan inbox at each task boundary (docs/workflows/ot-loop-job.md § 9).
mutation ralphClaimPlanMessages($input: ClaimPlanMessagesInput!) {
  claimPlanMessages(input: $input) {
    messages {
      body
      id
      kind
    }
  }
}

mutation ralphStartWorkSession($input: StartWorkSessionInput!) {
  startWorkSession(input: $input) {
    id
  }
}

mutation ralphAttachWorkSessionSubject($input: AttachWorkSessionSubjectInput!) {
  attachWorkSessionSubject(input: $input) {
    id
  }
}

mutation ralphRecordWorkArtifact($input: RecordWorkArtifactInput!) {
  recordWorkArtifact(input: $input) {
    createdAt
    id
    message
  }
}

mutation ralphEndWorkSession($input: EndWorkSessionInput!) {
  endWorkSession(input: $input) {
    id
  }
}

mutation registerCliPlanRun($input: RegisterCliPlanRunInput!) {
  registerCliPlanRun(input: $input) {
    hostname
    pid
    ...PlanRun
    workerId
  }
}

mutation settleCliPlanRun($input: SettleCliPlanRunInput!) {
  settleCliPlanRun(input: $input) {
    hostname
    pid
    ...PlanRun
    workerId
  }
}

mutation recordPlanRunHeartbeat($input: RecordPlanRunHeartbeatInput!) {
  recordPlanRunHeartbeat(input: $input) {
    id
    lastHeartbeatAt
    status
  }
}

mutation registerPlanRunWorktreeCheckout(
  $input: RegisterPlanRunWorktreeCheckoutInput!
) {
  registerPlanRunWorktreeCheckout(input: $input) {
    checkout {
      displayName
      filesystemPath
      kind
    }
    ...PlanRun
  }
}

mutation createProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    ...Project
  }
}

mutation deleteProject($input: DeleteProjectInput!) {
  deleteProject(input: $input)
}

mutation recordAgentTrajectory($input: RecordAgentTrajectoryInput!) {
  recordAgentTrajectory(input: $input) {
    byteSize
    id
    incomplete
    toolCallCount
    truncated
  }
}
