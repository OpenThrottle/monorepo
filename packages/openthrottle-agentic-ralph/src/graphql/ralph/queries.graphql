query getNote($id: ID!) {
  note(id: $id) {
    ...Note
  }
}

query getNotes {
  notes {
    ...Note
  }
}

query getServerHealth {
  serverHealth {
    api
    database
    redis
    websocket
  }
}

query getPlan($id: ID!) {
  plan(id: $id) {
    ...Plan
  }
}

query listPlansByStatus($input: ListPlansByStatusInput!) {
  listPlansByStatus(input: $input) {
    plans {
      ...Plan
    }
    totalCount
  }
}

query getTask($id: ID!) {
  task(id: $id) {
    ...Task
  }
}

query getTasksByPlanId($input: TasksByPlanIdInput!) {
  tasksByPlanId(input: $input) {
    ...Task
  }
}

query getRemainingTasksByPlanId($input: RemainingTasksByPlanIdInput!) {
  remainingTasksByPlanId(input: $input) {
    ...Task
  }
}

query getTasks($limit: Int) {
  tasks(limit: $limit) {
    ...Task
  }
}

query getWorkArtifactsByPlan($input: WorkArtifactsByPlanInput!) {
  workArtifactsByPlan(input: $input) {
    artifacts {
      createdAt
      externalKey
      id
      lifecycle
      message
      payloadJson
      producedAt
      source
      type
      verification
    }
    totalCount
  }
}

query getActivityByDate($input: ActivityByDateInput!) {
  activityByDate(input: $input) {
    commits {
      createdAt
      id
      message
      planId
      planTitle
      repo
      sha
      taskId
      taskTitle
    }
    hasNext
    outputChunks {
      content
      createdAt
      id
      iteration
      planId
      planTitle
    }
    tasksUpdated {
      id
      planId
      planTitle
      status
      title
      updatedAt
    }
    totalCount
  }
}

query getActivityByDateRange($input: ActivityByDateRangeInput!) {
  activityByDateRange(input: $input) {
    commits {
      createdAt
      id
      message
      planId
      planTitle
      repo
      sha
      taskId
      taskTitle
    }
    hasNext
    outputChunks {
      content
      createdAt
      id
      iteration
      planId
      planTitle
    }
    tasksUpdated {
      id
      planId
      planTitle
      status
      title
      updatedAt
    }
    totalCount
  }
}

query getLastActivity($input: LastActivityInput!) {
  lastActivity(input: $input) {
    at
    commit {
      message
      repo
      sha
    }
    kind
    outputChunk {
      content
      iteration
    }
    planId
    summary
    taskId
    taskUpdate {
      status
      taskId
      taskTitle
    }
  }
}

query getPlanOutputStreamChunks($input: ListPlanOutputStreamChunksInput!) {
  planOutputStreamChunks(input: $input) {
    content
    createdAt
    id
    iteration
    planId
  }
}

query search($input: SearchInput!) {
  search(input: $input) {
    chunks {
      content
      id
      planId
      planTitle
      similarity
      source
      sourcePath
      sourceRepo
      sourceSha
      taskId
      taskTitle
    }
  }
}

query getDocument($id: String!) {
  getDocument(id: $id) {
    content
    id
    planId
    planTitle
    similarity
    source
    sourcePath
    sourceRepo
    sourceSha
    taskId
    taskTitle
  }
}

query listSources {
  listSources {
    plans {
      id
      title
    }
    sources {
      description
      name
    }
  }
}

query readPlanRunCancelMarker($input: PlanRunsByPlanIdInput!) {
  planRunsByPlanId(input: $input) {
    cancelRequestedAt
    createdAt
    id
    status
  }
}

query getProjects {
  projects {
    ...Project
  }
}

query getProject($id: ID!) {
  project(id: $id) {
    ...Project
  }
}
