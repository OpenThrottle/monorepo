fragment Note on NoteObject {
  author
  content
  createdAt
  id
  updatedAt
}

# Every plan-shaped operation spreads this fragment, so a field missing here is a
# field missing from every MCP plan tool result. A new PlanObject scalar must be
# selected here or consciously excluded in ../__tests__/fragment-coverage.test.ts,
# which fails otherwise.
fragment Plan on PlanObject {
  assignee
  author
  category
  completedAt
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  runConfigJson
  status
  summary
  title
  updatedAt
}

# Spread by every task-shaped operation, with the same reach as the Plan
# fragment above. Coverage of both is enforced by
# ../__tests__/fragment-coverage.test.ts.
fragment Task on TaskObject {
  assignee
  category
  completedAt
  createdAt
  description
  hookRole
  hookScope
  hookSource
  id
  parentTaskId
  planId
  project
  projectId
  requirementsJson
  skillSlug
  sortOrder
  status
  summary
  title
  updatedAt
}

fragment Project on ProjectObject {
  createdAt
  description
  id
  name
  nxProjectName
  updatedAt
}

# The run-provenance projection: what a run was, on what, and whether anyone can
# say it is alive. Deliberately omits runConfigSnapshotJson, which is large and
# is not what a provenance reader wants.
#
# heartbeatExpected sits beside isStale on purpose. An unsupervised run always
# reports isStale false BY DESIGN, so a reader that sees only isStale reads that
# as a positive liveness claim it cannot back up. Together they distinguish
# "verified live" from "nobody knows".
fragment PlanRun on PlanRunObject {
  branch
  bullmqJobId
  cancelRequestedAt
  createdAt
  executionBackend
  heartbeatExpected
  id
  isStale
  lastHeartbeatAt
  model
  planId
  queueName
  runKind
  status
  updatedAt
}
