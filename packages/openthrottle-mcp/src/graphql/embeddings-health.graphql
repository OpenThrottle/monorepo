# MCP `health`: server health plus the embeddings section. Separate from the shared
# getServerHealth (Ralph's preflight), because `embeddings` hashes every source row.
fragment EmbeddingsHealth on EmbeddingsHealthObject {
  coverage {
    embedded
    entity
    stale
    table
    total
  }
  detail
  dims
  model
  provider
  queueDepth
  staleCount
  status
}

fragment ServerHealthWithEmbeddings on ServerHealthObject {
  api
  database
  embeddings {
    ...EmbeddingsHealth
  }
  redis
  websocket
}

query getServerHealthWithEmbeddings {
  serverHealth {
    ...ServerHealthWithEmbeddings
  }
}
