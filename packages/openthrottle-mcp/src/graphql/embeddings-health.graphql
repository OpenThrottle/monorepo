# MCP `health`: server health plus the embeddings and user-env-file sections. Separate from the shared
# getServerHealth (the plan-run preflight), because `embeddings` hashes every source row.
fragment EmbeddingsHealth on EmbeddingsHealthObject {
  coverage {
    embedded
    entity
    stale
    table
    total
  }
  detail
  dims
  model
  provider
  queueDepth
  staleCount
  status
}

fragment UserEnvFileHealth on UserEnvFileHealthObject {
  endpoint
  token
}

fragment ServerHealthWithEmbeddings on ServerHealthObject {
  api
  database
  embeddings {
    ...EmbeddingsHealth
  }
  redis
  userEnvFile {
    ...UserEnvFileHealth
  }
  websocket
}

query getServerHealthWithEmbeddings {
  serverHealth {
    ...ServerHealthWithEmbeddings
  }
}
