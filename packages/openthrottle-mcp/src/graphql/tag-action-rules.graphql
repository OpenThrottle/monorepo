# MCP-only GraphQL documents: tag→action rule CRUD + the rule_applications
# apply-once ledger read. Rules are user-owned; v1 rule mutations require a
# user identity (a service-account token gets an explanatory error).
# See docs/monorepo/plan-task-tags-rules-design.md ("Rules engine").

query TagActionRules {
  tagActionRules {
    actionPayloadJson
    actionType
    createdAt
    enabled
    environment
    id
    projectId
    repositoryId
    status
    tagAll
    title
    updatedAt
    userId
  }
}

query RuleApplications($planId: ID!) {
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
    updatedAt
  }
}

query RuleApplicationsForRule($ruleId: ID!) {
  ruleApplicationsForRule(ruleId: $ruleId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
    updatedAt
  }
}

query PreviewTagActionRule(
  $environment: String
  $input: UpsertTagActionRuleInput!
) {
  previewTagActionRule(environment: $environment, input: $input) {
    cap
    environment
    evaluated
    matched {
      id
      repositoryId
      status
      title
    }
    matchedCount
    nonMatching {
      conditions {
        actual
        condition
        expected
        passed
      }
      failedOnlyOnEnvironment
      id
      missingTags
      repositoryId
      status
      title
    }
    specificity
    truncated
  }
}

mutation UpsertTagActionRule($input: UpsertTagActionRuleInput!) {
  upsertTagActionRule(input: $input) {
    actionPayloadJson
    actionType
    createdAt
    enabled
    environment
    id
    projectId
    repositoryId
    status
    tagAll
    title
    updatedAt
    userId
  }
}

mutation DeleteTagActionRule($input: DeleteTagActionRuleInput!) {
  deleteTagActionRule(input: $input)
}
