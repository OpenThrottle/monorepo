# MCP-only GraphQL documents: tag→action rule CRUD + the rule_applications
# apply-once ledger read. Rules are user-owned; v1 rule mutations require a
# user identity (a service-account token gets an explanatory error).
# See docs/monorepo/plan-task-tags-rules-design.md ("Rules engine").

query TagActionRules {
  tagActionRules {
    actionPayloadJson
    actionType
    createdAt
    enabled
    environment
    id
    projectId
    status
    tagAll
    title
    updatedAt
    userId
  }
}

query RuleApplications($planId: ID!) {
  ruleApplications(planId: $planId) {
    createdAt
    detailsJson
    id
    planId
    ruleId
    state
    taskId
    updatedAt
  }
}

mutation UpsertTagActionRule($input: UpsertTagActionRuleInput!) {
  upsertTagActionRule(input: $input) {
    actionPayloadJson
    actionType
    createdAt
    enabled
    environment
    id
    projectId
    status
    tagAll
    title
    updatedAt
    userId
  }
}

mutation DeleteTagActionRule($input: DeleteTagActionRuleInput!) {
  deleteTagActionRule(input: $input)
}
