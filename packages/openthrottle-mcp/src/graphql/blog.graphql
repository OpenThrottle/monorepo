# MCP-only GraphQL documents: draft-only blog authoring. Mirrors the
# blogAdmin* queries and the createBlogPost / updateBlogPost / setBlogPostTags
# mutations exposed by openthrottle-server. There is deliberately no publish,
# unpublish, archive or upsert document: those need blog:write and stay with a
# human in the developer app.

fragment BlogAuthor on BlogAuthorObject {
  avatarUrl
  bio
  displayName
  slug
}

fragment BlogTag on BlogTagObject {
  description
  name
  slug
}

fragment BlogPostAdminFields on BlogPostAdminObject {
  author {
    ...BlogAuthor
  }
  bodyMarkdown
  coverImageAlt
  coverImageUrl
  createdAt
  excerpt
  id
  lastEditedBy
  publishedAt
  seoDescription
  seoTitle
  slug
  state
  status
  tags {
    ...BlogTag
  }
  title
  updatedAt
}

fragment BlogPostAdminSummaryFields on BlogPostAdminObject {
  author {
    displayName
    slug
  }
  createdAt
  excerpt
  id
  lastEditedBy
  publishedAt
  slug
  state
  status
  tags {
    name
    slug
  }
  title
  updatedAt
}

fragment BlogAdminPostResult on BlogAdminPostResult {
  __typename
  ... on BlogPostAdminObject {
    ...BlogPostAdminFields
  }
  ... on BlogPostNotFoundError {
    message
  }
}

fragment CreateBlogPostResult on CreateBlogPostResult {
  __typename
  ... on BlogCoverAltRequiredError {
    message
  }
  ... on BlogPostAdminObject {
    ...BlogPostAdminFields
  }
  ... on BlogReferenceNotFoundError {
    entity
    key
    message
  }
  ... on BlogSlugConflictError {
    message
    slug
  }
}

fragment UpdateBlogPostResult on UpdateBlogPostResult {
  __typename
  ... on BlogCoverAltRequiredError {
    message
  }
  ... on BlogPostAdminObject {
    ...BlogPostAdminFields
  }
  ... on BlogPostNotFoundError {
    message
  }
  ... on BlogPostPublishPermissionRequiredError {
    message
  }
  ... on BlogPostStaleWriteError {
    currentUpdatedAt
    message
  }
  ... on BlogReferenceNotFoundError {
    entity
    key
    message
  }
  ... on BlogSlugConflictError {
    message
    slug
  }
}

fragment SetBlogPostTagsResult on SetBlogPostTagsResult {
  __typename
  ... on BlogPostAdminObject {
    ...BlogPostAdminFields
  }
  ... on BlogPostNotFoundError {
    message
  }
  ... on BlogPostPublishPermissionRequiredError {
    message
  }
  ... on BlogReferenceNotFoundError {
    entity
    key
    message
  }
}

query ListBlogPosts(
  $after: String
  $first: Int! = 10
  $search: String
  $state: [BlogPostState!]
) {
  blogAdminPosts(after: $after, first: $first, search: $search, state: $state) {
    endCursor
    hasNextPage
    items {
      ...BlogPostAdminSummaryFields
    }
  }
}

query GetBlogPost($id: ID, $slug: String) {
  blogAdminPost(id: $id, slug: $slug) {
    ...BlogAdminPostResult
  }
}

query ListBlogTags {
  blogAdminTags {
    ...BlogTag
  }
}

query ListBlogAuthors {
  blogAdminAuthors {
    ...BlogAuthor
  }
}

mutation CreateBlogPost($input: CreateBlogPostInput!) {
  createBlogPost(input: $input) {
    ...CreateBlogPostResult
  }
}

mutation UpdateBlogPost($input: UpdateBlogPostInput!) {
  updateBlogPost(input: $input) {
    ...UpdateBlogPostResult
  }
}

mutation SetBlogPostTags($input: SetBlogPostTagsInput!) {
  setBlogPostTags(input: $input) {
    ...SetBlogPostTagsResult
  }
}
