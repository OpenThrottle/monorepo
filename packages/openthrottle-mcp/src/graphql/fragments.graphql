fragment AgentConversation on AgentConversationObject {
  createdAt
  id
  metadataJson
  modelName
  modelProvider
  planId
  projectId
  status
  title
  updatedAt
  userId
}

fragment AgentConversationMessage on AgentConversationMessageObject {
  content
  conversationId
  createdAt
  id
  role
  routingConfidence
  routingModel
  routingReason
  routingTier
  sortOrder
  toolMetadataJson
}

fragment Note on NoteObject {
  author
  content
  createdAt
  id
  updatedAt
}

fragment Plan on PlanObject {
  assignee
  author
  category
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  status
  summary
  title
  updatedAt
}

fragment CommitLink on CommitLinkObject {
  createdAt
  id
  message
  planId
  repo
  sha
  taskId
}

fragment Task on TaskObject {
  assignee
  category
  createdAt
  description
  id
  planId
  project
  projectId
  requirementsJson
  sortOrder
  status
  summary
  title
  updatedAt
}

fragment Project on ProjectObject {
  createdAt
  description
  id
  name
  nxProjectName
  updatedAt
}
