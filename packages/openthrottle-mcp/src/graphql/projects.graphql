# MCP-only GraphQL documents: project discovery (list/get) and editing (create/update).
# The shared Project fragment (fragments.graphql) selects scalars only; these documents
# add linked repositories and plan ids (counted client-side) so an agent can
# resolve "the CMS project" to an id. Selection sets are alphabetized.

fragment McpProjectSummary on ProjectObject {
  description
  id
  isFavorite
  name
  plans {
    id
  }
  repositories {
    id
    name
    normalizedRemoteUrl
  }
  updatedAt
}

query McpListProjects {
  projects {
    ...McpProjectSummary
  }
}

query McpGetProject($id: ID!) {
  project(id: $id) {
    createdAt
    ...McpProjectSummary
  }
}

mutation McpCreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    createdAt
    ...McpProjectSummary
  }
}

mutation McpUpdateProject($input: UpdateProjectInput!) {
  updateProject(input: $input) {
    createdAt
    ...McpProjectSummary
  }
}
