# MCP-only GraphQL document: agent-CLI discovery, which is outside the
# plan/task I/O domain (mirrors model-discovery.graphql). Surfaces the agentic
# CLIs detected on the server host with their versions and per-driver models.
# `auth` (claude only) reports the account, plan and active credential from
# `claude auth status`, including the API-key-overrides-subscription warning. `authState` is the generic
# login state (claude, cursor probed) and `capabilities` the behavioral
# capabilities of the backend's chat path.

fragment AgentCliAuthStatus on AgentCliAuthStatusObject {
  accountEmail
  activeCredential
  apiKeyOverridesSubscription
  authMethod
  loggedIn
  organizationName
  subscriptionType
  warning
}

fragment AgentCliOption on AgentCliOptionObject {
  auth {
    ...AgentCliAuthStatus
  }
  authState {
    detail
    status
  }
  backend
  capabilities {
    approvals
    editApprovals
    imageInput
    mcpInjection
    replaysFullHistory
    resume
    steering
  }
  chatCapable
  label
  models
  version
}

query discoverAgentClis {
  discoverAgentClis {
    agents {
      ...AgentCliOption
    }
    scannedAt
    totalCount
  }
}
