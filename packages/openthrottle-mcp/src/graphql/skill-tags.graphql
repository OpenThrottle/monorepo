# MCP-only GraphQL documents: per-user skill-tag vocabulary CRUD. Mirrors the
# skillTagVocabulary query and add/rename/remove mutations exposed by openthrottle-server.
# See docs/monorepo/skill-availability-design.md ("Tags").

query SkillTagVocabulary {
  skillTagVocabulary {
    tags {
      createdAt
      id
      tag
      updatedAt
      userId
    }
    totalCount
  }
}

mutation AddSkillTag($input: AddSkillTagInput!) {
  addSkillTag(input: $input) {
    createdAt
    id
    tag
    updatedAt
    userId
  }
}

mutation RenameSkillTag($input: RenameSkillTagInput!) {
  renameSkillTag(input: $input) {
    createdAt
    id
    tag
    updatedAt
    userId
  }
}

mutation RemoveSkillTag($input: RemoveSkillTagInput!) {
  removeSkillTag(input: $input)
}
