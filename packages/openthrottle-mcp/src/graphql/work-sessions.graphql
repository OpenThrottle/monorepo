mutation startWorkSession($input: StartWorkSessionInput!) {
  startWorkSession(input: $input) {
    id
    onBehalfOfUserId
    onBehalfOfVerified
    toolName
  }
}

mutation recordWorkArtifact($input: RecordWorkArtifactInput!) {
  recordWorkArtifact(input: $input) {
    externalKey
    id
    lifecycle
    sessionId
    type
    verification
  }
}

mutation attachWorkSessionSubject($input: AttachWorkSessionSubjectInput!) {
  attachWorkSessionSubject(input: $input) {
    id
    planId
    sessionId
    taskId
  }
}

mutation endWorkSession($input: EndWorkSessionInput!) {
  endWorkSession(input: $input) {
    closedBy
    endedAt
    id
  }
}
