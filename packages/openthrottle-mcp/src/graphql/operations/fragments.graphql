fragment Note on NoteObject {
  author
  content
  createdAt
  id
  updatedAt
}

# Every plan-shaped operation spreads this fragment, so a field missing here is a
# field missing from every MCP plan tool result. A new PlanObject scalar must be
# selected here or consciously excluded in ../__tests__/fragment-coverage.test.ts,
# which fails otherwise.
fragment Plan on PlanObject {
  assignee
  author
  category
  completedAt
  createdAt
  description
  id
  jobRunHooksJson
  project
  projectId
  projectSortOrder
  repositoryId
  runConfigJson
  status
  summary
  title
  updatedAt
}

# The plan plus its tags: what getPlan returns.
fragment PlanWithTags on PlanObject {
  ...Plan
  tags {
    dimension
    source
    tag
  }
}

# Spread by every task-shaped operation, with the same reach as the Plan
# fragment above. Coverage of both is enforced by
# ../__tests__/fragment-coverage.test.ts.
fragment Task on TaskObject {
  assignee
  category
  completedAt
  createdAt
  description
  hookRole
  hookScope
  hookSource
  id
  parentTaskId
  planId
  project
  projectId
  requirementsJson
  skillSlug
  sortOrder
  status
  summary
  title
  updatedAt
  wave
}

# The run-provenance projection: what a run was, on what, and whether anyone can
# say it is alive. Deliberately omits runConfigSnapshotJson, which is large and
# is not what a provenance reader wants.
#
# heartbeatExpected sits beside isStale on purpose. An unsupervised run always
# reports isStale false BY DESIGN, so a reader that sees only isStale reads that
# as a positive liveness claim it cannot back up. Together they distinguish
# "verified live" from "nobody knows".
fragment PlanRun on PlanRunObject {
  branch
  bullmqJobId
  cancelRequestedAt
  createdAt
  driver
  heartbeatExpected
  id
  isStale
  lastHeartbeatAt
  model
  planId
  queueName
  resumeOfRunId
  runKind
  settledReason
  status
  updatedAt
  usageLimitResetsAt
  usageLimitType
}

# A plan run plus the host fields the register/settle mutations return.
fragment DetachedPlanRun on PlanRunObject {
  hostname
  pid
  ...PlanRun
  workerId
}

# A plan run plus the worktree it ran in: what get_plan_runs and the worktree
# checkout registration return.
fragment PlanRunWithCheckout on PlanRunObject {
  checkout {
    displayName
    filesystemPath
    kind
  }
  ...PlanRun
}

fragment PlanOutputStreamChunk on PlanOutputStreamChunkObject {
  content
  createdAt
  id
  iteration
  planId
  taskId
}

fragment PromoteTaskToPlanResult on PromoteTaskToPlanResultObject {
  error
  jobId
  success
}

fragment ActivityByDate on ActivityByDateResultObject {
  commits {
    createdAt
    id
    message
    planId
    planTitle
    repo
    sha
    taskId
    taskTitle
  }
  hasNext
  outputChunks {
    content
    createdAt
    id
    iteration
    planId
    planTitle
    taskId
  }
  tasksUpdated {
    id
    planId
    planTitle
    status
    title
    updatedAt
  }
  totalCount
}

fragment LastActivity on LastActivityResultObject {
  at
  commit {
    message
    repo
    sha
  }
  kind
  outputChunk {
    content
    iteration
    taskId
  }
  planId
  summary
  taskId
  taskUpdate {
    status
    taskId
    taskTitle
  }
}

fragment SearchChunk on SearchChunk {
  content
  fusedScore
  id
  planId
  planTitle
  similarity
  source
  sourcePath
  sourceRepo
  sourceSha
  taskId
  taskTitle
}

fragment ListPlanSource on ListPlanSourceObject {
  id
  title
}

fragment ListSourceInfo on ListSourceInfoObject {
  description
  name
}
