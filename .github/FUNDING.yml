# GitHub Sponsors button for this repository.
# Docs: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# The sponsee is the OpenThrottle ORG, not an individual. Verified against the API:
# organization(OpenThrottle).hasSponsorsListing is true with a public listing, while
# user(visormatt).hasSponsorsListing is false. A key pointing at an unenrolled account
# renders no button AND no error, so this must stay pointed at the org.
#
# Two copies, kept in step:
#
#   - This file, for this repository.
#   - OpenThrottle/.github at .github/FUNDING.yml, the org-wide default. It covers the
#     public mirror OpenThrottle/OpenThrottle (a filtered export with no .github/ of its
#     own) and every other org repo without a FUNDING.yml. Change one, change the other.
#
# Tier names, amounts and copy live in the org Sponsors dashboard, not here. They must
# match FUNDING.md § Tiers, which every tier links to.

github: OpenThrottle
custom: https://github.com/OpenThrottle/monorepo/blob/main/FUNDING.md
