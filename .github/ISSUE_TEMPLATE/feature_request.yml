name: Feature Request
description: Suggest a capability or improvement for OpenThrottle.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The roadmap and existing plans may already cover this — it's worth a quick scan of open issues first. Tell us the problem before the solution; that's what makes a request easy to act on. See [CONTRIBUTING.md](https://github.com/OpenThrottle/monorepo/blob/main/CONTRIBUTING.md) if you'd like to build it yourself.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What were you doing, and where did you get stuck? Describe the situation, not the fix.
      placeholder: |
        I run several plans a day and can't tell which ones are still in flight
        without opening each one, so I keep re-checking plans that already finished.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would you like to happen?
      description: How would you know this was solved?
      placeholder: |
        The plans list would show run state inline, so a glance is enough.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in the workspace does this belong? Pick "Not sure" if you'd rather we route it.
      multiple: false
      options:
        - openthrottle-server
        - openthrottle-developer
        - openthrottle-admin
        - openthrottle-website
        - openthrottle-email
        - packages / shared libraries
        - CLI / agentic tooling
        - Database / migrations
        - Build, Nx or CI
        - Not sure
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Alternatives you considered, prior art in other tools, links, or mockups.
    validations:
      required: false
