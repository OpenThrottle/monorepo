################################################################################
#
#   Build and optionally push a Docker image for an Nx app: docker build with
#   GITHUB_TOKEN and APP_VERSION (from applications/<app>/package.json), tag
#   as <registry>/<app>:<tag>, optional docker push.
#
#   Location: .github/actions/docker-build-push
#
#     - https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
#
################################################################################

name: '🐳 Docker build and push (Nx app)'
description: >-
  Builds a Docker image for a given Nx app name: APP_VERSION is read from
  applications/<app>/package.json; dockerfile-path defaults to
  applications/<app>/Dockerfile when omitted. Optionally pushes when push is true.

inputs:
  app:
    description: >-
      Nx application project name (e.g. openthrottle-server). Used for the
      image name segment and for applications/<app>/package.json (APP_VERSION).
    required: true
  dockerfile-path:
    default: ''
    description: >-
      Path to the Dockerfile relative to the repository root (build context is
      the repo root). If omitted or empty, uses applications/<app>/Dockerfile.
    required: false
  github-token:
    description: >-
      Token passed to docker as --build-arg GITHUB_TOKEN (e.g. secrets.GITHUB_TOKEN).
    required: true
  nx-key:
    default: ''
    description: >-
      Optional Nx Cloud key passed as --build-arg NX_KEY. Empty disables Nx Cloud
      caching during the image build (the build still succeeds).
    required: false
  nx-version:
    default: ''
    description: >-
      Nx CLI version passed as --build-arg NX_VERSION (e.g. from vars.NX_VERSION).
      The canonical root Dockerfiles run `pnpm dlx nx@${NX_VERSION}` during the
      build stage, so this is required for those Dockerfiles to build.
    required: false
  push:
    default: 'false'
    description: >-
      If true, run docker push after a successful build. Use string true/false
      (e.g. github.ref == 'refs/heads/main').
    required: false
  registry:
    description: >-
      Registry/repository prefix without trailing slash (e.g.
      us-west2-docker.pkg.dev/PROJECT_ID/openthrottle). Full image ref is
      <registry>/<app>:<tag>.
    required: true
  tag:
    description: 'Image tag (e.g. sha-${GITHUB_SHA}).'
    required: true

outputs:
  image:
    description: 'Full image reference: <registry>/<app>:<tag>.'
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        INPUT_APP: ${{ inputs.app }}
        INPUT_DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_NX_KEY: ${{ inputs.nx-key }}
        INPUT_NX_VERSION: ${{ inputs.nx-version }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_TAG: ${{ inputs.tag }}
      run: bash "${{ github.action_path }}/docker-build-push.sh"
