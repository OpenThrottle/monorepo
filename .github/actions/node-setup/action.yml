################################################################################
#
#   This "action" breaks out the common steps for installing PNPM and caching
#   node modules.
#
#     - https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
#
#   ⚠️ Why caching `.nx/cache` alone stopped working under Nx 24 (OT plan
#   5656aac1). Two things have to cross machines for a cross-job Nx hit, and
#   from Nx 24 neither did:
#
#     1. The task outputs. Nx 24 writes them to a per-user shared root,
#        `~/.nx/<workspace-id>/cache`, whenever the workspace has a git
#        identity and `~/.nx` is writable, which is always true on a runner.
#        `<repo>/.nx/cache` was never written again. We kept saving and
#        restoring it anyway: a 216 MB, 2.8 GB-on-disk fossil, ~13 s per job.
#     2. The cache index. A hit also needs a row in Nx's SQLite DB, which
#        lives in the workspace-data dir as `<machine-id>-v<N>.db`. Outputs
#        without that DB are never read.
#
#   So this action pins both dirs inside the checkout (📌, before anything runs
#   Nx), caches the outputs AND the DB, and checks Nx agrees (🛡️). GitHub's
#   hosted VMs share one machine-id per runner image (probe run 44245027995),
#   so a restored DB opens as-is. An image bump can change it, and 🪪 then
#   renames the restored DB to this VM's id. Without the rename Nx would
#   silently start an empty DB and every task would miss.
#
################################################################################

name: '🤖 Node Setup'
description: 'Setup NodeJS and PNPM.'

inputs:
  # Discriminator appended to the EXACT Nx cache key. Required whenever two jobs
  # can run this action concurrently at the same commit — a matrix, or two jobs in
  # the same workflow. Without it they race one key: actions/cache keeps whichever
  # save lands first and DROPS the rest, so every task hash the losing jobs
  # computed is thrown away and their next run recomputes from cold.
  #
  # Optional, and empty by default, so single-job callers need no change and keep
  # their existing key shape.
  cache-suffix:
    description: 'Discriminator for the exact Nx cache key (e.g. a matrix shard index). Set this when several jobs run at the same commit; leave unset for single-job callers.'
    required: false
    default: ''

  # Restore-only by DEFAULT. 'false' restores both caches (pnpm store and Nx)
  # but never SAVES them; 'true' also saves. Opt in only from a job whose save a
  # later run actually restores: today that is continuous-integration.yml's
  # `build` shards and `gates` (outside the merge queue) and `warm-cache` (the
  # entry on `main` every PR restores from). Nothing else opts in.
  #
  # Why the default flipped (OT plan 820b4838). Every save writes a ~215 MB Nx
  # entry, plus the ~336 MB pnpm store on a lockfile change, and the repo has a
  # 10 GB cache quota whose LRU evicts the `main` entries PRs read. With 'true'
  # as the default, any new caller saved silently: merge-queue entries (a
  # unique `gh-readonly-queue/*` ref nothing can restore from, ~1.4 GB each,
  # OT plan 80b62f5e), then side jobs on every main push duplicating
  # `warm-cache`'s entry (model-facing-text, database-seeds, OpenThrottle
  # Docker, Publish hook plugins; OT plan 1d2f247c). Opt-in makes a new save a
  # visible decision in review.
  save-cache:
    description: "'false' (default) only restores the pnpm store and Nx caches; 'true' restores and saves them. Pass 'true' only from a job whose save a later run restores (CI build shards and gates outside the merge queue, warm-cache)."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # 📌 Pin Nx's two data dirs inside the checkout, for every later step of
    # the job. Without either variable Nx 24 relocates both to ~/.nx (see the
    # header), where nothing below saves them. Setting either one also turns
    # off Nx's shared-root logic entirely, so the two always move together.
    # Must run before anything invokes Nx, `pnpm install` included.
    #
    # 💰 NX_MAX_CACHE_SIZE bounds the cache now that it carries over and
    # grows. Each job restores the newest entry, adds its outputs and saves
    # the lot, so without a cap it only grows. Nx's default cap is 10% of the
    # disk (~14 GB on a hosted runner), which alone would overrun the repo's
    # 10 GB Actions quota. 3 GB on disk is roughly the fossil's size (2.8 GB,
    # ~216 MB compressed), so a saved entry stays about as large as today's.
    # Past the cap, Nx deletes the oldest outputs.
    - name: '📌 Pin the Nx cache and workspace-data dirs'
      run: |
        {
          echo "NX_CACHE_DIRECTORY=${GITHUB_WORKSPACE}/.nx/cache"
          echo "NX_WORKSPACE_DATA_DIRECTORY=${GITHUB_WORKSPACE}/.nx/workspace-data"
          echo "NX_MAX_CACHE_SIZE=3GB"
        } >> "$GITHUB_ENV"
      shell: bash

    # Node first, from .nvmrc. Node 25+ no longer bundles Corepack, so the next
    # step installs a pinned copy before enabling it.
    - name: '⚙️ Setup NodeJS'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'

    # Bare `prepare` activates the root package.json "packageManager" version
    # (sha512-verified); `prepare pnpm` would take npm's `latest` tag instead.
    # Keep COREPACK_VERSION in step with Dockerfile.NestJS, Dockerfile.ReactRouter
    # and scripts/setup.sh.
    - name: '📦 Enable PNPM (Corepack)'
      env:
        COREPACK_VERSION: '0.36.0'
      run: |
        npm install --global --no-audit --no-fund "corepack@${COREPACK_VERSION}"
        corepack enable
        corepack prepare --activate
      shell: bash

    # Cache the pnpm content-addressable store (NOT node_modules). pnpm's isolated
    # linker keeps each workspace package's symlink tree under <pkg>/node_modules,
    # which a root-only `path: node_modules` cache never captures — so a cache hit
    # used to leave newly added per-package deps unlinked. Caching the store and
    # always running install relinks every package's node_modules from the warm
    # store (fast) and stays correct. Requires pnpm on PATH (Corepack above).
    # Each lockfile change saves a new entry on `main`; cache-cleanup.yml's
    # `prune-pnpm-store` deletes the superseded ones.
    - name: '⚙️ Setup pnpm store cache'
      if: inputs.save-cache == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: '.nvmrc'

    # Restore-only twin of the step above (see `save-cache`). The key mirrors
    # setup-node's own `node-cache-<os>-<arch>-pnpm-<lockfile hash>` so it hits
    # the entries that step writes on `main`. A miss only costs a cold
    # `pnpm install`, never correctness.
    - name: '📁 Locate the pnpm store'
      if: inputs.save-cache != 'true'
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: '⚙️ Restore pnpm store cache (no save)'
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        path: ${{ steps.pnpm-store.outputs.path }}
        restore-keys: |
          node-cache-${{ runner.os }}-x64-pnpm-

    # pnpm ≥11 no longer expands ${GITHUB_TOKEN} from the committed .npmrc, so
    # write the GitHub Packages credential to the trusted user-level config first.
    - name: '🔐 Authenticate GitHub Packages'
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "${GITHUB_TOKEN}"
      shell: bash

    - name: '📦 Install packages'
      run: pnpm install --frozen-lockfile
      shell: bash

    # The Nx cache. This is the ONLY Nx cache layer — there is no paid remote
    # backend (see docs/monorepo/NX.md). GitHub Actions cache is free and its
    # scoping gives the CREEP-safe model for nothing: a PR branch RESTORES from
    # its base branch's caches but can never SAVE into them, and branch caches
    # are isolated from one another.
    #
    # The key is suffixed with the commit SHA on purpose. `actions/cache` skips
    # the save step entirely on an exact key hit, so a key of just
    # hashFiles(nx.json, pnpm-lock.yaml) is written ONCE and then never refreshed
    # until one of those files changes — every task hash computed after that
    # first save is discarded. A per-commit key always saves; the tiered
    # restore-keys below still restore the newest compatible cache (GitHub
    # returns the most recent prefix match), so warm hits are preserved.
    #
    # ⚠️ The SHA alone is NOT unique enough once a caller fans out. Every leg of a
    # matrix shares one commit, so all of them compute the same exact key and race
    # the save; the first upload wins and the others are discarded as duplicates,
    # losing their task hashes entirely. `cache-suffix` (empty by default)
    # disambiguates the exact key per concurrent job. It is appended AFTER the SHA
    # so both restore-keys below stay prefix-compatible — a shard still warms from
    # any earlier cache at this hash, including ones written before this input
    # existed and ones written by a sibling shard.
    #
    # Restore order is deliberately recency-first, NOT same-suffix-first. A
    # shard's chunk is re-partitioned every run, so "the last shard-2 cache"
    # holds no more of this shard's work than any other entry, and on `main` the
    # freshest entry is now `warm-cache`'s (a queue-validated push runs no
    # shards). Preferring the suffix would skip it for an older shard entry.
    #
    # Two paths, one entry: the outputs and the DB that indexes them (header).
    # Only the DB files (`<machine-id>-v<N>.db` and its -wal/-shm) are cached
    # from workspace-data, not the project-graph files beside them, which Nx
    # rebuilds every run anyway. The glob carries no schema version, so an Nx
    # bump to `-v7.db` is still saved. actions/cache versions an entry by its
    # path list, so entries saved before the DB was added never restore here.
    - name: '💾 Cache Nx local cache'
      if: inputs.save-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: nx-cache
      with:
        key: cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) || '' }}
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        restore-keys: |
          cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
          cache-nx-${{ runner.os }}-

    # - name: '🔍 Setup Supabase CLI'
    #   uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
    #   with:
    #     version: latest

    - name: '💾 Restore Nx local cache (no save)'
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) || '' }}
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        restore-keys: |
          cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
          cache-nx-${{ runner.os }}-

    # 🪪 A restored DB is only opened when its file name matches THIS VM's
    # machine-id; otherwise Nx silently creates an empty one beside it and every
    # task misses. Hosted VMs of one runner image share an id, so this is
    # normally a no-op. An image bump changes the id, and then the restored DB
    # is renamed to this VM's. The id source matches Nx's own (the machine-uid
    # crate): /var/lib/dbus/machine-id, else /etc/machine-id.
    - name: '🪪 Re-key the restored Nx DB to this machine-id'
      shell: bash
      run: |
        set -uo pipefail
        shopt -s nullglob
        dir="$NX_WORKSPACE_DATA_DIRECTORY"
        dbs=("$dir"/*-v[0-9]*.db)
        if [ "${#dbs[@]}" -eq 0 ]; then
          echo "No restored Nx DB in $dir: this job starts with a cold Nx cache."
          exit 0
        fi
        mid="$(cat /var/lib/dbus/machine-id 2>/dev/null || cat /etc/machine-id 2>/dev/null || true)"
        if [ -z "$mid" ]; then
          echo "::warning::No machine-id on this runner, so the restored Nx DB cannot be re-keyed and may be ignored."
          exit 0
        fi
        for db in "${dbs[@]}"; do
          base="$(basename "$db")"
          id="${base%%-v*}"
          rest="${base#"$id"-}"
          if [ "$id" = "$mid" ]; then
            echo "Restored Nx DB $base already matches this machine-id."
            continue
          fi
          if [ -e "$dir/$mid-$rest" ]; then
            echo "::warning::Both $base and $mid-$rest exist; leaving them as they are."
            continue
          fi
          echo "Re-keying restored Nx DB $base -> $mid-$rest"
          for f in "$db" "$db-wal" "$db-shm"; do
            if [ -e "$f" ]; then
              mv "$f" "$dir/$mid-${rest}${f#"$db"}"
            fi
          done
        done

    # 🛡️ Fail loudly if Nx no longer resolves its dirs to the paths saved
    # above. This is the check that would have caught Nx 24's relocation: an
    # Nx upgrade that moves them again, or stops honoring the variables, would
    # otherwise fossilize the cache silently a second time. The require path is
    # an Nx internal; if it moves, this step fails too, which is the point.
    - name: '🛡️ Check Nx resolves the cache dirs we save'
      shell: bash
      run: |
        node - <<'NODE'
        const path = require('node:path');
        let dirs;
        try {
          dirs = require('nx/src/utils/cache-directory');
        } catch (error) {
          console.log(`::error::Cannot load nx/src/utils/cache-directory (${error.message}). Re-check where Nx keeps its cache before trusting the Actions cache.`);
          process.exit(1);
        }
        const checks = [
          ['cacheDir', dirs.cacheDir, process.env.NX_CACHE_DIRECTORY],
          ['workspaceDataDirectory', dirs.workspaceDataDirectory, process.env.NX_WORKSPACE_DATA_DIRECTORY],
        ];
        let failed = false;
        for (const [name, actual, expected] of checks) {
          if (!expected || path.resolve(actual ?? '') !== path.resolve(expected)) {
            console.log(`::error::Nx ${name} resolves to '${actual}', but node-setup caches '${expected}'. The Actions cache would carry nothing Nx reads; see the header of .github/actions/node-setup/action.yml.`);
            failed = true;
          } else {
            console.log(`Nx ${name}: ${actual}`);
          }
        }
        process.exit(failed ? 1 : 0);
        NODE
