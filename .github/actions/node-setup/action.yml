################################################################################
#
#   This "action" breaks out the common steps for installing PNPM and caching
#   node modules.
#
#     - https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
#
################################################################################

name: '🤖 Node Setup'
description: 'Setup NodeJS and PNPM.'

runs:
  using: 'composite'
  steps:
    # Node first so Corepack matches .nvmrc (Corepack ships with Node ≥16.13).
    - name: '⚙️ Setup NodeJS'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'

    # Parity with root package.json "packageManager"; avoids npm i -g pnpm.
    - name: '📦 Enable PNPM (Corepack)'
      run: |
        corepack enable
        corepack prepare pnpm --activate
      shell: bash

    # Cache the pnpm content-addressable store (NOT node_modules). pnpm's isolated
    # linker keeps each workspace package's symlink tree under <pkg>/node_modules,
    # which a root-only `path: node_modules` cache never captures — so a cache hit
    # used to leave newly added per-package deps unlinked. Caching the store and
    # always running install relinks every package's node_modules from the warm
    # store (fast) and stays correct. Requires pnpm on PATH (Corepack above).
    - name: '⚙️ Setup pnpm store cache'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: '.nvmrc'

    # pnpm 11 no longer expands ${GITHUB_TOKEN} from the committed .npmrc, so
    # write the GitHub Packages credential to the trusted user-level config first.
    - name: '🔐 Authenticate GitHub Packages'
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "${GITHUB_TOKEN}"
      shell: bash

    - name: '📦 Install packages'
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: '💾 Cache Nx local cache'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: nx-cache
      with:
        key: cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}
        path: .nx/cache
        restore-keys: |
          cache-nx-${{ runner.os }}-

    # - name: '🔍 Setup Supabase CLI'
    #   uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
    #   with:
    #     version: latest
