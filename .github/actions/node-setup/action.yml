################################################################################
#
#   This "action" breaks out the common steps for installing PNPM and caching
#   node modules.
#
#     - https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
#
################################################################################

name: '🤖 Node Setup'
description: 'Setup NodeJS and PNPM.'

inputs:
  # Discriminator appended to the EXACT Nx cache key. Required whenever two jobs
  # can run this action concurrently at the same commit — a matrix, or two jobs in
  # the same workflow. Without it they race one key: actions/cache keeps whichever
  # save lands first and DROPS the rest, so every task hash the losing jobs
  # computed is thrown away and their next run recomputes from cold.
  #
  # Optional, and empty by default, so single-job callers need no change and keep
  # their existing key shape.
  cache-suffix:
    description: 'Discriminator for the exact Nx cache key (e.g. a matrix shard index). Set this when several jobs run at the same commit; leave unset for single-job callers.'
    required: false
    default: ''

  # 'false' restores both caches (pnpm store and Nx) but never SAVES them. For
  # merge-queue entries: each runs on a unique `gh-readonly-queue/main/pr-N-<sha>`
  # ref, and Actions caches are ref-scoped, so nothing later can ever restore
  # what a queue entry saves. Before this input every entry still wrote ~1.4 GB
  # (four ~215 MB Nx entries plus the ~336 MB pnpm store), which kept the repo
  # over its 10 GB cache quota and evicted the main entries PRs actually read
  # (OT plan 80b62f5e).
  save-cache:
    description: "'true' (default) restores and saves the pnpm store and Nx caches; 'false' only restores them. Pass 'false' where nothing could ever restore the save (merge-queue refs)."
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Node first so Corepack matches .nvmrc (Corepack ships with Node ≥16.13).
    - name: '⚙️ Setup NodeJS'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'

    # Bare `prepare` activates the root package.json "packageManager" version
    # (sha512-verified); `prepare pnpm` would take npm's `latest` tag instead.
    - name: '📦 Enable PNPM (Corepack)'
      run: |
        corepack enable
        corepack prepare --activate
      shell: bash

    # Cache the pnpm content-addressable store (NOT node_modules). pnpm's isolated
    # linker keeps each workspace package's symlink tree under <pkg>/node_modules,
    # which a root-only `path: node_modules` cache never captures — so a cache hit
    # used to leave newly added per-package deps unlinked. Caching the store and
    # always running install relinks every package's node_modules from the warm
    # store (fast) and stays correct. Requires pnpm on PATH (Corepack above).
    - name: '⚙️ Setup pnpm store cache'
      if: inputs.save-cache == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: '.nvmrc'

    # Restore-only twin of the step above (see `save-cache`). The key mirrors
    # setup-node's own `node-cache-<os>-<arch>-pnpm-<lockfile hash>` so it hits
    # the entries that step writes on `main`. A miss only costs a cold
    # `pnpm install`, never correctness.
    - name: '📁 Locate the pnpm store'
      if: inputs.save-cache != 'true'
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: '⚙️ Restore pnpm store cache (no save)'
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        path: ${{ steps.pnpm-store.outputs.path }}
        restore-keys: |
          node-cache-${{ runner.os }}-x64-pnpm-

    # pnpm ≥11 no longer expands ${GITHUB_TOKEN} from the committed .npmrc, so
    # write the GitHub Packages credential to the trusted user-level config first.
    - name: '🔐 Authenticate GitHub Packages'
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "${GITHUB_TOKEN}"
      shell: bash

    - name: '📦 Install packages'
      run: pnpm install --frozen-lockfile
      shell: bash

    # The Nx cache. This is the ONLY Nx cache layer — there is no paid remote
    # backend (see docs/monorepo/NX.md). GitHub Actions cache is free and its
    # scoping gives the CREEP-safe model for nothing: a PR branch RESTORES from
    # its base branch's caches but can never SAVE into them, and branch caches
    # are isolated from one another.
    #
    # The key is suffixed with the commit SHA on purpose. `actions/cache` skips
    # the save step entirely on an exact key hit, so a key of just
    # hashFiles(nx.json, pnpm-lock.yaml) is written ONCE and then never refreshed
    # until one of those files changes — every task hash computed after that
    # first save is discarded. A per-commit key always saves; the tiered
    # restore-keys below still restore the newest compatible cache (GitHub
    # returns the most recent prefix match), so warm hits are preserved.
    #
    # ⚠️ The SHA alone is NOT unique enough once a caller fans out. Every leg of a
    # matrix shares one commit, so all of them compute the same exact key and race
    # the save; the first upload wins and the others are discarded as duplicates,
    # losing their task hashes entirely. `cache-suffix` (empty by default)
    # disambiguates the exact key per concurrent job. It is appended AFTER the SHA
    # so both restore-keys below stay prefix-compatible — a shard still warms from
    # any earlier cache at this hash, including ones written before this input
    # existed and ones written by a sibling shard.
    #
    # Restore order is deliberately recency-first, NOT same-suffix-first. A
    # shard's chunk is re-partitioned every run, so "the last shard-2 cache"
    # holds no more of this shard's work than any other entry, and on `main` the
    # freshest entry is now `warm-cache`'s (a queue-validated push runs no
    # shards). Preferring the suffix would skip it for an older shard entry.
    - name: '💾 Cache Nx local cache'
      if: inputs.save-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: nx-cache
      with:
        key: cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) || '' }}
        path: .nx/cache
        restore-keys: |
          cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
          cache-nx-${{ runner.os }}-

    # - name: '🔍 Setup Supabase CLI'
    #   uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
    #   with:
    #     version: latest

    - name: '💾 Restore Nx local cache (no save)'
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) || '' }}
        path: .nx/cache
        restore-keys: |
          cache-nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
          cache-nx-${{ runner.os }}-
