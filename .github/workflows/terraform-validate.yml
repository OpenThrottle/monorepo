################################################################################
#
#   Terraform static validation for the `infra/` project.
#
#   Runs on changes under infra/ (and to this workflow). Three gates:
#     1. `terraform fmt -check -recursive` — canonical formatting.
#     2. `terraform validate` — per-root config validation. Backends are
#        initialized with `-backend=false` so no GCS/Cloudflare credentials are
#        needed; this checks syntax, references, and provider schemas only.
#     3. tfsec — static security scanner over infra/ (misconfig detection).
#     4. Conftest — OpenThrottle-specific OPA/Rego security policies
#        (infra/tests/policy) that encode the exact audit findings (Cloud SQL
#        SSL mode, open authorized_networks, state-bucket versioning, uniform
#        bucket-level access) so a regression fails CI.
#
#   These gates catch the kinds of issues surfaced in the infra audit
#   (formatting drift, broken references, insecure defaults) automatically.
#
################################################################################
name: '🌍 Terraform Validate'
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'

concurrency:
  cancel-in-progress: true
  group: terraform-validate-${{ github.ref }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: '📦 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🌍 Setup Terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: '🎨 Terraform fmt'
        run: terraform fmt -check -recursive -diff infra/

      - name: '✅ Terraform validate (all roots)'
        run: |
          set -euo pipefail
          # Validate every directory that contains *.tf files. Each root is
          # initialized with -backend=false so no remote state credentials are
          # required for a pure config check.
          status=0
          while IFS= read -r dir; do
            echo "::group::validate ${dir}"
            if terraform -chdir="${dir}" init -backend=false -input=false -no-color \
              && terraform -chdir="${dir}" validate -no-color; then
              echo "ok: ${dir}"
            else
              echo "::error::terraform validate failed in ${dir}"
              status=1
            fi
            echo "::endgroup::"
          done < <(find infra -type f -name '*.tf' -exec dirname {} \; | sort -u)
          exit "${status}"

      - name: '🔒 tfsec (static security scan)'
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra
          soft_fail: false

      - name: '🐚 Install shellcheck'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y shellcheck
          shellcheck --version

      - name: '📜 Install Conftest'
        env:
          CONFTEST_VERSION: 0.68.2
          # SHA-256 of conftest_0.68.2_Linux_x86_64.tar.gz (from the release checksums.txt).
          CONFTEST_SHA256: 'e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347'
        run: |
          set -euo pipefail
          url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o conftest.tar.gz "${url}"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          rm -f conftest.tar.gz conftest
          conftest --version

      - name: '📜 Conftest policy unit tests'
        run: conftest verify --policy infra/tests/policy

      - name: '📜 Conftest security policies (Terraform roots + fixtures)'
        run: |
          conftest test --policy infra/tests/policy \
            infra/environments infra/modules infra/applications infra/tests/fixtures

      - name: '🤝 Provider contract (GCP <-> Hetzner interchangeability)'
        run: infra/tests/contract/check-provider-contract.sh

      - name: '🐚 Shellcheck the rendered cloud-init template'
        run: |
          set -euo pipefail
          # shellcheck cannot lint a .tpl directly (it is Terraform syntax), so
          # the template is RENDERED first and the output checked. Rendering is
          # the only way to catch escaping bugs: `$$(` is NOT a Terraform escape
          # (only `$${` and `%%{` are), so it renders as a literal `$$` that bash
          # reads as the PID — valid template, broken script.
          repo="$(pwd)"
          scratch="$(mktemp -d)"

          # __REPO__ is substituted below: `path.cwd` would resolve to the
          # -chdir target, not this repository.
          cat > "${scratch}/main.tf" <<'RENDEREOF'
          locals {
            tpl = "__REPO__/infra/applications/openthrottle_hcloud/templates/startup.sh.tpl"

            vars = {
              api_domain             = "api.example.com"
              backup_remote          = "remote:bucket"
              backup_retention_count = "14"
              backup_script          = file("__REPO__/databases/backup-offsite.sh")
              caddyfile_content      = "example.com {}"
              compose_content        = "services: {}"
              developer_domain       = "dev.example.com"
              ghcr_token             = ""
              ghcr_username          = ""
              jwt_secret             = ""
              postgres_data_dir      = "/mnt/openthrottle-data/postgres"
              postgres_db            = "openthrottle"
              postgres_host          = "postgres"
              postgres_password      = ""
              postgres_port          = "5432"
              postgres_user          = "openthrottle"
              redis_host             = "redis"
              redis_port             = "6379"
            }
          }

          # Both branches of the data-volume conditional: they are different
          # scripts as far as shellcheck is concerned.
          resource "local_file" "with_volume" {
            content  = templatefile(local.tpl, merge(local.vars, { data_volume_device = "/dev/disk/by-id/scsi-0HC_Volume_1" }))
            filename = "rendered-with-volume.sh"
          }

          resource "local_file" "without_volume" {
            content  = templatefile(local.tpl, merge(local.vars, { data_volume_device = "" }))
            filename = "rendered-without-volume.sh"
          }
          RENDEREOF

          # Portable in-place edit: GNU sed takes `-i expr`, BSD/macOS sed
          # requires `-i ''`, so neither form works everywhere. Write and move
          # instead, so this gate is runnable locally as well as in CI.
          sed "s|__REPO__|${repo}|g" "${scratch}/main.tf" > "${scratch}/main.tf.tmp"
          mv "${scratch}/main.tf.tmp" "${scratch}/main.tf"

          terraform -chdir="${scratch}" init -backend=false -input=false -no-color
          terraform -chdir="${scratch}" apply -auto-approve -no-color

          for name in rendered-with-volume.sh rendered-without-volume.sh; do
            echo "::group::shellcheck ${name}"
            bash -n "${scratch}/${name}"
            shellcheck --shell=bash "${scratch}/${name}"
            echo "::endgroup::"
          done

          # The standalone scripts are plain bash and check directly.
          shellcheck --shell=bash \
            databases/backup-offsite.sh \
            databases/verify-restore.sh \
            infra/tests/contract/check-provider-contract.sh \
            infra/tests/exposure/verify-exposure.sh
