################################################################################
#
#   Terraform static validation for the `infra/` project.
#
#   Runs on changes under infra/ (and to this workflow). Three gates:
#     1. `terraform fmt -check -recursive` — canonical formatting.
#     2. `terraform validate` — per-root config validation. Backends are
#        initialized with `-backend=false` so no GCS/Cloudflare credentials are
#        needed; this checks syntax, references, and provider schemas only.
#     3. tfsec — static security scanner over infra/ (misconfig detection).
#
#   These gates catch the kinds of issues surfaced in the infra audit
#   (formatting drift, broken references, insecure defaults) automatically.
#
################################################################################
name: '🌍 Terraform Validate'
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'

concurrency:
  cancel-in-progress: true
  group: terraform-validate-${{ github.ref }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: '📦 Checkout'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: '🌍 Setup Terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: '🎨 Terraform fmt'
        run: terraform fmt -check -recursive -diff infra/

      - name: '✅ Terraform validate (all roots)'
        run: |
          set -euo pipefail
          # Validate every directory that contains *.tf files. Each root is
          # initialized with -backend=false so no remote state credentials are
          # required for a pure config check.
          status=0
          while IFS= read -r dir; do
            echo "::group::validate ${dir}"
            if terraform -chdir="${dir}" init -backend=false -input=false -no-color \
              && terraform -chdir="${dir}" validate -no-color; then
              echo "ok: ${dir}"
            else
              echo "::error::terraform validate failed in ${dir}"
              status=1
            fi
            echo "::endgroup::"
          done < <(find infra -type f -name '*.tf' -exec dirname {} \; | sort -u)
          exit "${status}"

      - name: '🔒 tfsec (static security scan)'
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra
          soft_fail: false
