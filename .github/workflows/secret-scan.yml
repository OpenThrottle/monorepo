################################################################################
#
#   Secret scanning gate (gitleaks) — keeps credentials out of the repo.
#
#   Added as part of the pre-public hardening audit (OT plan dc915a1a). A
#   one-time full-history scan confirmed the tree + history are clean; this
#   workflow makes that durable:
#
#     - Pull requests: scan ONLY the commits the PR introduces
#       (base..head), so a newly-added secret fails the check before merge.
#     - Push to main / manual dispatch: scan the FULL git history, the same
#       gate used for the pre-flip audit.
#
#   gitleaks is installed from a pinned release tarball with a SHA-256
#   checksum (same hardening pattern as the Conftest step in
#   terraform-validate.yml) rather than the gitleaks-action, which requires a
#   GITLEAKS_LICENSE secret for organization repos. Tuning for known
#   false positives (Terraform template vars, lockfile hashes, env templates)
#   lives in the committed .gitleaks.toml at the repo root.
#
################################################################################
name: '🔑 Secret Scan'
on:
  pull_request:
    # No paths-ignore: secrets can hide in docs/markdown too, so scan everything.
    types: [opened, ready_for_review, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: secret-scan-${{ github.ref }}

permissions:
  contents: read

jobs:
  gitleaks:
    # Match the CI convention: drafts push freely, the scan fires when ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release checksums.txt).
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so PR-range and full-history scans both have the commits.
          fetch-depth: 0

      - name: '🔑 Install gitleaks'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      - name: '🕵️ Scan for secrets'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Scan only the commits this PR adds. --no-merges avoids re-scanning
            # already-merged history reachable through the merge base.
            echo "Scanning PR range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            gitleaks git . \
              --config .gitleaks.toml \
              --gitleaks-ignore-path .gitleaksignore \
              --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --no-banner \
              --redact \
              --verbose
          else
            # push to main / manual dispatch: full-history gate.
            echo "Scanning full git history"
            gitleaks git . \
              --config .gitleaks.toml \
              --gitleaks-ignore-path .gitleaksignore \
              --no-banner \
              --redact \
              --verbose
          fi
