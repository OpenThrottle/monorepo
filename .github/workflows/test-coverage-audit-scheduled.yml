################################################################################
#
#   Test-coverage burn-down report (report-only).
#
#   The GATE is `audit:test-coverage:strict`, in the blocking `audit:strict`
#   aggregate of Continuous Integration's `gates` job: a new spec-less file
#   fails there against scripts/audit-test-coverage.allowlist.ts. This weekly
#   run only reports the remaining allowlisted gap and uploads the full JSON
#   inventory as an artifact so remediation plans can carve from a fresh
#   snapshot. The inventory is never committed: a committed copy drifted with
#   every rename (see docs/monorepo/test-coverage-audit.md).
#
#   Runs on `ubuntu-26.04` — free and unlimited on this PUBLIC repo. See
#   docs/monorepo/ci-cost.md before changing `runs-on` or adding a schedule.
#
#   Delete this workflow once the allowlist is empty: there is nothing left to
#   burn down. See docs/monorepo/test-coverage-audit.md.
#
################################################################################
name: '🧪 Scheduled Test-coverage Audit'

on:
  schedule:
    # Weekly, Mondays at 08:00 UTC — before the dependency-graph job at 09:00.
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  packages: read # node-setup authenticates the @openthrottle GitHub Packages registry

concurrency:
  cancel-in-progress: true
  group: test-coverage-audit-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_SWC: 'true'

jobs:
  test-coverage-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup

      # The audit walks the same fan-out the CI build does; a fresh checkout
      # lacks the gitignored skill symlinks until ot-skill-sync materializes them.
      - name: '🔗 Materialize agent-skill symlinks (ot-skill-sync)'
        run: bash skills/ot-skill-sync/scripts/sync.sh

      # Report-only, exactly as it was in Continuous Integration. `continue-on-error`
      # is retained deliberately: this must not start failing a run while the
      # baseline is still being burned down.
      - name: '🧪 Test-coverage audit (warn-only)'
        continue-on-error: true
        run: pnpm run audit:test-coverage

      - name: '🧾 Write the JSON inventory'
        continue-on-error: true
        run: pnpm run --silent audit:test-coverage:json > test-coverage-baseline.json

      - name: '📤 Upload the JSON inventory'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: warn
          name: test-coverage-baseline-${{ github.run_number }}
          path: test-coverage-baseline.json
          retention-days: 90 # Long enough to plan a remediation round from
