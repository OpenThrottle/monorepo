name: '🚀 NX Release'
on:
  # 💰 Cost-gated: manual-only for now. Kept as a live, runnable job (workflow_dispatch)
  # rather than `if: false` dead code so the nx.json release config stays exercisable
  # on demand and does not silently rot. Re-add pull_request/push triggers to automate.
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: nx-release - ${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_DRY_RUN: ${{ (github.head_ref == 'main' || github.ref_name == 'main') && '--verbose' || '--dry-run --verbose' }}
  RELEASE_PUBLISH: ${{ (github.head_ref == 'main' || github.ref_name == 'main') && '--yes' || '--skip-publish' }}

permissions:
  contents: write
  # id-token: write # required for provenance data generation
  packages: write # required for publishing packages

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 💰 Partial clone — `nx release` needs full history and tags for
          # versioning/changelog, which read commit metadata, not old blobs.
          fetch-depth: 0
          filter: 'blob:none'

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup

      - name: '🐙 Setup Git'
        run: |
          git config user.email "matthew.scholta@gmail.com"
          git config user.name "visormatt"

      - name: '🔍 Print Environment Info'
        run: pnpm nx report

      - name: '🚀 Release'
        run: pnpm nx release ${{ env.RELEASE_DRY_RUN }} ${{ env.RELEASE_PUBLISH }}
