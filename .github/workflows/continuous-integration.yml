################################################################################
#
#   This workflow handles our CI/CD for building and publishing packages.
#
#     - https://medium.com/emoteev-blog/10x-faster-ci-with-nx-and-github-actions-9a51fc4e82a6
#     - https://nx.dev/core-features/distribute-task-execution#running-things-in-parallel
#     - https://nx.dev/recipes/ci/monorepo-ci-github-actions#configuring-ci-using-github-actions-and-nx-
#
################################################################################
name: '🤖 Continuous Integration'
on:
  # workflow_dispatch enables the cost-gated nx-dependency-graph job to be run on demand
  # (it is gated to manual dispatch below) instead of being dead `if: false` code.
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    # ready_for_review: ensures CI fires when a draft PR is marked ready (see draft-skip `if`s below)
    types: [opened, ready_for_review, synchronize]
    # ⚠️ NO paths-ignore here — see the `changes` gate job below.
    # A workflow-level `paths-ignore` means a docs-only PR never TRIGGERS the
    # workflow at all, so `build` (or the `ci-success` gate) never reports a
    # status. Once that check is REQUIRED in branch protection, GitHub shows it
    # as "Expected — waiting for status" forever and the PR can't merge. Instead
    # we always let the workflow run and skip the expensive build *inside* via
    # the `changes` job, while `ci-success` still reports green on docs-only PRs.
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# Concurrency: Cancel in-progress runs when a new commit is pushed to the same ref.
# This prevents wasting resources on outdated runs while allowing parallel matrix jobs.
# EXCEPTION: never cancel on `main`. Consecutive pushes to main share one constant
# group, so cancel-in-progress would kill the older run mid-flight — surfacing as a
# spurious "cancelled" (non-error) result AND leaving that commit only partially
# validated, which matters because main is the trusted read-write GCS Nx cache writer.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: continuous-integration-${{ github.ref }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name || 'main' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # FIXME: Currently we're only making use of the staging project and resources
  GOOGLE_CREDENTIALS: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && secrets.GOOGLE_CREDENTIALS_STAGING || secrets.GOOGLE_CREDENTIALS_STAGING }}
  GOOGLE_PROJECT_ID: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && vars.GOOGLE_PROJECT_ID_STAGING || vars.GOOGLE_PROJECT_ID_STAGING }}
  NX_GCS_BUCKET: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && 'openthrottle-staging-nx-cache' || 'openthrottle-staging-nx-cache' }}

  # Only the trusted `main` branch writes to the shared GCS cache; every PR /
  # merge_group build stays read-only. This is the CREEP-safe (CVE-2025-36852)
  # model for a single bucket — no untrusted writer can poison entries that main
  # later reads, while PRs still get warm cache hits from main's last build.
  #
  # `NX_POWERPACK_CACHE_MODE` is @nx/gcs-cache's env override: it wins over BOTH
  # nx.json `localMode` and `ciMode` with no file mutation. It MUST be an env var
  # (not a `sed` into nx.json) because (a) in CI the plugin reads `ciMode`, not
  # `localMode`, and (b) mutating nx.json trips the codegen `git diff --exit-code`.
  NX_POWERPACK_CACHE_MODE: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && 'read-write' || 'read-only' }}

  NX_KEY: ${{ vars.NX_KEY }}
  NX_SWC: 'true'
  OUTPUT_DEBUG: ${{ vars.DEBUG == 'true' && '--verbose' || '' }}
  OUTPUT_DIR: docs/nx/dependency-graphs
  OUTPUT_FILE: dependency-graph.html

# Least-privilege default GITHUB_TOKEN. This workflow only reads the repo,
# queries prior runs, and reads GitHub Packages — it never pushes commits,
# publishes packages, comments on PRs, or edits projects:
#   - actions: read   → nrwl/nx-set-shas queries the last successful `main` run
#   - contents: read  → actions/checkout
#   - packages: read  → node-setup authenticates the @openthrottle GitHub
#                       Packages registry (`.npmrc`) for `pnpm install`
# nx-dependency-graph only uploads an artifact (no extra scope needed).
permissions:
  actions: read
  contents: read
  packages: read

jobs:
  # Cheap path-filter gate. Replaces the old workflow-level `paths-ignore` so the
  # workflow always TRIGGERS (required checks can report), but the expensive
  # `build` below still skips when a PR touches only docs/markdown. Non-PR events
  # (merge_group, push, workflow_dispatch) always run the full build.
  # Native git diff (no third-party action) to match the repo's SHA-pinning posture.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: '🔎 Detect non-docs changes'
        id: filter
        run: |
          set -euo pipefail

          # Only PRs need doc-only detection; everything else runs the full build.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} → run=true (not a pull_request)"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true

          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"

          # Mirror the old paths-ignore (docs/** and **/*.md): if ANY changed file
          # is neither under docs/ nor a .md file, it's real code → run the build.
          if echo "$changed" | grep -vE '(^docs/|\.md$)' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "→ run=true (non-docs changes present)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ run=false (docs/markdown only)"
          fi

  build:
    needs: changes
    # 💰 Skip CI on draft PRs — push freely while iterating; CI fires when marked
    # "Ready for review". Always runs for merge_group and push (no PR payload there).
    # Also skips when the `changes` gate found only docs/markdown edits.
    if: |
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    # FIXME: 💰 Re-enable when we want to spend more
    # Same main-exception as the workflow-level block above: PRs cancel stale runs,
    # main always runs to completion so no push shows a spurious cancellation.
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-build-${{ matrix.target }}-${{ matrix.jobIndex }}
    env:
      jobCount: 1 # must be in sync with "jobIndex"
    runs-on: blacksmith-4vcpu-ubuntu-2204

    # ⚠️ SCALING RISK (deferred by design — DO NOT silently "fix"):
    #   The whole suite (`lint,typecheck,test`) runs on ONE box
    #   (`jobCount: 1`, `jobIndex: [1]`, single `target` string) with a 15-minute
    #   `timeout-minutes` ceiling below. `scripts/parallelize-tasks.ts` sharding
    #   and the `merge_group` trigger are already wired but currently NO-OPs — the
    #   gate is the single matrix box, not distributed execution / a merge queue.
    #
    #   This is a deliberate cost tradeoff (every 💰 marker below), NOT a bug. As
    #   the affected graph grows the 15m timeout becomes the hard ceiling and CI
    #   wall-clock degrades. When that ceiling is hit, re-enable distribution by:
    #     1. Bumping `jobCount` and `jobIndex` together (they MUST stay in sync).
    #     2. Splitting `target` into one entry per box, OR uncommenting the
    #        `parallelize-tasks.ts` shard loop near the bottom of this job.
    #     3. Optionally enabling the GitHub merge queue so `merge_group` gates merges
    #        instead of relying on the ready-PR push.
    #   Re-evaluate cost vs. wall-clock at that point — see AGENTS.md / MONOREPO.md.
    # FIXME: 💰 Increase as needed - balance with cost and time to completion
    strategy:
      matrix:
        jobIndex: [1] # must be in sync with "jobCount"
        # 💰 No merge queue on this plan, so the ready PR is the gate: drafts run
        # nothing (see job `if` above); every ready-PR push runs the full suite.
        target: ['lint,typecheck,test'] # One box per target

    # openthrottle-developer:test (264 jsdom files) used to cost ~12 CPU-minutes
    # because forks re-imported the full module graph per file, which forced the
    # 15 -> 30 bump. Switching that suite to Vitest's vmForks pool dropped it to
    # ~3 CPU-minutes (~730s -> ~172s user CPU), so the original 15m budget holds.
    timeout-minutes: 30

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Inject only the bucket name into nx.json (same value today, so a no-op
      # that leaves the tree clean). The read/write mode is set via the
      # NX_POWERPACK_CACHE_MODE env var above — NOT a sed — so nx.json is never
      # mutated and the codegen `git diff --exit-code` stays green.
      - name: '🪣 NX Setup Cache'
        run: |
          sed -i 's/"bucket": ".*"/"bucket": "${{ env.NX_GCS_BUCKET }}"/' nx.json

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup

      # skill-sync's .agents/skills → skills/ symlinks (and the editor fan-out) are
      # generated artifacts, gitignored by design, so a fresh checkout lacks them.
      # Materialize them before the affected tests and the SSOT drift guard, both of
      # which read the fan-out. `--check` (run by check-agent-assets-ssot) then passes.
      - name: '🔗 Materialize agent-skill symlinks (skill-sync)'
        run: bash skills/skill-sync/scripts/sync.sh

      - name: '🌥️ Google Cloud Provider (GCP)'
        uses: ./.github/actions/google-cloud
        with:
          branch: ${{ env.BRANCH_NAME }}
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
          google_cloud_project: ${{ env.GOOGLE_PROJECT_ID }}

      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: '🧩 Codegen Tasks'
        run: |
          # pnpm exec nx run @tools/dotfiles:build --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --target=codegen-graphql,codegen-react-router --parallel ${{ env.OUTPUT_DEBUG }}
          git diff --exit-code

      # 💰 Folded in from a separate job to avoid spinning a second runner per push.
      # Placed before the affected run so structural breakage fails fast.
      - name: '🔍 Check for circular dependencies'
        if: github.actor != 'dependabot[bot]'
        run: |
          pnpm exec tsx ./scripts/nx-circular-dependencies.ts

      # lint + typecheck run at full parallelism — they are not the memory hog.
      # `test` is serialized (`--parallel=1`): every app's Vitest target spawns its
      # own worker pool, and co-running the heavy jsdom suites (esp.
      # openthrottle-developer, 354 files) on this single shared 4-vCPU box exceeds
      # its memory ceiling — the OOM-killer then SIGKILLs an in-flight worker, which
      # surfaces as files reporting `(0 test)`. Serializing test keeps each suite
      # alone on the box (well under the 15m ceiling for current affected sets).
      # Proper fix (distribute across boxes) is the wired-but-disabled sharding
      # above / OT plan e448a51d.
      - name: '🧠 NX ${{ matrix.target }} affected'
        run: |
          pnpm exec nx affected --target=lint,typecheck,bundle-hooks-check --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --target=test --parallel=1 ${{ env.OUTPUT_DEBUG }}

      # The skill-usage hook core + per-tool adapters now live in the Nx package
      # @openthrottle/agentic-hooks (authored in TS, bundled to committed .cjs),
      # so `nx affected --target=test` above covers them and the drift check runs
      # via check:local:bundle-hooks. See OT plans d3759118 / f5e40886 / 21f150c6.

      # # Phased Vitest gate (P2): openthrottle-server, @openthrottle/openthrottle-mcp, @tools/workflows only.
      # # Full monorepo test remains disabled until openthrottle-developer and other suites are green.
      # - name: '🧪 NX affected Vitest (phased gate)'
      #   run: |
      #     pnpm exec nx affected \
      #       --target=test \
      #       --exclude='*,!openthrottle-server,!@openthrottle/openthrottle-mcp,!@tools/workflows' \
      #       --parallel \
      #       --outputStyle=static \
      #       --verbose \
      #       --nxBail

      - name: '🔒 GraphQL codegen drift guard (agentic-ralph, openthrottle-mcp)'
        run: |
          pnpm exec nx run-many --target=verify-graphql-codegen --projects=@openthrottle/openthrottle-agentic-ralph,@openthrottle/openthrottle-mcp

      - name: '🔗 Agent assets SSOT (symlink drift guard)'
        run: pnpm exec nx run monorepo:check-agent-assets-ssot

      - name: '📋 Agent assets frontmatter validation (D5)'
        run: pnpm exec nx run monorepo:validate-agent-assets-frontmatter

      # Full-tree (not affected): license risk lives in the whole installed graph,
      # so this always scans every dependency — cheapest safety for the case that
      # matters most (a dependency bump / lockfile change pulling in copyleft).
      # Fails the PR on any disallowed or undetected license; waivers live in
      # license-policy.json (see CONTRIBUTING.md § Dependency licenses).
      - name: '⚖️ Dependency-license compliance gate'
        run: pnpm exec nx run monorepo:validate-licenses

      # Keep THIRD-PARTY-LICENSES.md (Apache-2.0 §4 attribution manifest) fresh:
      # regenerate from the installed graph and fail if the committed copy drifted.
      - name: '📜 THIRD-PARTY-LICENSES freshness guard'
        run: pnpm run validate:notices

      - name: '🎨 Prettier format-check'
        run: pnpm exec nx run monorepo:format-check --verbose

      - name: '🧩 Template compliance audit'
        run: pnpm run audit:strict

      # Test-coverage guard-rail — WARNING MODE ONLY (report-only).
      # This surfaces routes/components/hooks/utils missing a co-located spec so
      # remediation plans can carve from the committed baseline. It is
      # intentionally `continue-on-error` and is NOT part of the blocking
      # `audit:strict` aggregate above (that step excludes test-coverage via a
      # negative-lookahead pattern) nor the husky pre-commit/pre-push gate.
      # Flip path: once a category's gap closes, drop test-coverage from the
      # negative lookahead in the `audit:strict` script (so
      # `audit:test-coverage:strict` joins the blocking aggregate) and mirror it
      # into the husky three-surface gate the way the component-shape gate is.
      # See docs/monorepo/test-coverage-audit.md.
      - name: '🧪 Test-coverage audit (warn-only)'
        continue-on-error: true
        run: pnpm run audit:test-coverage

      # - name: '🗄️ Migration COMMENT ON TABLE (diff-scoped)'
      #   run: pnpm exec nx run monorepo:check-migration-table-comments
      #   env:
      #     MIGRATION_COMMENT_LINT_BASE: ${{ github.base_ref || 'main' }}

      # FIXME: 💰 Re-enable when we want to spend more
      # - name: "🧠 NX ${{ matrix.target }} affected"
      #   run: |
      #     # # 🚧 IMPORTANT 🚧 we pass the "matrix.target" as a string to also handle the "test --coverage" case
      #     # node --experimental-strip-types ./scripts/parallelize-tasks.ts "${{ matrix.target }}" ${{ matrix.jobIndex }} ${{ env.jobCount }} ${{ github.ref }} | while IFS= read -r line;
      #
      #     node --experimental-strip-types ./scripts/parallelize-tasks.ts ${{ matrix.target }} ${{ matrix.jobIndex }} ${{ env.jobCount }} ${{ github.ref }} | while IFS= read -r line;
      #       do
      #         read -r tags target <<< `echo $line`;
      #         echo "🧠 Running for $tags | $target";
      #         pnpm exec nx affected --exclude="*,$tags" --target=$target --parallel --verbose
      #     done

  # Stable required-check target. Branch protection should require THIS job
  # ("ci-success"), not the matrix-suffixed `build (1, lint,typecheck,test)`.
  # It reports green when the build succeeded OR was legitimately skipped
  # (docs-only PR / draft), and red only when the build failed or was cancelled.
  ci-success:
    needs: [changes, build]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 2
    steps:
      - name: '✅ Verify CI outcome'
        run: |
          changes_result="${{ needs.changes.result }}"
          build_result="${{ needs.build.result }}"

          echo "changes: $changes_result | build: $build_result"

          if [ "$changes_result" != "success" ]; then
            echo "❌ changes gate did not succeed ($changes_result)"
            exit 1
          fi

          if [ "$build_result" = "success" ] || [ "$build_result" = "skipped" ]; then
            echo "✅ CI gate satisfied (build: $build_result)"
            exit 0
          fi

          echo "❌ CI gate failed (build: $build_result)"
          exit 1

  nx-dependency-graph:
    # 💰 Cost-gated: manual-only via workflow_dispatch (was `if: false`) so the job stays
    # live/lintable and runnable on demand. Restore the actor/ref guard below to automate.
    # if: ${{ (github.actor != 'dependabot[bot]') && (github.ref_name == 'main') }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup

      - name: '🌥️ Google Cloud Provider (GCP)'
        uses: ./.github/actions/google-cloud
        with:
          branch: ${{ env.BRANCH_NAME }}
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
          google_cloud_project: ${{ env.GOOGLE_PROJECT_ID }}

      - name: '📊 Generate dependency graph visualization'
        run: |
          pnpm exec tsx ./scripts/nx-dependency-graph.ts

      - name: '📤 Upload dependency graph artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph
          path: |
            ${{ env.OUTPUT_FILE }}
            static/
          retention-days: 30
