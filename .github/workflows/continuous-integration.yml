################################################################################
#
#   This workflow handles our CI/CD for building and publishing packages.
#
#     - https://medium.com/emoteev-blog/10x-faster-ci-with-nx-and-github-actions-9a51fc4e82a6
#     - https://nx.dev/core-features/distribute-task-execution#running-things-in-parallel
#     - https://nx.dev/recipes/ci/monorepo-ci-github-actions#configuring-ci-using-github-actions-and-nx-
#
#
#   💰 RUNNER COST MODEL — every job here runs on `ubuntu-26.04`, the standard
#   GitHub-hosted runner, pinned on purpose (see docs/monorepo/ci-cost.md
#   § Runner label: pinned to `ubuntu-26.04`).
#
#   OpenThrottle/monorepo is a PUBLIC repository, and GitHub-hosted standard
#   runners are free with unlimited minutes on public repos. `ubuntu-26.04` is
#   4 vCPU / 16 GB — the same core count as the `blacksmith-4vcpu-ubuntu-2204`
#   boxes this workflow used to rent, with double the RAM. Blacksmith bought
#   wall-clock speed (faster clock, sticky-disk caches); it never bought capacity
#   we could not get for $0 here.
#
#   ⚠️  The free tier is a consequence of the repo being PUBLIC. If the canonical
#   repo is ever made private, every `runs-on` in this file starts billing
#   immediately. Do not change `runs-on` to a larger/managed runner without
#   pricing it first — see docs/monorepo/ci-cost.md.
#
################################################################################
name: '🤖 Continuous Integration'
on:
  # workflow_dispatch enables the cost-gated nx-dependency-graph job to be run on demand
  # (it is gated to manual dispatch below) instead of being dead `if: false` code.
  workflow_dispatch:
  # `main` lands PRs through GitHub's merge queue (see docs/monorepo/ci-cost.md
  # § Merge queue on `main`). This trigger is what lets the required `ci-success`
  # check report inside the queue: a required check whose workflow does not
  # trigger on merge_group can never report there, so every PR would sit until
  # check_response_timeout_minutes and then be dequeued. Never remove it.
  merge_group:
    types: [checks_requested]
  pull_request:
    # ready_for_review: ensures CI fires when a draft PR is marked ready (see draft-skip `if`s below)
    types: [opened, ready_for_review, synchronize]
    # ⚠️ NO paths-ignore here — see the `changes` gate job below.
    # A workflow-level `paths-ignore` means a docs-only PR never TRIGGERS the
    # workflow at all, so `build` (or the `ci-success` gate) never reports a
    # status. Once that check is REQUIRED in branch protection, GitHub shows it
    # as "Expected — waiting for status" forever and the PR can't merge. Instead
    # we always let the workflow run and skip the expensive build *inside* via
    # the `changes` job, while `ci-success` still reports green on docs-only PRs.
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# Concurrency: cancel in-progress runs when a newer commit arrives on the SAME ref.
# This prevents wasting resources on outdated PR runs while allowing parallel matrix jobs.
# EXCEPTION: never cancel on `main`. Consecutive pushes to main share one constant
# group, so cancel-in-progress would kill the older run mid-flight — surfacing as a
# spurious "cancelled" (non-error) result AND leaving that commit only partially
# validated. It matters because `main` is the branch every PR's Actions cache is
# restored from, so a half-validated main commit seeds every downstream build.
# A push the merge queue already validated runs only `warm-cache` (see the ♻️
# step in `changes`): it refreshes that seed without re-testing the tree.
# Merge-queue refs are `gh-readonly-queue/.../pr-N-<sha>` and therefore unique per
# entry, so they naturally do NOT cancel each other; each queue candidate keeps its
# own ref-shaped concurrency group.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: continuous-integration-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_SWC: 'true'
  OUTPUT_DEBUG: ${{ vars.DEBUG == 'true' && '--verbose' || '' }}
  OUTPUT_DIR: docs/nx/dependency-graphs
  OUTPUT_FILE: dependency-graph.html

# Least-privilege default GITHUB_TOKEN. This workflow only reads the repo,
# queries prior runs, and reads GitHub Packages — it never pushes commits,
# publishes packages, comments on PRs, or edits projects:
#   - actions: read   → nrwl/nx-set-shas queries the last successful `main` run
#   - contents: read  → actions/checkout
#   - packages: read  → node-setup authenticates the @openthrottle GitHub
#                       Packages registry (`.npmrc`) for `pnpm install`
# nx-dependency-graph only uploads an artifact (no extra scope needed).
permissions:
  actions: read
  contents: read
  packages: read

jobs:
  # Cheap path-filter gate. Replaces the old workflow-level `paths-ignore` so the
  # workflow always TRIGGERS (required checks can report), but the expensive
  # `build` below still skips when a PR touches only docs/markdown. A merge-queue
  # entry is filtered the same way, over the queue's own base..head range. Push
  # and workflow_dispatch always run everything.
  # Native git diff (no third-party action) to match the repo's SHA-pinning posture.
  #
  # 💰 This job must stay cheap — it is one `git diff`. It used to clone the FULL
  # history of a 47 MB repo (`fetch-depth: 0`) to do it. It never needed to: the
  # diff is a two-dot (tree-to-tree) comparison of two known SHAs, which needs
  # only those two commits and their trees, not the commit graph between them.
  # `fetch-depth: 1` plus an explicit depth-1 fetch of both SHAs is sufficient.
  changes:
    runs-on: ubuntu-26.04
    # runs-on: ${{ github.ref == 'refs/heads/main' && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      # 💰 Path gates for the full-tree checks in `build`. Computed here because
      # this job already has the diff and is effectively free — no extra runner.
      # Every gate DEFAULTS TO TRUE for non-PR events and whenever the diff
      # cannot be computed: these are correctness gates, so they fail CLOSED.
      databases: ${{ steps.filter.outputs.databases }}
      deps: ${{ steps.filter.outputs.deps }}
      graph: ${{ steps.filter.outputs.graph }}
      model_text: ${{ steps.filter.outputs.model_text }}
      # 'true' only on a push to `main` whose exact SHA already went green in
      # the merge queue. See the ♻️ step below and the `warm-cache` job.
      queue_validated: ${{ steps.queue.outputs.validated }}
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # ♻️ The merge queue fast-forwards `main` to merge_group.head_sha, the
      # exact commit its CI run just validated. Re-running the whole matrix on
      # the push that follows tests an identical tree a second time: 9–14 min
      # and four runners that the queue could be using (OT plan 80b62f5e).
      # When a green merge_group run of THIS workflow exists for this SHA,
      # `build` and `gates` skip and `warm-cache` refreshes the main-scoped
      # caches that PRs restore from.
      #
      # FAILS CLOSED. Anything other than a confirmed green queue run for this
      # exact SHA — a direct push, a workflow_dispatch, a failed API call, a
      # queue run that went red or was cancelled — means validated=false and
      # the full matrix runs, exactly as before.
      - name: '♻️ Was this SHA already validated in the merge queue?'
        id: queue
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "event=$EVENT_NAME ref=$REF → validated=false (only a push to main can skip)"
            exit 0
          fi

          if ! count="$(gh api "repos/$REPO/actions/workflows/continuous-integration.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq '.total_count' 2>&1)"; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "→ validated=false (could not query merge-queue runs; failing closed)"
            echo "$count"
            exit 0
          fi

          if [ "$count" -ge 1 ] 2>/dev/null; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
            echo "→ validated=true ($count green merge_group run(s) for $SHA)"
          else
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "→ validated=false (no green merge_group run for $SHA: direct push?)"
          fi

      - name: '🔎 Detect non-docs changes'
        id: filter
        run: |
          set -euo pipefail

          # PRs and merge-queue entries are filtered by their diff; push and
          # workflow_dispatch run EVERYTHING.
          #
          # A merge-queue entry diffs merge_group.base_sha (the `main` tip the
          # queue built on) against head_sha (that tip plus every squash ahead of
          # this one, plus this one). That is the whole delta that will land, so
          # a dependency bump anywhere in the group still trips `deps`. Before
          # this, every queue entry re-ran the uncached full-graph licence scans
          # and the circular-dependency check whether or not their inputs moved.
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              head="${{ github.event.merge_group.head_sha }}"
              ;;
            *)
              {
                echo "run=true"
                echo "databases=true"
                echo "deps=true"
                echo "graph=true"
                echo "model_text=true"
              } >> "$GITHUB_OUTPUT"
              echo "event=${{ github.event_name }} → run/databases/deps/graph/model_text=true (not a PR or queue entry)"
              exit 0
              ;;
          esac

          # Fetch just the two endpoints (commit + tree, no history). The shallow
          # checkout above has neither: on a pull_request event actions/checkout
          # lands on refs/pull/N/merge, whose parents are absent at depth 1. A
          # failed fetch is caught by the fail-closed diff below.
          git fetch --no-tags --depth=1 origin "$base" "$head" >/dev/null 2>&1 || true

          # FAIL CLOSED: if the diff cannot be computed for any reason (fetch
          # failed, SHA unreachable after a force-push), run the full build rather
          # than skip it. A skipped build reports GREEN, so guessing wrong in the
          # other direction would wave untested code through.
          if ! changed="$(git diff --name-only "$base" "$head" 2>&1)"; then
            {
              echo "run=true"
              echo "databases=true"
              echo "deps=true"
              echo "graph=true"
              echo "model_text=true"
            } >> "$GITHUB_OUTPUT"
            echo "→ run/databases/deps/graph/model_text=true (could not compute the diff; failing closed)"
            echo "$changed"
            exit 0
          fi

          echo "Changed files:"; echo "$changed"

          # Every test below reads "$changed" from a here-string, never from
          # `echo "$changed" | grep -q`. Under `set -o pipefail` that pipeline
          # misreports on a large diff: `grep -q` exits at the first match, the
          # writer upstream takes SIGPIPE on the rest of the list, and the
          # pipeline returns 141, so a match reads as no match. On #646's
          # 2,499-file merge-queue entry it set run=false 20 times out of 20,
          # which skipped `gates` and `build` and let `ci-success` report green.

          # Mirror the old paths-ignore (docs/** and **/*.md): if ANY changed file
          # is neither under docs/ nor a .md file, it's real code → run the build.
          non_docs="$(grep -vE '(^docs/|\.md$)' <<<"$changed" || true)"
          if [ -n "$non_docs" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "→ run=true (non-docs changes present)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ run=false (docs/markdown only)"
          fi

          # databases: everything the database-seeds job exercises — the migrations
          # and seeds, the runner and seed scripts, the URL helpers they share,
          # the scripts' wiring in the root package.json, and the job itself.
          if grep -qE '^databases/|^scripts/check-database-seeds\.sh$|^scripts/openthrottle-database-(migrations|seed-[a-z]+)\.ts$|^scripts/utils/|^packages/openthrottle-agentic-utils/|^package\.json$|^pnpm-lock\.yaml$|^\.github/workflows/continuous-integration\.yml$' <<<"$changed"; then
            echo "databases=true" >> "$GITHUB_OUTPUT"
            echo "→ databases=true (migrations, seeds or their scripts touched)"
          else
            echo "databases=false" >> "$GITHUB_OUTPUT"
            echo "→ databases=false"
          fi

          # deps: the installed dependency graph can only change through these.
          # Gates the two uncached full-graph licence scans in `build`.
          if grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^license-policy\.json$' <<<"$changed"; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
            echo "→ deps=true (dependency graph or licence policy touched)"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
            echo "→ deps=false"
          fi

          # graph: inputs to the Nx project graph, which the circular-dependency
          # check reads. Nothing else can change its result.
          if grep -qE '(^|/)package\.json$|(^|/)project\.json$|(^|/)tsconfig[^/]*\.json$|^nx\.json$|^pnpm-workspace\.yaml$' <<<"$changed"; then
            echo "graph=true" >> "$GITHUB_OUTPUT"
            echo "→ graph=true (project-graph inputs touched)"
          else
            echo "graph=false" >> "$GITHUB_OUTPUT"
            echo "→ graph=false"
          fi

          # model_text: everything the model-facing-text byte budget measures,
          # plus the gate itself. Deliberately independent of `run`: skill and
          # prompt edits are .md-only PRs, which `run` treats as docs and skips —
          # exactly the PRs this budget exists to catch. schema.gql and
          # pnpm-lock.yaml are here because MCP tool input schemas are generated
          # from the server schema and serialized by the MCP SDK.
          if grep -qE '^skills/[^/]+/SKILL\.md$|^\.agents/prompts/|^packages/openthrottle-mcp/|^applications/openthrottle-server/schema\.gql$|^scripts/(check-)?model-facing-text|^pnpm-lock\.yaml$|^nx\.json$|^\.github/workflows/continuous-integration\.yml$' <<<"$changed"; then
            echo "model_text=true" >> "$GITHUB_OUTPUT"
            echo "→ model_text=true (model-facing text or its gate touched)"
          else
            echo "model_text=false" >> "$GITHUB_OUTPUT"
            echo "→ model_text=false"
          fi

  # Server-side attribution backstop.
  #
  # `.husky/commit-msg` strips attribution from a commit message as it is
  # written, but there are two channels no local hook can ever see:
  #   - the PR title and body, which live only on GitHub, and
  #   - the squash-merge commit, whose message GitHub composes server-side from
  #     the branch commits (0e009e5f/#499 and 463616df/#497 both landed on main
  #     carrying `Co-authored-by:` for exactly this reason).
  # This job is the check on the other side of that boundary.
  #
  # On a PR it checks the title, body and branch commits. In the merge queue it
  # checks the squash commits themselves: with `merge_method: SQUASH`, every
  # commit in merge_group base_sha..head_sha is a server-composed squash, and
  # the queue fast-forwards `main` to head_sha, so those exact messages are what
  # land. Failing here ejects the PR before the commit becomes immutable history.
  #
  # The check itself is NOT restated here — it is the github-pull-request skill's
  # guard, skills/github-pull-request/scripts/check-attribution.sh, the same one
  # the commit-msg and pre-push hooks run, so none of them can drift.
  #
  # 💰 No Nx, no install, no cache, no full clone: a sparse depth-1 checkout of
  # the guard's two shell files plus one paginated API call. Runs on draft PRs too, unlike
  # `build` — catching this before review costs nothing and catching it after
  # the squash costs an immutable commit on main.
  attribution-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Job-scoped addition to the workflow's least-privilege default: reading
    # `pulls/{n}/commits` needs pull-requests:read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: '📦 Checkout the attribution guard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            skills/github-pull-request/scripts/attribution-patterns.sh
            skills/github-pull-request/scripts/check-attribution.sh
          sparse-checkout-cone-mode: false

      - name: '🚫 No tool or model attribution'
        env:
          # Via env, never `${{ }}` inside the script: a PR title or body is
          # attacker-controlled text and would otherwise be shell-injected.
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          args=""

          # The guard picks the pattern per input: unanchored for the one-line PR
          # title, line-anchored for the body and commit messages (a squash subject
          # is the PR title, which the PR run already checked unanchored).
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # The squash commits the queue built, i.e. exactly what will land.
            # The compare API needs no clone; --paginate covers a deep group.
            gh api "repos/$REPO/compare/$MERGE_GROUP_BASE...$MERGE_GROUP_HEAD" --paginate \
              --jq '.commits[] | .sha[0:8] + " " + (.commit.message | @base64)' > "$work/commits"
          else
            printf '%s' "$PR_TITLE" > "$work/title"
            printf '%s' "$PR_BODY" > "$work/body"
            args="--title-file $work/title --body-file $work/body"

            # One paginated call; the message is base64'd so multi-line bodies
            # survive being paired with their SHA on a single line.
            gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
              --jq '.[] | .sha[0:8] + " " + (.commit.message | @base64)' > "$work/commits"
          fi

          # An empty range would pass vacuously, so treat it as a failure: a
          # queue entry always carries at least its own squash commit.
          if [ ! -s "$work/commits" ]; then
            echo "❌ no commits found to check (event=$EVENT_NAME); failing closed"
            exit 1
          fi

          # One file per commit, named for its sha so the guard's report names it.
          while read -r sha encoded; do
            printf '%s' "$encoded" | base64 -d > "$work/$sha"
            args="$args --message-file $work/$sha"
          done < "$work/commits"

          # $args holds only mktemp paths and flags, never PR text, so splitting it is safe.
          # shellcheck disable=SC2086
          sh skills/github-pull-request/scripts/check-attribution.sh $args

  build:
    needs: changes
    # 💰 Skip CI on draft PRs — push freely while iterating; CI fires when marked
    # "Ready for review". Always runs for merge_group and push (no PR payload there).
    # Also skips when the `changes` gate found only docs/markdown edits.
    if: |
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.queue_validated != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    # 💰 Cost/wall-clock tradeoffs in this job are priced in
    # docs/monorepo/ci-cost.md — read it before widening any of them.
    # Same main-exception as the workflow-level block above: PRs cancel stale runs,
    # main always runs to completion so no push shows a spurious cancellation.
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-build-${{ matrix.target }}-${{ matrix.jobIndex }}
    # Job-scoped addition to the workflow's least-privilege default:
    # `actions: write` lets the ⏏️ step at the end of this job cancel a red
    # merge-queue run (see that step). Job-level `permissions` REPLACES the
    # workflow block rather than merging with it, so the other two scopes are
    # restated. Permissions cannot be gated on the event, so ready PRs from
    # same-repo branches get this too. Fork PRs never do (their token is
    # read-only), and an author with push access can already cancel runs.
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      # ⚠️ MUST equal the length of `matrix.jobIndex` below. The partitioner exits
      # non-zero if they disagree, rather than letting projects past the end of
      # the list fall off every shard while CI still reports green.
      jobCount: 3
    runs-on: ubuntu-26.04

    # 🧩 SHARDING — live since OT plan b19377d1. `lint`/`typecheck`/`test` are
    #   partitioned across 3 `ubuntu-26.04` boxes by
    #   `scripts/parallelize-tasks.ts`, which deals the affected projects
    #   round-robin (applications first, so the heavy Vitest suites spread out)
    #   and prints THIS box's Nx `--exclude` selector.
    #
    #   Why 3, from measured runs rather than taste (docs/monorepo/ci-cost.md):
    #   per-box fixed overhead (checkout + install + codegen) is ~1.6 min, only
    #   6–9% of the job, while the shardable affected work was 88–95% of it. The
    #   single-box job hit 28m24s on a fat `main` graph — 95% of the
    #   `timeout-minutes` ceiling below — and one run was cancelled at 28m55s
    #   INSIDE the affected step. A 3-way split projects that worst case to
    #   ~10.6 min; 2 boxes would only reach ~15 min, and a 4th would start paying
    #   setup for shards below the ~5.6 min floor set by the single heaviest
    #   project.
    #
    #   ⚠️ That floor has since MOVED, and the arithmetic above is kept as the
    #   reasoning of its time rather than as the current state. It read the
    #   heaviest project as a floor "whose suite sharding cannot split" — true of
    #   PROJECT sharding, which is all this partitioner does, but not of Vitest's
    #   own `--shard`, which splits WITHIN a project. openthrottle-developer's
    #   suite is now split three ways here (OT plan 9fc16731; 679 files / ~137s
    #   whole -> ~227 files / ~46s per shard), so the ~5.6 min floor is roughly a
    #   third of what it was. This does NOT automatically argue for a 4th box: the
    #   4th-box case was always setup-cost vs. remaining shardable work, and a
    #   lower floor moves BOTH sides of it. Re-measure before widening.
    #
    #   A target-split (`target: [lint, typecheck, test]`) was measured and
    #   REJECTED: it is the right answer only when shards are setup-bound, and it
    #   would leave the ~11-minute `test` graph — the segment that is actually
    #   growing — whole on one box.
    #
    #   Deliberately NOT a `target` × `jobIndex` cross product: that is 9 boxes
    #   for no extra coverage. Keep `target` a single string.
    #
    # 💰 Runner minutes are free on this PUBLIC repo, so the constraint on shard
    # count is wall-clock and queue contention, never spend. If the canonical repo
    # ever goes private, every box here starts billing — reprice before widening.
    strategy:
      # On a PR, one red shard must not cancel its siblings: a partial matrix
      # tells you far less about a failing PR than three complete results do.
      #
      # ⏏️ A merge-queue entry is the exception. Nobody reads its partial
      # results, and every entry queued behind a red one rebuilds only once it
      # is ejected, so there the first red shard should end the run. fail-fast
      # alone cannot do that: it cancels sibling legs but not `gates`, which
      # `ci-success` also waits for. The ⏏️ step at the end of this job cancels
      # the whole run; fail-fast stays on as the backstop if that API call fails.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        jobIndex: [1, 2, 3] # ⚠️ must be in sync with "env.jobCount"
        # 💰 Ready PRs are the ordinary contributor gate, and merge-queue entries
        # are the pre-merge re-validation gate on `main`. Drafts still run nothing
        # (see job `if` above). Single entry on purpose — this is the box label,
        # not a second axis.
        target: ['lint,typecheck,test']

    # openthrottle-developer:test (761 jsdom files today; 264 when this was
    # written) used to cost ~12 CPU-minutes
    # because forks re-imported the full module graph per file, which forced the
    # 15 -> 30 bump. Switching that suite to Vitest's vmForks pool dropped it to
    # ~3 CPU-minutes (~730s -> ~172s user CPU), so the original 15m budget holds.
    #
    # Kept at 30 even though a shard should now finish in ~8 min: this is a
    # per-shard ceiling, and headroom is what stops an unlucky partition (two
    # heavy app suites on one box) from turning a slow run into a red one.
    timeout-minutes: 30

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 💰 Partial clone: fetch the commit graph and trees but NOT historical
          # file contents. `nx affected` / nx-set-shas need to walk history and
          # diff trees, never to read an old blob, so blobs are dead weight here.
          # Any blob that IS needed is fetched lazily on demand. See
          # docs/monorepo/ci-cost.md.
          fetch-depth: 0
          filter: 'blob:none'

      # cache-suffix: all three shards share this commit, so without a
      # discriminator they would race one exact Nx cache key and two of the three
      # saves would be dropped — see .github/actions/node-setup/action.yml.
      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: shard-${{ matrix.jobIndex }}
          # 💰 Restore-only in the merge queue: its ref is unique per entry, so
          # nothing could ever restore a save from it (see node-setup).
          save-cache: ${{ github.event_name != 'merge_group' }}

      # ot-skill-sync's .agents/skills → skills/ symlinks (and the editor fan-out) are
      # generated artifacts, gitignored by design, so a fresh checkout lacks them.
      # Materialize them before the affected tests and the SSOT drift guard, both of
      # which read the fan-out. `--check` (run by check-agent-assets-ssot) then passes.
      - name: '🔗 Materialize agent-skill symlinks (ot-skill-sync)'
        run: bash skills/ot-skill-sync/scripts/sync.sh

      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Runs on EVERY shard, and over the FULL affected set rather than this
      # shard's chunk — generated output is a prerequisite for lint/typecheck, and
      # a shard cannot know which of its projects' generated files a sibling's
      # projects import. Not gated to jobIndex 1 for the same reason the other
      # once-per-run gates are: those gates are extra work, this one is work the
      # box has to do anyway. The `git diff --exit-code` drift assertion is then
      # free, so it runs on all three boxes — strictly more coverage, zero extra
      # runner time.
      #
      # ⚠️ Scope: this assertion only sees TRACKED output — openthrottle-developer's
      # app/__generated__ and openthrottle-agentic-ralph's src/__generated__, both of
      # which negate the root .gitignore. Projects that leave __generated__ ignored
      # (openthrottle-mcp, openthrottle-developer-codegen) contribute nothing here,
      # because git diff over an ignored untracked path always exits 0. Their guard is
      # scripts/verify-graphql-codegen.ts, which compares the filesystem instead.
      - name: '🧩 Codegen Tasks'
        run: |
          # pnpm exec nx run @tools/dotfiles:build --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --target=codegen-graphql,codegen-react-router --parallel ${{ env.OUTPUT_DEBUG }}
          git diff --exit-code

      # ⚠️ READ THIS BEFORE CHANGING ANY `--parallel` FLAG IN THIS FILE.
      # In Nx 23.2.0, a BARE `--parallel` is NOT "use all cores" — it resolves to
      # 3, exactly the same as omitting the flag. `availableParallelism()` is only
      # consulted for a PERCENTAGE value (`--parallel=50%`). Verified against the
      # installed package, `getThreadPoolSize` in
      # node_modules/nx/dist/src/tasks-runner/task-orchestrator.js:
      #     no flag | --parallel | --parallel=true  -> 3
      #     --parallel=1 | --parallel=false         -> 1
      #     --parallel=N                            -> N
      # So the `lint,typecheck,bundle-hooks-check --parallel` line below and the
      # flagless `test` line below it run at the SAME concurrency. This comment
      # used to claim lint/typecheck ran "at full parallelism" while `test` was
      # throttled; that was never true. Only an explicit number changes anything.
      #
      # `test` is left at Nx's DEFAULT concurrency (3). The original reason was
      # fear of the OOM: every app's Vitest target spawns its own worker pool, and
      # co-running the heavy jsdom suites (esp. openthrottle-developer, now ~761
      # files) on ONE shared box historically exceeded its memory ceiling — the
      # OOM-killer then SIGKILLs an in-flight worker, which surfaces as files
      # reporting `(0 test)`. That failure mode is SILENT-PASSING (green CI, tests
      # never ran), which is strictly worse than slow.
      #
      # ✅ RE-TESTED 2026-09-16 (OT plan 0494d906). That fear is no longer the
      # reason, because it was measured and did not reproduce — but the setting
      # still stands, for a better reason. Method: `--parallel=4` on a scratch
      # branch, fat affected graph (72/73 projects, forced by touching
      # tsconfig.base.json with a fresh marker commit per run so nx-set-shas could
      # not narrow the diff), 5 runs, against a 3-run control at the default 3.
      #
      #   Arm A, --parallel=4 (n=5): runs 35045162100, 35046125046, 35047105781,
      #     35048008075, 35048941252
      #   Arm B, control at 3 (n=3): runs 35049973988, 35050723575, 35051408212
      #
      #   SAFETY  — every shard of all 8 runs: zero `(0 test)` files, zero
      #     SIGKILL/heap-OOM, dmesg clean, and Vitest collected 254+254+253 = 761
      #     files, exactly the 761 test files on disk. Peak memory at
      #     `--parallel=4` was ~7.7 GB of a 15.99 GB box — under half. The three
      #     changes that were expected to help (bounded `vmForks`, 16 GB runners,
      #     sharding) are real: this does NOT OOM at 4.
      #   THROUGHPUT — and it buys nothing. Slowest-shard NX step: 612s mean at
      #     `--parallel=4` vs 548s at the default 3. That is +11.7%, but n is small
      #     and the ranges overlap (504–663 vs 462–667), so the honest reading is
      #     NO MEASURABLE GAIN IN EITHER DIRECTION. The memory delta, by contrast,
      #     is clean and non-overlapping: 6135–6435 MiB at 3 vs 7416–7667 MiB at 4.
      #
      # So: ~1.2 GB more headroom consumed for no measurable wall-clock. The
      # reason is structural — after project sharding AND Vitest suite sharding, a
      # box holds too few test projects to saturate even 3 slots, and the critical
      # path is the single `openthrottle-developer --shard` invocation below, which
      # is ONE Nx task that no amount of task concurrency can split.
      #
      # LEAVE IT AT THE DEFAULT. Not out of caution about an OOM that no longer
      # reproduces, but because widening it has been measured to do nothing. If you
      # want this step faster, the lever is shard BALANCE (the partition ran
      # 667s/335s/495s in run 35051408212) — not concurrency. The bar for revisiting
      # is unchanged: evidence, not argument, and a developer machine with different
      # RAM still proves nothing about the CI box's ceiling.
      - name: '🧠 NX ${{ matrix.target }} affected (shard ${{ matrix.jobIndex }}/${{ env.jobCount }})'
        env:
          # The union of the targets the two `nx affected` commands below run.
          # parallelize-tasks.ts deals the projects that own an affected task for
          # these (Nx 24 task-based affected), so a target added below must be
          # added here too, or a project affected only through it lands on no box.
          NX_SHARD_TARGETS: lint,typecheck,bundle-hooks-check,test
        run: |
          set -euo pipefail

          # The partitioner prints THIS box's marching orders on stdout as
          # `key=value` lines, and the whole partition on stderr, so the log above
          # is the evidence that the split covered every affected project exactly
          # once. It exits non-zero when matrix.jobIndex / env.jobCount have
          # drifted apart, or when either of its selectors does not resolve back
          # to exactly the chunk it was built from — the failure that would
          # otherwise be silent-passing.
          #
          #   selector            this box's chunk            → lint/typecheck
          #   testSelector        same chunk, suite-sharded   → test
          #                       projects removed
          #   suiteShardProjects  suites split WITHIN the     → test --shard
          #                       project across every box
          #   suiteShard          this box's `i/n` for those
          #
          # ⚠️ `suiteShard` is emitted BY the partitioner, from the same argv it
          # partitions with — the Vitest shard count can therefore never drift out
          # of agreement with the project partition. Do not rebuild it here from
          # matrix.jobIndex/env.jobCount; that would reintroduce exactly the drift
          # `env.jobCount`'s ⚠️ note guards against.
          partition="$(pnpm exec tsx ./scripts/parallelize-tasks.ts "${{ matrix.jobIndex }}" "${{ env.jobCount }}")"

          selector="$(printf '%s\n' "$partition" | sed -n 's/^selector=//p')"
          suiteShard="$(printf '%s\n' "$partition" | sed -n 's/^suiteShard=//p')"
          suiteShardProjects="$(printf '%s\n' "$partition" | sed -n 's/^suiteShardProjects=//p')"
          testSelector="$(printf '%s\n' "$partition" | sed -n 's/^testSelector=//p')"

          # THREE states, not two — each said out loud, because an idle box and a
          # box that silently skipped real work look identical in a green log.
          #
          #   1. no chunk, nothing sharded → genuine no-op
          #   2. no chunk, but a shard to run → NOT idle: this box owns a slice of
          #      the sharded suite even though it drew no projects of its own
          #   3. a chunk (with or without a shard) → the ordinary case
          if [ -z "$selector" ] && [ -z "$suiteShardProjects" ]; then
            echo "🫙 Empty shard: the affected set is smaller than jobCount, so box ${{ matrix.jobIndex }} was assigned no projects."
            echo "   This is a no-op, NOT a skip — the partition printed above shows what the other shards took."
            exit 0
          fi

          if [ -z "$selector" ]; then
            echo "🫙 Box ${{ matrix.jobIndex }} drew no projects of its own."
            echo "   NOT idle: it still runs Vitest --shard=$suiteShard of $suiteShardProjects below."
          else
            echo "🧠 shard ${{ matrix.jobIndex }}/${{ env.jobCount }} → $selector"
          fi

          # ⏩ OVERLAP (OT plan 80b62f5e). The suite-sharded `--shard` run used to
          # start only after lint/typecheck AND every other test had finished, so
          # its ~3 min sat at the end of the critical path on every box while
          # earlier phases left task slots idle. It now runs in the BACKGROUND
          # from the start of this step, beside the two foreground invocations.
          #
          # Why two Nx processes cannot race here: the only thing they could
          # share is a dependency task (both would delete and rewrite the same
          # outputs). So the background run's dependency tasks, read from Nx's
          # own task graph rather than restated, run SYNCHRONOUSLY first, and
          # the background run then passes --excludeTaskDependencies. When the
          # foreground later reaches the same task it is a cache hit whose
          # outputs already match, which Nx leaves untouched.
          #
          # Memory: this adds one Vitest pool to the box's three Nx test slots.
          # --parallel=4 peaked at ~7.7 GB of 16 GB (OT plan 0494d906), the same
          # order of load. The OOM failure mode is SILENT-PASSING, so the end of
          # this step fails the job on any OOM kill and on any `(0 test)` file.
          # 📈 NX_PROFILE: each invocation writes a Chrome trace of its tasks'
          # real durations. The 📈 upload below ships them, and
          # `generate-shard-weights.ts --from-ci` turns them into the committed
          # shard-weights.json, measured on this hardware. Nx joins the value
          # onto the cwd, so it MUST be a relative path.
          sharded_log="$RUNNER_TEMP/suite-shard.log"
          sharded_pid=""

          if [ -n "$suiteShardProjects" ]; then
            graph="$RUNNER_TEMP/suite-shard-graph.json"
            pnpm exec nx run-many --projects="$suiteShardProjects" --target=test --graph="$graph" >/dev/null
            deps="$(node -e 'const g=require(process.argv[1]); console.log(Object.keys(g.tasks.tasks).filter((id) => !id.endsWith(":test")).join("\n"))' "$graph")"

            echo "🧱 Building the --shard run's dependency tasks first:"; echo "$deps"
            while IFS= read -r task; do
              [ -z "$task" ] || pnpm exec nx run "$task" ${{ env.OUTPUT_DEBUG }}
            done <<<"$deps"

            echo "✂️  Vitest --shard=$suiteShard of $suiteShardProjects starts in the background (lint/typecheck for it stay on the partition)"
            # `--outputStyle=stream` is load-bearing, not cosmetic: under Nx's CI
            # default the task's output is buffered into one block, and for a
            # suite this size the run that introduced sharding lost Vitest's
            # `Test Files N passed (N)` summary on all three legs. That summary
            # is the ONE number separating "this box ran its third" from "this
            # box ran nothing and went green". The log file is printed in full
            # below and the summary line is echoed on its own.
            #
            # `--maxWorkers=2` (OT plan 1d2f247c): at the config's CI value of 4
            # this pool plus Nx's 3 slots oversubscribed the 4-vCPU box, and the
            # overlap bought nothing. Over the heavy merge-queue runs either side
            # of #724, the slowest shard's step went 12m16s/12m57s → 13m45s/12m32s.
            # lint/typecheck stretched from 1.5–2.8 min to 3–5 min, and this suite
            # from 140–195s to 165–533s. Two workers leave the foreground most of
            # the box. The suite still finishes well inside the foreground's ~7–10
            # min, so its own slowdown stays off the critical path. Forwarded to
            # the Vitest CLI by nx:run-commands, the same route as `--shard`.
            NX_PROFILE=.nx/profiles/suite-shard.json pnpm exec nx run-many --projects="$suiteShardProjects" --target=test --shard="$suiteShard" --maxWorkers=2 --excludeTaskDependencies --outputStyle=stream ${{ env.OUTPUT_DEBUG }} >"$sharded_log" 2>&1 &
            sharded_pid=$!
            trap '[ -n "$sharded_pid" ] && kill "$sharded_pid" 2>/dev/null || true' EXIT
          fi

          # Both foreground invocations run at Nx's default concurrency of 3 — the
          # bare `--parallel` here is not "full", see the flag-semantics note
          # above. Widening `test` stays evidence-gated. Which targets run, and
          # how, is the workflow's business — the partitioner only answers which
          # projects, and which slice of a sharded suite, are mine.
          if [ -n "$selector" ]; then
            NX_PROFILE=.nx/profiles/lint-typecheck.json pnpm exec nx affected --exclude="*,$selector" --target=lint,typecheck,bundle-hooks-check --parallel ${{ env.OUTPUT_DEBUG }}
          fi

          # `testSelector`, not `selector`: a suite-sharded project is absent from
          # EVERY box's test partition and covered by the --shard run instead.
          # Empty when this box's whole chunk was suite-sharded away.
          if [ -n "$testSelector" ]; then
            NX_PROFILE=.nx/profiles/test.json pnpm exec nx affected --exclude="*,$testSelector" --target=test ${{ env.OUTPUT_DEBUG }}
          fi

          # ⚠️ `--shard` MUST stay on its own invocation. Attaching it to the
          # `nx affected --target=test` line above would shard every OTHER
          # project's suite too, running a third of each and reporting green.
          # Vitest prints the collected file count per shard; three boxes'
          # counts summing to the full suite is the check that matters.
          if [ -n "$sharded_pid" ]; then
            echo "⏳ Waiting for the background --shard run…"
            if wait "$sharded_pid"; then sharded_rc=0; else sharded_rc=$?; fi
            sharded_pid=""

            echo "::group::✂️  Vitest --shard=$suiteShard of $suiteShardProjects (full output)"
            cat "$sharded_log"
            echo "::endgroup::"

            echo "✂️  --shard=$suiteShard summary:"
            grep -E 'Test Files|Tests  ' "$sharded_log" || echo "❌ no Vitest summary line found"

            if [ "$sharded_rc" -ne 0 ]; then
              echo "❌ the --shard run failed (exit $sharded_rc)"
              exit "$sharded_rc"
            fi

            if ! grep -qE 'Test Files' "$sharded_log"; then
              echo "❌ the --shard run printed no 'Test Files' summary; refusing to report green"
              exit 1
            fi

            if grep -qE '\(0 test\)' "$sharded_log"; then
              echo "❌ a file collected (0 test): the signature of an OOM-killed worker"
              grep -E '\(0 test\)' "$sharded_log"
              exit 1
            fi
          fi

          if sudo dmesg 2>/dev/null | grep -qiE 'out of memory|killed process'; then
            echo "❌ the kernel OOM-killed a process on this box during the run:"
            sudo dmesg | grep -iE 'out of memory|killed process'
            exit 1
          fi

      # 📈 Per-task timings for the shard-weights table (see the 📈 note in
      # the step above). Uploaded only from merge-queue entries: that is where
      # `build` runs for every commit that lands (a push to `main` the queue
      # already validated skips it, see `warm-cache`), it is the code that
      # actually merges, and the regeneration reads nothing else. Artifacts are
      # per-run, not branch-scoped, so a queue ref's are downloadable later.
      - name: '📈 Upload Nx task profile'
        if: success() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: nx-profile-shard-${{ matrix.jobIndex }}
          path: .nx/profiles/
          retention-days: 30

      # ⏏️ MERGE QUEUE ONLY: eject a red entry now, not when the slowest job ends.
      # The queue removes an entry only once the required `ci-success` reports,
      # and that job waits for every shard AND `gates`. Probe C (run
      # 41931301776) failed at 23:09:50 and reported at 23:11:58, all of it
      # spent waiting on `gates`. Cancelling the run ends every sibling at once.
      #
      # Why this cannot turn `ci-success` green: the job running this step has
      # already failed, so its result is `failure` (or `cancelled`, if the cancel
      # reaches it first). `ci-success` accepts only `success` or `skipped`, so
      # either one is red. `ci-success` is `if: always()`, which a cancel does not
      # stop, so the required check still reports rather than going missing.
      #
      # A second cancel from another red leg is refused or ignored. Only the
      # separate force-cancel endpoint skips `always()` jobs, and nothing here
      # calls it. `|| echo` keeps a refused call quiet; this job is red regardless.
      # The same step ends `gates` below. Keep the two in sync.
      - name: '⏏️ Cancel this merge-queue run (fast ejection)'
        if: failure() && github.event_name == 'merge_group'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ A gate failed in a merge-queue entry; cancelling run $RUN_ID so ci-success reports red now."
          gh run cancel "$RUN_ID" || echo "⚠️ cancel request refused (run already cancelling?); this job is red either way"

      # The skill-usage hook core + per-tool adapters now live in the Nx package
      # @openthrottle/agentic-hooks (authored in TS, bundled to committed .cjs),
      # so `nx affected --target=test` above covers them and the drift check runs
      # via check:local:bundle-hooks. See OT plans d3759118 / f5e40886 / 21f150c6.

      # # Phased Vitest gate (P2): openthrottle-server, @openthrottle/openthrottle-mcp, @tools/workflows only.
      # # Full monorepo test remains disabled until openthrottle-developer and other suites are green.
      # - name: '🧪 NX affected Vitest (phased gate)'
      #   run: |
      #     pnpm exec nx affected \
      #       --target=test \
      #       --exclude='*,!openthrottle-server,!@openthrottle/openthrottle-mcp,!@tools/workflows' \
      #       --parallel \
      #       --outputStyle=static \
      #       --verbose \
      #       --nxBail

      # ────────────────────────────────────────────────────────────────────────
  # 🧩 ONCE-PER-RUN GATES — whole-tree checks, run exactly once per run.
  #
  # These read the whole tree (or the whole installed graph), not any shard's
  # chunk, so their result is identical on every box. Running them on all three
  # would triple the work for zero extra coverage.
  #
  # 💰 They used to live on shard 1 under `if: matrix.jobIndex == 1`, justified
  # by "they total ~20s: a separate job would pay ~1.6 min of checkout+install
  # to save ~20s of shard-1 wall-clock". That arithmetic was measured and is
  # wrong twice over (OT plan 3feb3613):
  #   1. They total ~92s, not ~20s — 4.6x the figure the argument rested on.
  #      Shard 1's job tail ran 82-110s against ~12s on shards 2 and 3.
  #   2. The ~1.6 min of setup is NOT paid on the critical path. This job runs
  #      CONCURRENTLY with the matrix and finishes in roughly 178s (86s setup +
  #      92s gates) against the matrix's ~727s critical path, so it costs zero
  #      wall-clock while taking 92s off the longest shard.
  #
  # ⚠️ This is NOT the 4th shard that was measured and rejected (OT plan
  # 0494d906). A 4th shard adds a box whose setup lands ON the critical path —
  # per-box fixed overhead is now 24.5% of the critical job, so more boxes make
  # that worse. A sibling job that finishes in a quarter of the matrix's runtime
  # adds nothing to the critical path at all. Different shape, opposite answer.
  #
  # ⚠️ Adding a step? Decide which side it belongs on. A PER-CHUNK check belongs
  # in `build`, where it sees only that shard's projects. A WHOLE-TREE check
  # belongs HERE. Putting a per-chunk check here silently narrows it to nothing;
  # putting a whole-tree check in `build` triples it.
  #
  # ⚠️ This job MUST stay in `ci-success`'s `needs`. Branch protection requires
  # `ci-success` and nothing else, so a gate that fails here is only a real gate
  # because that job aggregates this one.
  gates:
    needs: changes
    if: |
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.queue_validated != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-gates
    # Same job-scoped grant as `build`, for the same ⏏️ step; see the note there.
    permissions:
      actions: write
      contents: read
      packages: read

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same partial clone as `build`: nx-set-shas walks history and diffs
          # trees, it never reads an historical blob.
          fetch-depth: 0
          filter: 'blob:none'

      # cache-suffix: this job shares its commit with all three shards, so
      # without a discriminator it would race their exact Nx cache key and lose
      # its task hashes to a duplicate-save drop.
      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: gates
          # 💰 Restore-only in the merge queue: its ref is unique per entry, so
          # nothing could ever restore a save from it (see node-setup).
          save-cache: ${{ github.event_name != 'merge_group' }}

      # check-agent-assets-ssot and the frontmatter validator read the
      # .agents/skills -> skills/ fan-out, which is generated and gitignored.
      - name: '🔗 Materialize agent-skill symlinks (ot-skill-sync)'
        run: bash skills/ot-skill-sync/scripts/sync.sh

      # The Prettier gate below reads NX_BASE/NX_HEAD to scope itself to a PR's
      # diff; without this it would fail closed to a full-tree sweep every run.
      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # 🧩 No codegen step, deliberately. `build` needs it because lint/typecheck
      # consume generated output; nothing here does. The GraphQL guard below
      # snapshots, regenerates and byte-compares on its own — see the header of
      # scripts/verify-graphql-codegen.ts.

      # 💰 Gated on project-graph inputs. A cycle can only appear or disappear
      # when package.json / project.json / tsconfig* / nx.json change; editing a
      # function body cannot alter the graph. Fails closed (`graph` is 'true' for
      # non-PR events and whenever the diff could not be computed).
      #
      # First in this job so structural breakage still surfaces early. It used to
      # sit in `build` BEFORE the affected run for that reason; from here it no
      # longer short-circuits the matrix, so a cycle now fails `gates` while the
      # shards run on. That costs runner minutes (free on this public repo) and
      # buys back its share of shard 1's wall-clock, which is the scarce one.
      - name: '🔍 Check for circular dependencies'
        if: github.actor != 'dependabot[bot]' && needs.changes.outputs.graph == 'true'
        run: |
          pnpm exec tsx ./scripts/nx-circular-dependencies.ts

      - name: '🔒 GraphQL codegen drift guard (agentic-ralph, openthrottle-mcp)'
        run: |
          pnpm exec nx run-many --target=verify-graphql-codegen --projects=@openthrottle/openthrottle-agentic-ralph,@openthrottle/openthrottle-mcp

      - name: '🔗 Agent assets SSOT (symlink drift guard)'
        run: pnpm exec nx run monorepo:check-agent-assets-ssot

      - name: '📋 Agent assets frontmatter validation (D5)'
        run: pnpm exec nx run monorepo:validate-agent-assets-frontmatter

      # Static and build-free. Fails when a generated agent config file (MCP
      # servers + permission policy for every agent CLI) no longer matches
      # .agents/agent-config.json, and prints the diff. Fix with
      # `pnpm exec tsx scripts/sync-agent-config.ts`. Design:
      # docs/monorepo/agent-config-parity.md.
      - name: '🤝 Agent config parity (MCP + permissions drift guard)'
        run: pnpm exec nx run monorepo:check-agent-config-parity

      # Whole-tree `git ls-files` scan, so a `gates` job step like its neighbours.
      # Fails when a tracked path sits under a lib/, helpers/, common/, shared/ or
      # misc/ directory — ot-folders rule 4. Pre-commit checks only newly added
      # paths; this is the authoritative whole-tree copy.
      - name: '🗂️ Folder vocabulary (no junk-drawer folders)'
        run: pnpm exec nx run monorepo:check-folder-vocabulary

      # Static and build-free (the TypeScript compiler API over each CMS block
      # package). Fails when a package's committed schemas/ no longer match its
      # block props interfaces — the JSON Schemas the CMS validates fragment
      # properties against. Fix with `pnpm nx run <project>:cms-schemas:write`.
      - name: '🧩 CMS block schema drift guard'
        run: pnpm exec nx run-many --target=cms-schemas --configuration=check

      # Whole-tree read of every tracked file's header — a `gates` job step for
      # the same reason as its neighbours. Fails when a generated payload is not
      # marked linguist-generated in the root .gitattributes, the omission that
      # otherwise stays invisible until a PR diff is drowned in bundle churn.
      - name: '🫥 Generated-payload .gitattributes coverage'
        run: pnpm exec nx run monorepo:check-generated-attributes

      # Whole-tree, static. Claude Code skips an unparseable settings file
      # entirely, so one `//` comment in .claude/settings.json disabled every
      # project hook for five weeks (2026-09-23) with no visible error.
      - name: '🧾 Claude config files are strict JSON'
        run: pnpm exec nx run monorepo:check-claude-config-json

      # Whole-tree, static. Test targets run the vitest CLI, so a single spec is
      # `:test -- <path>`; the removed @nx/vitest executor's `--testFile` flag now
      # fails with "Unknown option". Keeps stale examples out of agent-read docs.
      - name: '🎯 Single-spec test docs use -- <path>'
        run: pnpm exec nx run monorepo:check-test-file-filter-docs

      # Static and build-free, so one shard is enough. Catches the `exports`
      # condition pointing into a gitignored build dir on a package whose own
      # sources import it by name — the mismatch that made shard assignment,
      # rather than the code, decide whether a suite could collect.
      - name: '📦 Package entrypoint consistency'
        run: pnpm exec nx run monorepo:check-package-entrypoints

      # Static and build-free, like the entrypoint check above. Fails when a
      # project's package.json omits sideEffects, declares true, or declares
      # false/an array that leaves a module with top-level effects (or a
      # stylesheet) unlisted. Bundlers drop unlisted modules whose exports go
      # unused, top-level code included, so an untrue `false` deletes behavior.
      - name: '🌳 Truthful sideEffects declarations'
        run: pnpm exec nx run monorepo:check-side-effects

      # 🗄️ Static, whole-tree, no database — so one shard is enough.
      #
      # ⚠️ This gate did not exist until 2026-09-10, and its absence is why four
      # duplicate migration prefixes (110 x2, 111 x2) landed on main between
      # 2026-09-07 and 2026-09-09 while the rule that forbids them had been in
      # the tree since 2026-08-23 (#421). It ran ONLY from `check:local`, which
      # is a developer convenience, not a gate. A rule nothing invokes in CI is
      # documentation.
      #
      # Runs UNGATED by a path filter, deliberately. A duplicate prefix is a
      # property of the MERGED tree, not of the diff: the branch that completes
      # a collision may be the one that touched no migration at all, and the
      # second of two concurrent branches only becomes wrong once the first
      # lands. The check resolves against the base ref TIP for exactly that
      # reason, so it must be free to run even when this PR's diff is empty
      # under databases/openthrottle/migrations/. It costs ~1s.
      #
      # In the merge queue there is no base_ref either, so the base falls back to
      # `main`. HEAD is the queue commit (the `main` tip plus every squash ahead of
      # this entry), so the script stays in branch mode and judges the union of
      # that tree and the `main` tip, which is the real post-merge tree. This is
      # the pass that catches two concurrently queued PRs taking the same prefix.
      #
      # On `push: main` there is no base_ref, HEAD IS the trunk, and the script
      # switches to trunk mode — reporting any non-grandfathered duplicate in
      # the tree. That is the post-merge backstop.
      - name: '🗄️ Migration hygiene (foreign keys + duplicate prefixes)'
        run: pnpm exec nx run monorepo:check-migration-hygiene
        env:
          MIGRATION_COMMENT_LINT_BASE: ${{ github.base_ref || 'main' }}

      # Full-tree (not affected): license risk lives in the whole installed graph,
      # so when this runs it scans every dependency. Both this and the notices
      # guard below are `cache: false` in nx.json (they read the installed
      # node_modules graph, which Nx cannot hash), so they are the only genuinely
      # uncached full-tree work in this job.
      #
      # 💰 Gated on `deps`: the result can only change when the dependency graph
      # or the policy does — pnpm-lock.yaml, any package.json, pnpm-workspace.yaml,
      # or license-policy.json. That is exactly the "dependency bump / lockfile
      # change pulling in copyleft" case this gate exists for. Fails closed.
      # Waivers live in license-policy.json (see CONTRIBUTING.md § Dependency licenses).
      - name: '⚖️ Dependency-license compliance gate'
        if: needs.changes.outputs.deps == 'true'
        run: pnpm exec nx run monorepo:validate-licenses

      # Keep THIRD-PARTY-LICENSES.md (Apache-2.0 §4 attribution manifest) fresh:
      # regenerate from the installed graph and fail if the committed copy drifted.
      # Same `deps` gate and same reason — it is generated FROM the installed graph.
      - name: '📜 THIRD-PARTY-LICENSES freshness guard'
        if: needs.changes.outputs.deps == 'true'
        run: pnpm run validate:notices

      # pnpm-lock.yaml must be a fixed point of pnpm's incremental resolver: in a
      # throwaway copy, `pnpm install --lockfile-only` changes nothing, and adding
      # one probe dependency changes only the probe's importer. A drifted lockfile
      # drags unrelated entries into every later dependency add (OT plan
      # ac971552). `--frozen-lockfile` in node-setup cannot catch this: a drifted
      # lockfile still satisfies every manifest.
      #
      # 💰 A step, not a job: it reuses this job's install and needs no
      # node_modules of its own, only pnpm resolving the lockfile (~3–5s). Gated
      # on `deps`, because only a lockfile, manifest or pnpm-workspace.yaml
      # change can move it. Fails closed, like the two steps above. The Nx target
      # is cached on exactly those inputs.
      - name: '🔒 Lockfile is a fixed point (pnpm-lock.yaml)'
        if: needs.changes.outputs.deps == 'true'
        run: pnpm exec nx run monorepo:check-lockfile

      # 💰 On PRs, check only the files this PR touched; husky pre-commit already
      # formats on the way in, so a whole-tree sweep per PR is re-checking files
      # nobody edited. Non-PR events (push to main, merge_group) still sweep the
      # WHOLE tree, so the "everything on main is formatted" guarantee is kept
      # where it matters and cannot drift silently.
      #
      # Fails closed: if NX_BASE/NX_HEAD are missing or the diff errors, fall back
      # to the full sweep rather than checking nothing.
      - name: '🎨 Prettier format:check'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "${NX_BASE:-}" ] || [ -z "${NX_HEAD:-}" ]; then
            echo "→ full-tree sweep (event=${{ github.event_name }})"
            pnpm exec nx run monorepo:format:check --verbose
            exit 0
          fi

          if ! changed="$(git diff --name-only --diff-filter=ACMR "$NX_BASE" "$NX_HEAD" 2>&1)"; then
            echo "→ full-tree sweep (could not compute the diff; failing closed)"
            pnpm exec nx run monorepo:format:check --verbose
            exit 0
          fi

          # Keep in sync with the glob in nx.json's format:check target.
          formattable="$(echo "$changed" | grep -E '\.(cjs|css|html|js|json|jsx|less|md|mdx|mjs|sass|scss|ts|tsx|yaml|yml)$' || true)"

          if [ -z "$formattable" ]; then
            echo "→ no formattable files changed; nothing to check"
            exit 0
          fi

          echo "→ checking $(echo "$formattable" | wc -l | tr -d ' ') changed file(s)"
          # NUL-delimited so paths containing spaces survive. --ignore-unknown so
          # an ignored or unsupported path cannot fail the step.
          printf '%s\n' "$formattable" | tr '\n' '\0' \
            | xargs -0 pnpm exec prettier --ignore-unknown --check

      # Runs every `audit:*:strict` script except test-coverage, via the glob in
      # the root `audit:strict`. Today that is component-shape (x2), route-shape,
      # workspace-deps and third-party-deps. A new strict audit is gated here the
      # moment it is named `audit:<thing>:strict` — which is why neither
      # `audit:workspace-deps:strict` nor `audit:third-party-deps:strict` needs a
      # step of its own. Note `audit:templates-compliance` has no `:strict`
      # variant and so is NOT in this glob, despite the old step name.
      - name: '🧩 Strict audits (audit:strict)'
        run: pnpm run audit:strict

      # ⏏️ MERGE QUEUE ONLY. Identical to the last step of `build`, which
      # explains why it is safe for the required check. Keep the two in sync.
      # Without it a red gate waits out every build shard before the entry
      # ejects, just as a red shard used to wait out `gates`.
      - name: '⏏️ Cancel this merge-queue run (fast ejection)'
        if: failure() && github.event_name == 'merge_group'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ A gate failed in a merge-queue entry; cancelling run $RUN_ID so ci-success reports red now."
          gh run cancel "$RUN_ID" || echo "⚠️ cancel request refused (run already cancelling?); this job is red either way"

      # 💰 The warn-only test-coverage audit MOVED OUT of the per-PR path to
      # .github/workflows/test-coverage-audit-scheduled.yml (weekly). It is
      # `continue-on-error` and excluded from the blocking `audit:strict`
      # aggregate above, so it gated nothing here. The flip path is preserved
      # verbatim in that workflow's header: when a category's gap closes it comes
      # back HERE as a blocking step and the schedule is deleted.
      # See docs/monorepo/test-coverage-audit.md.

      # - name: '🗄️ Migration COMMENT ON TABLE (diff-scoped)'
      #   run: pnpm exec nx run monorepo:check-migration-table-comments
      #   env:
      #     MIGRATION_COMMENT_LINT_BASE: ${{ github.base_ref || 'main' }}

  # 🔤 Byte budget for model-facing text (OT plan cb4359d4): openthrottle-mcp
  # instructions + tools/list, skills/*/SKILL.md, .agents/prompts. Its own job,
  # NOT a `gates` step, because `gates` skips .md-only PRs and skill/prompt edits
  # are exactly that — it is path-gated on `model_text` instead. It needs only
  # the MCP package's codegen (no build), so it is cheap.
  #
  # Override: a maintainer applies the `model-facing-text-override` label, which
  # downgrades failures to a report. `labeled` is deliberately not a workflow
  # trigger (it would rerun all of CI on every label), so re-run this job after
  # applying it. Growth under the caps needs no label: regenerate the snapshot
  # (`pnpm nx run monorepo:check-model-facing-text -- --write`) and commit it.
  model-facing-text:
    needs: changes
    if: |
      needs.changes.outputs.model_text == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-model-facing-text
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: model-facing-text
          # 💰 Restore-only everywhere. This job adds no Nx task worth keeping,
          # yet each save re-uploaded the whole restored ~215 MB Nx cache under
          # its own key: one more entry per queue entry (a ref nothing can
          # restore) and per main push (a duplicate of `warm`'s). It kept the
          # repo over its 10 GB quota after #724 (OT plan 1d2f247c).
          save-cache: 'false'

      - name: '🔤 Model-facing text byte budget'
        run: pnpm exec nx run monorepo:check-model-facing-text
        env:
          MODEL_FACING_TEXT_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'model-facing-text-override') }}

  # 🌱 Migrations + dev seeds against a REAL, empty Postgres
  # (scripts/check-database-seeds.sh). The seeds are plain SQL, so nothing else
  # checks them against the schema the migrations build: a migration that
  # renames a column a seed writes would otherwise only surface the next time
  # someone ran `database:seed:*` by hand. It applies every migration, runs each
  # seed twice, and fails unless both runs succeed, the second changes no row,
  # and the cms `welcome` layout resolves by slug.
  #
  # 💰 Its own job, not a `build` step, because it needs a Postgres service
  # container that no other job wants. Path-gated on `databases` and skipped on
  # drafts like `build`. Full migration set by nature: the point is to build the
  # schema from nothing. The image matches applications/openthrottle/Dockerfile.Postgres,
  # since the migrations need `vector` and `pg_trgm`.
  database-seeds:
    needs: changes
    if: |
      needs.changes.outputs.databases == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-database-seeds
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: openthrottle
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d openthrottle"
          --health-interval 2s
          --health-retries 30
          --health-timeout 5s
          --shm-size 128mb
        ports:
          - 5432:5432
    env:
      POSTGRES_DB: openthrottle
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ci
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: database-seeds
          # 💰 Restore-only everywhere, for the reason on `model-facing-text`.
          save-cache: 'false'

      - name: '🌱 Migrate an empty database, then run every seed twice'
        run: scripts/check-database-seeds.sh
        env:
          # The `job` context is only available to steps, not to job-level `env`.
          PG_CONTAINER: ${{ job.services.postgres.id }}

  # Stable required-check target. Branch protection should require THIS job
  # ("ci-success"), not a matrix-suffixed leg like `build (1, lint,typecheck,test)`
  # — there are now THREE such legs and their names change with the shard count,
  # which is precisely why the required check must stay this single job.
  # It reports green when the build succeeded OR was legitimately skipped
  # (docs-only PR / draft), and red only when the build failed or was cancelled.
  #
  # `needs.build.result` AGGREGATES the matrix: it is 'success' only when every
  # shard succeeded, and 'failure' if any one of them failed. On a PR
  # (`fail-fast: false`), a red shard therefore still turns this job red while
  # its siblings run to completion.
  #
  # ⏏️ On `merge_group`, a red shard or a red `gates` cancels the whole run
  # instead (the ⏏️ steps). This job still runs, because `always()` survives a
  # cancel, and it reads the canceller as `failure`/`cancelled` and the rest as
  # `cancelled`. NEVER accept `cancelled` below, or a cancelled queue entry
  # could read green on the one required check.
  # ♻️ Runs INSTEAD OF `build` + `gates` on a push to `main` whose exact SHA
  # already went green in the merge queue (`changes` → queue_validated).
  #
  # Why not skip outright: Actions caches are branch-scoped. The queue's caches
  # live under `gh-readonly-queue/*` refs, which neither `main` nor any PR can
  # restore. `main` is the one scope every PR can read, so if nothing on `main`
  # ever ran Node Setup again, a lockfile change would never re-seed the pnpm
  # store and PRs would restore a stale Nx cache forever.
  #
  # Why `typecheck`: it is what PRs reuse. A PR re-runs lint/test only for
  # projects whose inputs it changed, which cannot hit a cache; what DOES hit
  # is the `^build` / `^typecheck` / codegen of unchanged upstream projects,
  # and `typecheck`'s dependsOn pulls exactly those in. One box, nobody waits.
  warm-cache:
    needs: changes
    if: needs.changes.outputs.queue_validated == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      cancel-in-progress: false
      group: continuous-integration-${{ github.ref }}-warm-cache
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: 'blob:none'

      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: warm

      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: '🔥 Warm the Nx cache (codegen + typecheck, affected)'
        run: |
          pnpm exec nx affected --target=codegen-graphql,codegen-react-router --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --target=typecheck --parallel ${{ env.OUTPUT_DEBUG }}

  ci-success:
    needs:
      [
        attribution-guard,
        changes,
        build,
        database-seeds,
        gates,
        model-facing-text,
        warm-cache,
      ]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: '✅ Verify CI outcome'
        run: |
          attribution_result="${{ needs.attribution-guard.result }}"
          changes_result="${{ needs.changes.result }}"
          database_seeds_result="${{ needs.database-seeds.result }}"
          build_result="${{ needs.build.result }}"
          gates_result="${{ needs.gates.result }}"
          model_text_result="${{ needs.model-facing-text.result }}"
          warm_result="${{ needs.warm-cache.result }}"

          echo "attribution-guard: $attribution_result | changes: $changes_result | build: $build_result | gates: $gates_result | database-seeds: $database_seeds_result | model-facing-text: $model_text_result"

          if [ "$changes_result" != "success" ]; then
            echo "❌ changes gate did not succeed ($changes_result)"
            exit 1
          fi

          # 'skipped' is the correct outcome on push/workflow_dispatch, where there
          # is no PR or queue range to inspect. Anything else is a real failure.
          if [ "$attribution_result" != "success" ] && [ "$attribution_result" != "skipped" ]; then
            echo "❌ attribution guard did not succeed ($attribution_result)"
            exit 1
          fi

          # `gates` carries every whole-tree check. It shares `build`'s `if`, so
          # it skips on exactly the same docs-only/draft runs — 'skipped' is a
          # legitimate outcome, anything else is not.
          if [ "$gates_result" != "success" ] && [ "$gates_result" != "skipped" ]; then
            echo "❌ whole-tree gates did not succeed (gates: $gates_result)"
            exit 1
          fi

          # Path-gated on `model_text` and skipped on drafts, so 'skipped' is
          # legitimate; anything else is not.
          # A red warm-cache leaves this push red, so nx-set-shas never treats
          # it as the "last successful" base for the next affected range.
          if [ "$warm_result" != "success" ] && [ "$warm_result" != "skipped" ]; then
            echo "❌ cache warm-up did not succeed ($warm_result)"
            exit 1
          fi

          # Path-gated on `databases` and skipped on drafts, so 'skipped' is
          # legitimate; anything else is not.
          if [ "$database_seeds_result" != "success" ] && [ "$database_seeds_result" != "skipped" ]; then
            echo "❌ migrations + seeds check did not succeed ($database_seeds_result)"
            exit 1
          fi

          if [ "$model_text_result" != "success" ] && [ "$model_text_result" != "skipped" ]; then
            echo "❌ model-facing-text byte budget did not succeed ($model_text_result)"
            exit 1
          fi

          if [ "$build_result" = "success" ] || [ "$build_result" = "skipped" ]; then
            echo "✅ CI gate satisfied (build: $build_result, gates: $gates_result)"
            exit 0
          fi

          echo "❌ CI gate failed (build: $build_result)"
          exit 1

  # 💰 Manual dispatch only, as the trigger comment at the top of this file
  # always said. It was gated on `github.ref == 'refs/heads/main'`, which every
  # push to main satisfies, so it spent ~1.5 min of a runner and saved one more
  # ~215 MB Nx cache entry per merge, for an artifact nobody downloaded.
  nx-dependency-graph:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 💰 Partial clone: fetch the commit graph and trees but NOT historical
          # file contents. `nx affected` / nx-set-shas need to walk history and
          # diff trees, never to read an old blob, so blobs are dead weight here.
          # Any blob that IS needed is fetched lazily on demand. See
          # docs/monorepo/ci-cost.md.
          fetch-depth: 0
          filter: 'blob:none'

      # cache-suffix: a workflow_dispatch run starts this job alongside the build
      # shards at the same commit, so it needs its own exact key too.
      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: dependency-graph

      - name: '📊 Generate dependency graph visualization'
        run: |
          pnpm exec tsx ./scripts/nx-dependency-graph.ts

      - name: '📤 Upload dependency graph artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-graph
          path: |
            ${{ env.OUTPUT_FILE }}
            static/
          retention-days: 30
