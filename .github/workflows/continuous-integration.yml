################################################################################
#
#   This workflow handles our CI/CD for building and publishing packages.
#
#     - https://medium.com/emoteev-blog/10x-faster-ci-with-nx-and-github-actions-9a51fc4e82a6
#     - https://nx.dev/core-features/distribute-task-execution#running-things-in-parallel
#     - https://nx.dev/recipes/ci/monorepo-ci-github-actions#configuring-ci-using-github-actions-and-nx-
#
#
#   💰 RUNNER COST MODEL — every job here runs on `ubuntu-latest`.
#
#   OpenThrottle/monorepo is a PUBLIC repository, and GitHub-hosted standard
#   runners are free with unlimited minutes on public repos. `ubuntu-latest` is
#   4 vCPU / 16 GB — the same core count as the `blacksmith-4vcpu-ubuntu-2204`
#   boxes this workflow used to rent, with double the RAM. Blacksmith bought
#   wall-clock speed (faster clock, sticky-disk caches); it never bought capacity
#   we could not get for $0 here.
#
#   ⚠️  The free tier is a consequence of the repo being PUBLIC. If the canonical
#   repo is ever made private, every `runs-on` in this file starts billing
#   immediately. Do not change `runs-on` to a larger/managed runner without
#   pricing it first — see docs/monorepo/ci-cost.md.
#
################################################################################
name: '🤖 Continuous Integration'
on:
  # workflow_dispatch enables the cost-gated nx-dependency-graph job to be run on demand
  # (it is gated to manual dispatch below) instead of being dead `if: false` code.
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    # ready_for_review: ensures CI fires when a draft PR is marked ready (see draft-skip `if`s below)
    types: [opened, ready_for_review, synchronize]
    # ⚠️ NO paths-ignore here — see the `changes` gate job below.
    # A workflow-level `paths-ignore` means a docs-only PR never TRIGGERS the
    # workflow at all, so `build` (or the `ci-success` gate) never reports a
    # status. Once that check is REQUIRED in branch protection, GitHub shows it
    # as "Expected — waiting for status" forever and the PR can't merge. Instead
    # we always let the workflow run and skip the expensive build *inside* via
    # the `changes` job, while `ci-success` still reports green on docs-only PRs.
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# Concurrency: Cancel in-progress runs when a new commit is pushed to the same ref.
# This prevents wasting resources on outdated runs while allowing parallel matrix jobs.
# EXCEPTION: never cancel on `main`. Consecutive pushes to main share one constant
# group, so cancel-in-progress would kill the older run mid-flight — surfacing as a
# spurious "cancelled" (non-error) result AND leaving that commit only partially
# validated. It matters because `main` is the branch every PR's Actions cache is
# restored from, so a half-validated main commit seeds every downstream build.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: continuous-integration-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 💾 Nx caching is the FREE GitHub Actions cache (`actions/cache` in
  # .github/actions/node-setup), not a paid remote backend. The trusted-`main`-
  # writes / PRs-read-only model that the old GCS bucket implemented with
  # NX_POWERPACK_CACHE_MODE is enforced here *by construction*: Actions cache
  # scoping lets a PR branch READ its base branch's caches but never WRITE into
  # them, and isolates branch caches from each other. Same CREEP-safe guarantee
  # (CVE-2025-36852), no env override to keep in sync, no GCP credentials.
  NX_SWC: 'true'
  OUTPUT_DEBUG: ${{ vars.DEBUG == 'true' && '--verbose' || '' }}
  OUTPUT_DIR: docs/nx/dependency-graphs
  OUTPUT_FILE: dependency-graph.html

# Least-privilege default GITHUB_TOKEN. This workflow only reads the repo,
# queries prior runs, and reads GitHub Packages — it never pushes commits,
# publishes packages, comments on PRs, or edits projects:
#   - actions: read   → nrwl/nx-set-shas queries the last successful `main` run
#   - contents: read  → actions/checkout
#   - packages: read  → node-setup authenticates the @openthrottle GitHub
#                       Packages registry (`.npmrc`) for `pnpm install`
# nx-dependency-graph only uploads an artifact (no extra scope needed).
permissions:
  actions: read
  contents: read
  packages: read

jobs:
  # Cheap path-filter gate. Replaces the old workflow-level `paths-ignore` so the
  # workflow always TRIGGERS (required checks can report), but the expensive
  # `build` below still skips when a PR touches only docs/markdown. Non-PR events
  # (merge_group, push, workflow_dispatch) always run the full build.
  # Native git diff (no third-party action) to match the repo's SHA-pinning posture.
  #
  # 💰 This job must stay cheap — it is one `git diff`. It used to clone the FULL
  # history of a 47 MB repo (`fetch-depth: 0`) to do it. It never needed to: the
  # diff is a two-dot (tree-to-tree) comparison of two known SHAs, which needs
  # only those two commits and their trees, not the commit graph between them.
  # `fetch-depth: 1` plus an explicit depth-1 fetch of both SHAs is sufficient.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 💰 Path gates for the full-tree checks in `build`. Computed here because
      # this job already has the diff and is effectively free — no extra runner.
      # Every gate DEFAULTS TO TRUE for non-PR events and whenever the diff
      # cannot be computed: these are correctness gates, so they fail CLOSED.
      deps: ${{ steps.filter.outputs.deps }}
      graph: ${{ steps.filter.outputs.graph }}
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: '🔎 Detect non-docs changes'
        id: filter
        run: |
          set -euo pipefail

          # Only PRs need doc-only detection; everything else runs the full build.
          # Non-PR events (merge_group, push, workflow_dispatch) run EVERYTHING.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "run=true"
              echo "deps=true"
              echo "graph=true"
            } >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} → run/deps/graph=true (not a pull_request)"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Fetch just the two endpoints (commit + tree, no history). The shallow
          # checkout above has neither: on a pull_request event actions/checkout
          # lands on refs/pull/N/merge, whose parents are absent at depth 1.
          git fetch --no-tags --depth=1 origin "$base" "$head" >/dev/null 2>&1 || true

          # FAIL CLOSED: if the diff cannot be computed for any reason (fetch
          # failed, SHA unreachable after a force-push), run the full build rather
          # than skip it. A skipped build reports GREEN, so guessing wrong in the
          # other direction would wave untested code through.
          if ! changed="$(git diff --name-only "$base" "$head" 2>&1)"; then
            {
              echo "run=true"
              echo "deps=true"
              echo "graph=true"
            } >> "$GITHUB_OUTPUT"
            echo "→ run/deps/graph=true (could not compute the diff; failing closed)"
            echo "$changed"
            exit 0
          fi

          echo "Changed files:"; echo "$changed"

          # Mirror the old paths-ignore (docs/** and **/*.md): if ANY changed file
          # is neither under docs/ nor a .md file, it's real code → run the build.
          if echo "$changed" | grep -vE '(^docs/|\.md$)' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "→ run=true (non-docs changes present)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ run=false (docs/markdown only)"
          fi

          # deps: the installed dependency graph can only change through these.
          # Gates the two uncached full-graph licence scans in `build`.
          if echo "$changed" | grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^license-policy\.json$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
            echo "→ deps=true (dependency graph or licence policy touched)"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
            echo "→ deps=false"
          fi

          # graph: inputs to the Nx project graph, which the circular-dependency
          # check reads. Nothing else can change its result.
          if echo "$changed" | grep -qE '(^|/)package\.json$|(^|/)project\.json$|(^|/)tsconfig[^/]*\.json$|^nx\.json$|^pnpm-workspace\.yaml$'; then
            echo "graph=true" >> "$GITHUB_OUTPUT"
            echo "→ graph=true (project-graph inputs touched)"
          else
            echo "graph=false" >> "$GITHUB_OUTPUT"
            echo "→ graph=false"
          fi

  build:
    needs: changes
    # 💰 Skip CI on draft PRs — push freely while iterating; CI fires when marked
    # "Ready for review". Always runs for merge_group and push (no PR payload there).
    # Also skips when the `changes` gate found only docs/markdown edits.
    if: |
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    # 💰 Cost/wall-clock tradeoffs in this job are priced in
    # docs/monorepo/ci-cost.md — read it before widening any of them.
    # Same main-exception as the workflow-level block above: PRs cancel stale runs,
    # main always runs to completion so no push shows a spurious cancellation.
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: continuous-integration-${{ github.ref }}-build-${{ matrix.target }}-${{ matrix.jobIndex }}
    env:
      # ⚠️ MUST equal the length of `matrix.jobIndex` below. The partitioner exits
      # non-zero if they disagree, rather than letting projects past the end of
      # the list fall off every shard while CI still reports green.
      jobCount: 3
    runs-on: ubuntu-latest

    # 🧩 SHARDING — live since OT plan b19377d1. `lint`/`typecheck`/`test` are
    #   partitioned across 3 `ubuntu-latest` boxes by
    #   `scripts/parallelize-tasks.ts`, which deals the affected projects
    #   round-robin (applications first, so the heavy Vitest suites spread out)
    #   and prints THIS box's Nx `--exclude` selector.
    #
    #   Why 3, from measured runs rather than taste (docs/monorepo/ci-cost.md):
    #   per-box fixed overhead (checkout + install + codegen) is ~1.6 min, only
    #   6–9% of the job, while the shardable affected work was 88–95% of it. The
    #   single-box job hit 28m24s on a fat `main` graph — 95% of the
    #   `timeout-minutes` ceiling below — and one run was cancelled at 28m55s
    #   INSIDE the affected step. A 3-way split projects that worst case to
    #   ~10.6 min; 2 boxes would only reach ~15 min, and a 4th would start paying
    #   setup for shards below the ~5.6 min floor set by the single heaviest
    #   project (whose suite sharding cannot split — see the vmForks note below).
    #
    #   A target-split (`target: [lint, typecheck, test]`) was measured and
    #   REJECTED: it is the right answer only when shards are setup-bound, and it
    #   would leave the ~11-minute `test` graph — the segment that is actually
    #   growing — whole on one box.
    #
    #   Deliberately NOT a `target` × `jobIndex` cross product: that is 9 boxes
    #   for no extra coverage. Keep `target` a single string.
    #
    # 💰 Runner minutes are free on this PUBLIC repo, so the constraint on shard
    # count is wall-clock and queue contention, never spend. If the canonical repo
    # ever goes private, every box here starts billing — reprice before widening.
    strategy:
      # One red shard must not cancel its siblings: a partial matrix tells you
      # far less about a failing PR than three complete results do.
      fail-fast: false
      matrix:
        jobIndex: [1, 2, 3] # ⚠️ must be in sync with "env.jobCount"
        # 💰 No merge queue on this plan, so the ready PR is the gate: drafts run
        # nothing (see job `if` above); every ready-PR push runs the full suite.
        # Single entry on purpose — this is the box label, not a second axis.
        target: ['lint,typecheck,test']

    # openthrottle-developer:test (264 jsdom files) used to cost ~12 CPU-minutes
    # because forks re-imported the full module graph per file, which forced the
    # 15 -> 30 bump. Switching that suite to Vitest's vmForks pool dropped it to
    # ~3 CPU-minutes (~730s -> ~172s user CPU), so the original 15m budget holds.
    #
    # Kept at 30 even though a shard should now finish in ~8 min: this is a
    # per-shard ceiling, and headroom is what stops an unlucky partition (two
    # heavy app suites on one box) from turning a slow run into a red one.
    timeout-minutes: 30

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 💰 Partial clone: fetch the commit graph and trees but NOT historical
          # file contents. `nx affected` / nx-set-shas need to walk history and
          # diff trees, never to read an old blob, so blobs are dead weight here.
          # Any blob that IS needed is fetched lazily on demand. See
          # docs/monorepo/ci-cost.md.
          fetch-depth: 0
          filter: 'blob:none'

      # cache-suffix: all three shards share this commit, so without a
      # discriminator they would race one exact Nx cache key and two of the three
      # saves would be dropped — see .github/actions/node-setup/action.yml.
      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: shard-${{ matrix.jobIndex }}

      # skill-sync's .agents/skills → skills/ symlinks (and the editor fan-out) are
      # generated artifacts, gitignored by design, so a fresh checkout lacks them.
      # Materialize them before the affected tests and the SSOT drift guard, both of
      # which read the fan-out. `--check` (run by check-agent-assets-ssot) then passes.
      - name: '🔗 Materialize agent-skill symlinks (skill-sync)'
        run: bash skills/skill-sync/scripts/sync.sh

      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Runs on EVERY shard, and over the FULL affected set rather than this
      # shard's chunk — generated output is a prerequisite for lint/typecheck, and
      # a shard cannot know which of its projects' generated files a sibling's
      # projects import. Not gated to jobIndex 1 for the same reason the other
      # once-per-run gates are: those gates are extra work, this one is work the
      # box has to do anyway. The `git diff --exit-code` drift assertion is then
      # free, so it runs on all three boxes — strictly more coverage, zero extra
      # runner time.
      - name: '🧩 Codegen Tasks'
        run: |
          # pnpm exec nx run @tools/dotfiles:build --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --target=codegen-graphql,codegen-react-router --parallel ${{ env.OUTPUT_DEBUG }}
          git diff --exit-code

      # 💰 Folded in from a separate job to avoid spinning a second runner per push.
      # Placed before the affected run so structural breakage fails fast.
      # 💰 Gated on project-graph inputs. A cycle can only appear or disappear
      # when package.json / project.json / tsconfig* / nx.json change; editing a
      # function body cannot alter the graph. Fails closed (`graph` is 'true' for
      # non-PR events and whenever the diff could not be computed).
      # 🧩 Once per run (jobIndex == 1): the project graph is identical on every
      # shard, so re-deriving it on all three buys nothing.
      - name: '🔍 Check for circular dependencies'
        if: matrix.jobIndex == 1 && github.actor != 'dependabot[bot]' && needs.changes.outputs.graph == 'true'
        run: |
          pnpm exec tsx ./scripts/nx-circular-dependencies.ts

      # lint + typecheck run at full parallelism — they are not the memory hog.
      # `test` is left at Nx's DEFAULT concurrency (no `--parallel` flag, so 3):
      # every app's Vitest target spawns its own worker pool, and co-running the
      # heavy jsdom suites (esp. openthrottle-developer, now ~675 files) on ONE
      # shared box has historically exceeded its memory ceiling — the OOM-killer
      # then SIGKILLs an in-flight worker, which surfaces as files reporting
      # `(0 test)`. That failure mode is SILENT-PASSING (green CI, tests never ran),
      # which is strictly worse than slow, so the bar for widening is evidence, not
      # reasoning.
      #
      # ⚠️ The commented `--parallel=1` line below is the STRICTER setting, not the
      # live one. Prose in this repo has repeatedly described this step as
      # "serialized (`--parallel=1`)"; it is not, and never has been. Do not
      # "restore" `--parallel=1` on the strength of a doc sentence — decide it on
      # evidence, in either direction.
      #
      # 💰 Three things have since changed the memory calculus, and all argue the
      # concurrency could probably be widened — but none has been demonstrated on
      # the CI box:
      #   1. openthrottle-developer moved to Vitest's `vmForks` pool with
      #      `vmMemoryLimit: '512MB'` (PR #267, OT plan e448a51d), so a reused
      #      worker's V8-VM-context accumulation is now bounded and recycled.
      #   2. `runs-on: ubuntu-latest` (plan 6ced8d0e) doubled available RAM from
      #      Blacksmith's 8 GB at 4 vCPU to 16 GB at 4 vCPU.
      #   3. Sharding (plan b19377d1) means a box now holds ~1/3 of the affected
      #      projects, so there are fewer heavy suites available to co-run at all.
      #
      # DELIBERATELY LEFT AS IS. Sharding is NOT the evidence — it changes which
      # projects share a box, not what happens when two heavy jsdom suites land on
      # the same one, and an unlucky partition can still put two of them together.
      # The evidence required is repeated runs on a 16 GB Linux runner with zero
      # `(0 test)` files and no killed workers; a developer machine with different
      # RAM proves nothing about that ceiling. Revisit by flipping to `--parallel`
      # on a scratch branch, running it several times, and checking every suite
      # reported a non-zero test count. If there is ANY doubt, it stays as it is.
      - name: '🧠 NX ${{ matrix.target }} affected (shard ${{ matrix.jobIndex }}/${{ env.jobCount }})'
        run: |
          set -euo pipefail

          # The partitioner prints THIS box's Nx `--exclude` selector on stdout
          # (empty when the shard drew no projects) and the whole partition on
          # stderr, so the log above is the evidence that the split covered every
          # affected project exactly once. It exits non-zero when
          # matrix.jobIndex / env.jobCount have drifted apart, or when its own
          # selector does not resolve back to exactly the chunk it was built from
          # — the failure that would otherwise be silent-passing.
          selector="$(pnpm exec tsx ./scripts/parallelize-tasks.ts "${{ matrix.jobIndex }}" "${{ env.jobCount }}")"

          # An empty shard is a legitimate no-op (fewer affected projects than
          # shards), but it looks identical to skipping real work, so say which
          # one it is out loud.
          if [ -z "$selector" ]; then
            echo "🫙 Empty shard: the affected set is smaller than jobCount, so box ${{ matrix.jobIndex }} was assigned no projects."
            echo "   This is a no-op, NOT a skip — the partition printed above shows what the other shards took."
            exit 0
          fi

          echo "🧠 shard ${{ matrix.jobIndex }}/${{ env.jobCount }} → $selector"

          # Same two invocations, and the same parallelism split, as the
          # single-box version. Sharding does NOT license un-serializing `test`:
          # that stays evidence-gated (see the note above), and spreading projects
          # across boxes changes nothing about co-running two heavy jsdom suites
          # on ONE box. Which targets run, and how, is the workflow's business —
          # the partitioner only answers "which projects are mine?".
          pnpm exec nx affected --exclude="*,$selector" --target=lint,typecheck,bundle-hooks-check --parallel ${{ env.OUTPUT_DEBUG }}
          pnpm exec nx affected --exclude="*,$selector" --target=test ${{ env.OUTPUT_DEBUG }}
          # pnpm exec nx affected --exclude="*,$selector" --target=test --parallel=1 ${{ env.OUTPUT_DEBUG }}

      # The skill-usage hook core + per-tool adapters now live in the Nx package
      # @openthrottle/agentic-hooks (authored in TS, bundled to committed .cjs),
      # so `nx affected --target=test` above covers them and the drift check runs
      # via check:local:bundle-hooks. See OT plans d3759118 / f5e40886 / 21f150c6.

      # # Phased Vitest gate (P2): openthrottle-server, @openthrottle/openthrottle-mcp, @tools/workflows only.
      # # Full monorepo test remains disabled until openthrottle-developer and other suites are green.
      # - name: '🧪 NX affected Vitest (phased gate)'
      #   run: |
      #     pnpm exec nx affected \
      #       --target=test \
      #       --exclude='*,!openthrottle-server,!@openthrottle/openthrottle-mcp,!@tools/workflows' \
      #       --parallel \
      #       --outputStyle=static \
      #       --verbose \
      #       --nxBail

      # ────────────────────────────────────────────────────────────────────────
      # 🧩 ONCE-PER-RUN GATES — `if: matrix.jobIndex == 1`.
      #
      # These read the whole tree (or the whole installed graph), not this
      # shard's chunk, so their result is identical on every box. Running them
      # on all three would triple the work for zero extra coverage — which is
      # exactly the mistake "just uncomment the shard loop" would have made.
      # They live on shard 1 rather than in a sibling `gates` job because they
      # total ~20s: a separate job would pay ~1.6 min of checkout+install to
      # save ~20s of shard-1 wall-clock, and add a `needs` edge to keep correct.
      #
      # ⚠️ Adding a step below this line? Decide which side it belongs on. A
      # per-chunk check goes ABOVE, without the `if`; a whole-tree check goes
      # here, WITH it.
      # ────────────────────────────────────────────────────────────────────────
      - name: '🔒 GraphQL codegen drift guard (agentic-ralph, openthrottle-mcp)'
        if: matrix.jobIndex == 1
        run: |
          pnpm exec nx run-many --target=verify-graphql-codegen --projects=@openthrottle/openthrottle-agentic-ralph,@openthrottle/openthrottle-mcp

      - name: '🔗 Agent assets SSOT (symlink drift guard)'
        if: matrix.jobIndex == 1
        run: pnpm exec nx run monorepo:check-agent-assets-ssot

      - name: '📋 Agent assets frontmatter validation (D5)'
        if: matrix.jobIndex == 1
        run: pnpm exec nx run monorepo:validate-agent-assets-frontmatter

      # Full-tree (not affected): license risk lives in the whole installed graph,
      # so when this runs it scans every dependency. Both this and the notices
      # guard below are `cache: false` in nx.json (they read the installed
      # node_modules graph, which Nx cannot hash), so they are the only genuinely
      # uncached full-tree work in this job.
      #
      # 💰 Gated on `deps`: the result can only change when the dependency graph
      # or the policy does — pnpm-lock.yaml, any package.json, pnpm-workspace.yaml,
      # or license-policy.json. That is exactly the "dependency bump / lockfile
      # change pulling in copyleft" case this gate exists for. Fails closed.
      # Waivers live in license-policy.json (see CONTRIBUTING.md § Dependency licenses).
      - name: '⚖️ Dependency-license compliance gate'
        if: matrix.jobIndex == 1 && needs.changes.outputs.deps == 'true'
        run: pnpm exec nx run monorepo:validate-licenses

      # Keep THIRD-PARTY-LICENSES.md (Apache-2.0 §4 attribution manifest) fresh:
      # regenerate from the installed graph and fail if the committed copy drifted.
      # Same `deps` gate and same reason — it is generated FROM the installed graph.
      - name: '📜 THIRD-PARTY-LICENSES freshness guard'
        if: matrix.jobIndex == 1 && needs.changes.outputs.deps == 'true'
        run: pnpm run validate:notices

      # 💰 On PRs, check only the files this PR touched; husky pre-commit already
      # formats on the way in, so a whole-tree sweep per PR is re-checking files
      # nobody edited. Non-PR events (push to main, merge_group) still sweep the
      # WHOLE tree, so the "everything on main is formatted" guarantee is kept
      # where it matters and cannot drift silently.
      #
      # Fails closed: if NX_BASE/NX_HEAD are missing or the diff errors, fall back
      # to the full sweep rather than checking nothing.
      - name: '🎨 Prettier format-check'
        if: matrix.jobIndex == 1
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "${NX_BASE:-}" ] || [ -z "${NX_HEAD:-}" ]; then
            echo "→ full-tree sweep (event=${{ github.event_name }})"
            pnpm exec nx run monorepo:format-check --verbose
            exit 0
          fi

          if ! changed="$(git diff --name-only --diff-filter=ACMR "$NX_BASE" "$NX_HEAD" 2>&1)"; then
            echo "→ full-tree sweep (could not compute the diff; failing closed)"
            pnpm exec nx run monorepo:format-check --verbose
            exit 0
          fi

          # Keep in sync with the glob in nx.json's format-check target.
          formattable="$(echo "$changed" | grep -E '\.(cjs|css|html|js|json|jsx|less|md|mdx|mjs|sass|scss|ts|tsx|yaml|yml)$' || true)"

          if [ -z "$formattable" ]; then
            echo "→ no formattable files changed; nothing to check"
            exit 0
          fi

          echo "→ checking $(echo "$formattable" | wc -l | tr -d ' ') changed file(s)"
          # NUL-delimited so paths containing spaces survive. --ignore-unknown so
          # an ignored or unsupported path cannot fail the step.
          printf '%s\n' "$formattable" | tr '\n' '\0' \
            | xargs -0 pnpm exec prettier --ignore-unknown --check

      - name: '🧩 Template compliance audit'
        if: matrix.jobIndex == 1
        run: pnpm run audit:strict

      # 💰 The warn-only test-coverage audit MOVED OUT of the per-PR path to
      # .github/workflows/test-coverage-audit-scheduled.yml (weekly). It is
      # `continue-on-error` and excluded from the blocking `audit:strict`
      # aggregate above, so it gated nothing here. The flip path is preserved
      # verbatim in that workflow's header: when a category's gap closes it comes
      # back HERE as a blocking step and the schedule is deleted.
      # See docs/monorepo/test-coverage-audit.md.

      # - name: '🗄️ Migration COMMENT ON TABLE (diff-scoped)'
      #   run: pnpm exec nx run monorepo:check-migration-table-comments
      #   env:
      #     MIGRATION_COMMENT_LINT_BASE: ${{ github.base_ref || 'main' }}

  # Stable required-check target. Branch protection should require THIS job
  # ("ci-success"), not a matrix-suffixed leg like `build (1, lint,typecheck,test)`
  # — there are now THREE such legs and their names change with the shard count,
  # which is precisely why the required check must stay this single job.
  # It reports green when the build succeeded OR was legitimately skipped
  # (docs-only PR / draft), and red only when the build failed or was cancelled.
  #
  # `needs.build.result` AGGREGATES the matrix: it is 'success' only when every
  # shard succeeded, and 'failure' if any one of them failed. With
  # `fail-fast: false` above, a red shard therefore still turns this job red while
  # its siblings run to completion.
  ci-success:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: '✅ Verify CI outcome'
        run: |
          changes_result="${{ needs.changes.result }}"
          build_result="${{ needs.build.result }}"

          echo "changes: $changes_result | build: $build_result"

          if [ "$changes_result" != "success" ]; then
            echo "❌ changes gate did not succeed ($changes_result)"
            exit 1
          fi

          if [ "$build_result" = "success" ] || [ "$build_result" = "skipped" ]; then
            echo "✅ CI gate satisfied (build: $build_result)"
            exit 0
          fi

          echo "❌ CI gate failed (build: $build_result)"
          exit 1

  nx-dependency-graph:
    # 💰 Cost-gated: manual-only via workflow_dispatch (was `if: false`) so the job stays
    # live/lintable and runnable on demand. Restore the actor/ref guard below to automate.
    # if: ${{ (github.actor != 'dependabot[bot]') && (github.ref_name == 'main') }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: '📦 Checkout the code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 💰 Partial clone: fetch the commit graph and trees but NOT historical
          # file contents. `nx affected` / nx-set-shas need to walk history and
          # diff trees, never to read an old blob, so blobs are dead weight here.
          # Any blob that IS needed is fetched lazily on demand. See
          # docs/monorepo/ci-cost.md.
          fetch-depth: 0
          filter: 'blob:none'

      # cache-suffix: a workflow_dispatch run starts this job alongside the build
      # shards at the same commit, so it needs its own exact key too.
      - name: '🤖 Node Setup'
        uses: ./.github/actions/node-setup
        with:
          cache-suffix: dependency-graph

      - name: '📊 Generate dependency graph visualization'
        run: |
          pnpm exec tsx ./scripts/nx-dependency-graph.ts

      - name: '📤 Upload dependency graph artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph
          path: |
            ${{ env.OUTPUT_FILE }}
            static/
          retention-days: 30
