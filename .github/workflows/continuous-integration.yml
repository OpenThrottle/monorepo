################################################################################
#
#   This workflow handles our CI/CD for building and publishing packages.
#
#     - https://medium.com/emoteev-blog/10x-faster-ci-with-nx-and-github-actions-9a51fc4e82a6
#     - https://nx.dev/core-features/distribute-task-execution#running-things-in-parallel
#     - https://nx.dev/recipes/ci/monorepo-ci-github-actions#configuring-ci-using-github-actions-and-nx-
#
################################################################################
name: "🤖 Continuous Integration"
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Concurrency: Cancel in-progress runs when a new commit is pushed to the same ref
# This prevents wasting resources on outdated runs while allowing parallel matrix jobs
concurrency:
  cancel-in-progress: true
  group: continuous-integration-${{ github.ref }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name || 'main' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # FIXME: Currently we're only making use of the staging project and resources
  GOOGLE_CREDENTIALS: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && secrets.GOOGLE_CREDENTIALS_STAGING || secrets.GOOGLE_CREDENTIALS_STAGING }}
  GOOGLE_PROJECT_ID: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && vars.GOOGLE_PROJECT_ID_STAGING || vars.GOOGLE_PROJECT_ID_STAGING }}
  NX_GCS_BUCKET: ${{ (github.head_ref || github.ref_name || 'main') == 'main' && 'openthrottle-staging-nx-cache' || 'openthrottle-staging-nx-cache' }}

  NX_KEY: ${{ vars.NX_KEY }}
  NX_SWC: "true"
  NX_VERSION: ${{ vars.NX_VERSION }} # https://github.com/visormatt/monorepo/settings/variables/actions
  OUTPUT_DEBUG: ${{ vars.DEBUG == 'true' && '--verbose' || '' }}
  OUTPUT_DIR: docs/nx/dependency-graphs
  OUTPUT_FILE: dependency-graph.html
  RELEASE_DRY_RUN: ${{ (github.head_ref == 'main' || github.ref_name == 'main') && '--verbose' || '--dry-run --verbose' }}
  RELEASE_PUBLISH: ${{ (github.head_ref == 'main' || github.ref_name == 'main') && '--yes' || '--skip-publish' }}

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write
  repository-projects: write

jobs:
  build:
    # if: ${{ (github.head_ref != 'main') && (github.ref_name != 'main') }}

    # FIXME: 💰 Re-enable when we want to spend more
    concurrency:
      cancel-in-progress: true
      group: continuous-integration-${{ github.ref }}-build-${{ matrix.target }}-${{ matrix.jobIndex }}
    env:
      jobCount: 1 # must be in sync with "jobIndex"
    runs-on: blacksmith-4vcpu-ubuntu-2204

    # FIXME: 💰 Increase as needed - balance with cost and time to completion
    strategy:
      matrix:
        jobIndex: [1] # must be in sync with "jobCount"
        target: ["lint,typecheck,typecheck-tests,test"] # One box per target

    # 30 instead of 15: openthrottle-developer:test alone needs ~12 CPU-minutes
    # (264 jsdom test files), which exceeds the old budget on 4-vCPU runners.
    timeout-minutes: 30

    steps:
      - name: "📦 Checkout the code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Inject the dynamic bucket name directly into nx.json
      # Security: By using Strategy 2, you maintain the "Two-Bucket" security model which is the only way to protect your production cache from CREEP (CVE-2025-36852) when using bucket-based remote caching.
      - name: "🪣 NX Setup Cache"
        run: |
          sed -i 's/"bucket": ".*"/"bucket": "${{ env.NX_GCS_BUCKET }}"/' nx.json

      - name: "🤖 Node Setup"
        uses: ./.github/actions/node-setup

      - name: "🌥️ Google Cloud Provider (GCP)"
        uses: ./.github/actions/google-cloud
        with:
          branch: ${{ env.BRANCH_NAME }}
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
          google_cloud_project: ${{ env.GOOGLE_PROJECT_ID }}

      - name: "🕵️‍♂️ NX Setup SHA's"
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # - name: '🔒 GraphQL schema sync (root vs server)'
      #   run: pnpm dlx nx@${{ env.NX_VERSION }} run openthrottle-server:verify-graphql-schema-sync

      - name: "🧩 Codegen Tasks"
        run: |
          pnpm dlx nx@${{ env.NX_VERSION }} affected --target=codegen-graphql,codegen-react-router --parallel ${{ env.OUTPUT_DEBUG }}
          git diff --exit-code

      - name: "🧠 NX ${{ matrix.target }} affected"
        run: |
          pnpm dlx nx@${{ env.NX_VERSION }} affected --target="${{ matrix.target }}" --parallel ${{ env.OUTPUT_DEBUG }}
        # pnpm dlx nx@${{ env.NX_VERSION }} affected --target=lint,typecheck,typecheck-tests --parallel ${{ env.OUTPUT_DEBUG }}
        # pnpm dlx nx@${{ env.NX_VERSION }} affected --target=test --parallel ${{ env.OUTPUT_DEBUG }}

      # # Phased Vitest gate (P2): openthrottle-server, @openthrottle/openthrottle-mcp, @tools/workflows only.
      # # Full monorepo test remains disabled until openthrottle-developer and other suites are green.
      # - name: '🧪 NX affected Vitest (phased gate)'
      #   run: |
      #     pnpm dlx nx@${{ env.NX_VERSION }} affected \
      #       --target=test \
      #       --exclude='*,!openthrottle-server,!@openthrottle/openthrottle-mcp,!@tools/workflows' \
      #       --parallel \
      #       --outputStyle=static \
      #       --verbose \
      #       --nxBail

      - name: "🔒 GraphQL codegen drift guard (agentic-ralph, openthrottle-mcp)"
        run: |
          pnpm dlx nx@${{ env.NX_VERSION }} run-many --target=verify-graphql-codegen --projects=@openthrottle/openthrottle-agentic-ralph,@openthrottle/openthrottle-mcp

      - name: "🔗 Agent assets SSOT (symlink drift guard)"
        run: pnpm dlx nx@${{ env.NX_VERSION }} run monorepo:check-agent-assets-ssot

      - name: "📋 Agent assets frontmatter validation (D5)"
        run: pnpm dlx nx@${{ env.NX_VERSION }} run monorepo:validate-agent-assets-frontmatter

      # FIXME: Bring this back when we have time to investigate
      # - name: '🗄️ Migration COMMENT ON TABLE (diff-scoped)'
      #   run: pnpm dlx nx@${{ env.NX_VERSION }} run monorepo:check-migration-table-comments
      #   env:
      #     MIGRATION_COMMENT_LINT_BASE: ${{ github.base_ref || 'main' }}

      # FIXME: 💰 Re-enable when we want to spend more
      # - name: "🧠 NX ${{ matrix.target }} affected"
      #   run: |
      #     # # 🚧 IMPORTANT 🚧 we pass the "matrix.target" as a string to also handle the "test --coverage" case
      #     # NX_VERSION=${{ env.NX_VERSION }} node --experimental-strip-types ./scripts/parallelize-tasks.ts "${{ matrix.target }}" ${{ matrix.jobIndex }} ${{ env.jobCount }} ${{ github.ref }} | while IFS= read -r line;

      #     NX_VERSION=${{ env.NX_VERSION }} node --experimental-strip-types ./scripts/parallelize-tasks.ts ${{ matrix.target }} ${{ matrix.jobIndex }} ${{ env.jobCount }} ${{ github.ref }} | while IFS= read -r line;
      #       do
      #         read -r tags target <<< `echo $line`;
      #         echo "🧠 Running for $tags | $target";
      #         pnpm dlx nx@${{ env.NX_VERSION }} affected --exclude="*,$tags" --target=$target --parallel --verbose
      #     done

  nx-circular-dependencies:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10

    steps:
      - name: "📦 Checkout the code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: "🤖 Node Setup"
        uses: ./.github/actions/node-setup

      - name: "🌥️ Google Cloud Provider (GCP)"
        uses: ./.github/actions/google-cloud
        with:
          branch: ${{ env.BRANCH_NAME }}
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
          google_cloud_project: ${{ env.GOOGLE_PROJECT_ID }}

      - name: "🔍 Check for circular dependencies"
        run: |
          pnpm exec tsx ./scripts/nx-circular-dependencies.ts

  nx-dependency-graph:
    # FIXME: 💰 Re-enable when we want to spend more
    # if: ${{ (github.actor != 'dependabot[bot]') && (github.ref_name == 'main') }}
    if: false
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10

    steps:
      - name: "📦 Checkout the code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: "🤖 Node Setup"
        uses: ./.github/actions/node-setup

      - name: "🌥️ Google Cloud Provider (GCP)"
        uses: ./.github/actions/google-cloud
        with:
          branch: ${{ env.BRANCH_NAME }}
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
          google_cloud_project: ${{ env.GOOGLE_PROJECT_ID }}

      - name: "📊 Generate dependency graph visualization"
        run: |
          pnpm exec tsx ./scripts/nx-dependency-graph.ts

      - name: "📤 Upload dependency graph artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph
          path: |
            ${{ env.OUTPUT_FILE }}
            static/
          retention-days: 30

