################################################################################
#
#   🧹 Delete Actions caches nothing can restore any more.
#
#   Four jobs, one per kind of dead weight. Left to GitHub's LRU, either one
#   pushes the repo over its 10 GB quota, and the LRU then evicts the `main`
#   entries every PR restores from (OT plans 80b62f5e and 820b4838,
#   docs/monorepo/ci-cost.md).
#
#   `delete-pr-caches` — on PR close. A PR's caches live under
#   `refs/pull/<n>/merge` and can only ever be restored by later runs of that
#   same PR. Each ready push saves four ~215 MB Nx entries (three shards plus
#   `gates`) and, on a lockfile change, a ~336 MB pnpm store. While the PR is
#   open, each job's last step (.github/actions/nx-cache-prune) deletes that
#   job's older Nx entries, so this job only has the last push's set to clear.
#
#   `prune-codeql-overlay` — on every push to `main`. CodeQL default setup
#   (enabled 2026-11-14; it has no workflow file and reports as event
#   `dynamic`) saves a ~520 MB `codeql-overlay-base-database-*` entry on `main`
#   per push. The next CodeQL run restores the newest one and nothing reads the
#   older ones again; eight of them held 4.2 GB when this job was added.
#   Default setup has no setting for it, so this job keeps the newest and
#   deletes the rest. The push's own CodeQL run saves its entry ~10 min after
#   this job runs, so the entry kept is the one the next run will restore, and
#   `main` holds at most two (one live, one landing).
#
#   `prune-nx-warm` — on every push to `main`. CI's `warm-cache` job saves a
#   ~250 MB `cache-nx-Linux-*-warm` entry on `main` per merged PR, and PRs
#   restore only the newest (GitHub returns the most recent prefix match).
#   nx-cache-prune is PR-only, so on 2026-11-25 `main` held 14 of them (~3.5 GB)
#   and the repo sat at 10.5 GB, over quota, with the LRU evicting (OT plan
#   5656aac1). Same shape as the CodeQL job: keep the newest, delete the rest.
#   The push's own `warm-cache` saves after this runs, so `main` holds at most
#   two. A red `warm-cache` saves nothing, so the entry kept is always the
#   last good one.
#
#   `prune-pnpm-store` — on every push to `main`. setup-node (`cache: 'pnpm'`
#   in .github/actions/node-setup) saves a ~456 MiB
#   `node-cache-<os>-x64-pnpm-<lockfile hash>` entry on `main` each time
#   pnpm-lock.yaml changes, and nothing restores an old hash again; on
#   2026-11-25 `main` held four (~1.8 GB), one of them live (OT plan
#   88da480c). This job keeps the entry matching the pushed lockfile's
#   `hashFiles`, plus the newest, and deletes the rest. When the push changed
#   the lockfile, its own CI saves the new entry after this runs, so the newest
#   (the previous lockfile's) is kept until the next push confirms it is dead.
#
#   💰 A few `gh` calls on a standard runner, with no install. Only
#   `prune-pnpm-store` checks anything out, and only pnpm-lock.yaml.
#
################################################################################
name: '🧹 Cache cleanup'

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # `gh cache delete` needs actions: write.
  actions: write

jobs:
  delete-pr-caches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Fork PRs get a read-only token here, so their delete is refused; that
      # is reported and tolerated. Their caches still age out via the LRU.
      - name: '🧹 Delete this PR’s caches'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          echo "Caches on $REF before cleanup:"
          gh cache list --ref "$REF" --limit 100 || true
          gh cache delete --all --ref "$REF" --succeed-on-no-caches \
            || echo "⚠️ delete refused (fork PR with a read-only token?); LRU eviction will reclaim these"

  prune-codeql-overlay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # A newer push makes an in-flight prune redundant: it does the same work
    # against a list that is at least as current.
    concurrency:
      group: prune-codeql-overlay
      cancel-in-progress: true
    steps:
      - name: '🧹 Keep only the newest CodeQL overlay-base cache on main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREFIX: codeql-overlay-base-database-
          REF: refs/heads/main
        run: |
          set -euo pipefail
          ids="$(gh cache list --ref "$REF" --key "$PREFIX" --sort created_at --order desc --limit 100 --json id --jq '.[].id')"
          echo "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ') ${PREFIX}* entries on $REF; keeping the newest."
          printf '%s\n' "$ids" | sed '/^$/d' | tail -n +2 | while read -r id; do
            echo "🗑️ deleting cache $id"
            gh cache delete "$id"
          done

  prune-nx-warm:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: prune-nx-warm
      cancel-in-progress: true
    steps:
      - name: '🧹 Keep only the newest warm Nx cache on main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREFIX: cache-nx-Linux-
          REF: refs/heads/main
          SUFFIX: -warm
        run: |
          set -euo pipefail
          ids="$(gh cache list --ref "$REF" --key "$PREFIX" --sort created_at --order desc --limit 100 --json id,key \
            --jq '.[] | select(.key | endswith(env.SUFFIX)) | .id')"
          echo "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ') ${PREFIX}*${SUFFIX} entries on $REF; keeping the newest."
          printf '%s\n' "$ids" | sed '/^$/d' | tail -n +2 | while read -r id; do
            echo "🗑️ deleting cache $id"
            gh cache delete "$id"
          done

  prune-pnpm-store:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Job-scoped: the checkout below needs contents:read on top of the
    # workflow's actions:write, and job permissions replace the workflow's.
    permissions:
      actions: write
      contents: read
    concurrency:
      group: prune-pnpm-store
      cancel-in-progress: true
    steps:
      # Only the lockfile: `hashFiles` needs it to name the entry this push's
      # installs restore.
      - name: '📦 Checkout pnpm-lock.yaml'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: '🧹 Keep only the current and newest pnpm store caches on main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # The key setup-node writes (`node-cache-<os>-<arch>-pnpm-<lockfile
          # hash>`), and that node-setup's restore-only step mirrors.
          CURRENT: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          LOCK_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          PREFIX: node-cache-
          REF: refs/heads/main
        run: |
          set -euo pipefail
          # An empty hash means no lockfile was found, so CURRENT names nothing
          # real: stop rather than delete the entry every install restores.
          if [ -z "$LOCK_HASH" ]; then
            echo "::error::hashFiles('pnpm-lock.yaml') is empty; refusing to prune"
            exit 1
          fi
          entries="$(gh cache list --ref "$REF" --key "$PREFIX" --sort created_at --order desc --limit 100 --json id,key \
            --jq '.[] | select(.key | contains("-pnpm-")) | "\(.id) \(.key)"')"
          echo "$(printf '%s\n' "$entries" | sed '/^$/d' | wc -l | tr -d ' ') ${PREFIX}*-pnpm-* entries on $REF; keeping $CURRENT and the newest."
          newest="$(printf '%s\n' "$entries" | sed '/^$/d' | head -n 1 | cut -d' ' -f1)"
          printf '%s\n' "$entries" | sed '/^$/d' | while read -r id key; do
            if [ "$key" = "$CURRENT" ] || [ "$id" = "$newest" ]; then
              echo "✅ keeping cache $id ($key)"
              continue
            fi
            echo "🗑️ deleting cache $id ($key)"
            gh cache delete "$id" || echo "⚠️ delete of $id refused; LRU eviction will reclaim it"
          done
