# When docs/ changes land on main (e.g. after PR merge), output the squash commit SHA
# and changed paths under docs/ for the documentation ingest pipeline.
# See plan "Docs folder watch and re-index on main"
name: '📚 Docs watch (main)'
on:
  # 💰 Cost-gated: manual-only for now via workflow_dispatch (was `if: false`), so the job
  # stays live/lintable and runnable on demand. The push trigger documents the intended
  # automation; the job is gated below to manual dispatch to avoid auto-spend until enabled.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

# Read-only: the job only checks out and diffs the merge commit to emit the
# changed docs paths. No explicit block previously → it inherited the broad
# repo default; pin it to read.
permissions:
  contents: read

jobs:
  docs-changed:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      paths: ${{ steps.vars.outputs.paths }}
    steps:
      - name: '📦 Checkout'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: '📤 Set SHA and changed paths'
        id: vars
        run: |
          SHA="${{ github.sha }}"
          PATHS=$(git diff-tree --no-commit-id --name-only -r "$SHA" -- docs/ | jq -R -s -c 'map(select(length > 0))')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHA"
          echo "Paths under docs/: $PATHS"
