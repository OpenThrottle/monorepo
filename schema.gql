  """Add a permission to a role"""
  addPermissionToRole(input: AddPermissionToRoleInput!): Boolean!

  """Remove a permission from a role"""
  removePermissionFromRole(input: RemovePermissionFromRoleInput!): Boolean!

  """Create a service account (admin, human only)."""
  createServiceAccount(input: CreateServiceAccountInput!): ServiceAccountObject!

  """Update a service account (admin, human only)."""
  updateServiceAccount(input: UpdateServiceAccountInput!): ServiceAccountObject

  """Disable a service account (admin, human only)."""
  disableServiceAccount(id: ID!): ServiceAccountObject

  """Re-enable a disabled service account (admin, human only)."""
  enableServiceAccount(id: ID!): ServiceAccountObject

  """Create a credential; returns plaintext token once (admin, human only)."""
  createServiceAccountCredential(input: CreateServiceAccountCredentialInput!): CreateServiceAccountCredentialResultObject

  """Revoke a service account credential (admin, human only)."""
  revokeServiceAccountCredential(credentialId: ID!): Boolean!

  """Assign a role to a service account (admin, human only)."""
  assignRoleToServiceAccount(input: AssignRoleToServiceAccountInput!): Boolean!

  """Remove a role from a service account (admin, human only)."""
  removeRoleFromServiceAccount(input: RemoveRoleFromServiceAccountInput!): Boolean!

  """Create a task"""
  createTask(input: CreateTaskInput!): TaskObject!

